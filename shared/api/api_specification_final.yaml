                            - nextCursor
                            - totalMessageCount
                            - messages
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            totalMessageCount:
                                type: integer
                            nextCursor:
                                type:
                                    - integer
                                    - "null"
                                minimum: 0
                            messages:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Message_Response"
        GetMessageStreamCompletion:
