    responses:
        Error:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - error
                        additionalProperties: false
                        properties:
                            error:
                                type: object
                                required:
                                    - message
                                    - retry
                                additionalProperties: false
                                properties:
                                    message:
                                        type: string
                                        description: A human-readable message providing more details about the error.
                                    retry:
                                        type: object
                                        required:
                                            - able
                                        additionalProperties: false
                                        properties:
                                            able:
                                                type: boolean
                                                description: If true, it indicates that the request should succeed if tried
                                                    again.
        GetMessage:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - message
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            message:
                                $ref: "#/components/schemas/Message_Response"
        GetMessages:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - nextCursor
                            - totalMessageCount
                            - messages
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            totalMessageCount:
                                type: integer
                            nextCursor:
                                type:
                                    - integer
                                    - "null"
                                minimum: 0
                            messages:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Message_Response"
        GetMessageStreamCompletion:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - completion
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            completion:
                                type: object
                                required:
                                    - completedTime
                                additionalProperties: false
                                properties:
                                    completedTime:
                                        $ref: "#/components/schemas/DateTime"
        GetMessageStreamPing:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - ping
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            ping:
                                type: object
                                required:
                                    - lastUpdatedTime
                                additionalProperties: false
                                properties:
                                    lastUpdatedTime:
                                        $ref: "#/components/schemas/DateTime"
        GetMessageStreamPart:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
        GetPost:
