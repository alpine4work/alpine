                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - post
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            post:
                                $ref: "#/components/schemas/Post_Response"
    requestBodies:
