    requestBodies:
        CreateMessage:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - content
                        additionalProperties: false
                        properties:
                            isStream:
                                type: boolean
                            createdTimeZone:
                                $ref: "#/components/schemas/TimeZone"
                            parent:
                                $ref: "#/components/schemas/MessageContentPayloadParent"
                            content:
                                $ref: "#/components/schemas/Content"
                            files:
                                type: array
                                items:
                                    $ref: "#/components/schemas/MessageContentPayloadFile"
        PutMessageStreamPart:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - payload
                        additionalProperties: false
                        properties:
                            payload:
                                $ref: "#/components/schemas/MessageStreamPartPayload"
    schemas:
        LabelString:
            type: string
            minLength: 1
            maxLength: 50
        DateTime:
            type: string
            format: date-time
        TimeZone:
            type: string
        FileContentType:
            type: string
            enum:
                - application/json
                - application/msword
                - application/octet-stream
                - application/pdf
                - application/sql
                - application/vnd.dart
                - application/vnd.ms-excel
                - application/vnd.ms-powerpoint
                - application/vnd.openxmlformats-officedocument.presentationml.presentation
                - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                - application/vnd.openxmlformats-officedocument.wordprocessingml.document
                - application/wasm
                - application/x-httpd-php
                - application/x-powershell
                - application/x-ruby
                - application/x-sh
                - application/xml
                - application/yaml
                - audio/mp4
                - audio/mpeg
                - audio/ogg
                - audio/wav
                - audio/webm
                - image/apng
