        MessageExperimentalApprovalDecisionApprovedForSessionValueScope:
            type: object
            required:
                - value
            additionalProperties: false
            properties:
                value:
                    description: >
                        Groups equivalent approval options so that one selected
                        approval can approve the same pending scope elsewhere in
                        the same message. For example, let's say an agent is
                        asking for approval to make 3 tool calls: `Write` to
                        Document, `WebFetch` to Website, and `Write` to Task,
                        and each approval has an `ApprovedForSession` option
                        with summary `Approve all writes` and `Approve all web
                        fetches`respectively. If the user selects `Approve all
                        writes` on the document approval, the `Write` task
                        approval should also be approved. Agents can also use
                        this key to decide its own tool permissions. This will
                        only work if the rest of the approval option is the same
