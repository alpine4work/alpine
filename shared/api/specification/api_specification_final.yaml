                            notes:
                                $ref: "#/components/schemas/TaskNotes_Response"
        GetMessage:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - message
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            message:
                                $ref: "#/components/schemas/Message_Response"
        GetMessages:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - totalMessageCount
                            - nextCursor
                            - messages
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            totalMessageCount:
                                type: integer
                            nextCursor:
                                type:
                                    - integer
                                    - "null"
                                minimum: 0
                            messages:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Message_Response"
        GetMessageStreamCompletion:
            content:
                application/json:
                    schema:
                        type: object
                        required:
