components:
    responses:
        Error:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - error
                        additionalProperties: false
                        properties:
                            error:
                                type: object
                                required:
                                    - message
                                    - retry
                                additionalProperties: false
                                properties:
                                    message:
                                        type: string
                                        description: A human-readable message providing more details about the error.
                                    retry:
                                        type: object
                                        required:
                                            - able
                                        additionalProperties: false
                                        properties:
                                            able:
                                                type: boolean
                                                description: If true, it indicates that the request should succeed if tried
                                                    again.
        GetChat:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - chat
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            chat:
                                $ref: "#/components/schemas/Chat"
        GetDocument:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - document
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            document:
                                $ref: "#/components/schemas/Document_Response"
        GetTask:
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - spaceId
                            - task
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            task:
                                $ref: "#/components/schemas/Task_Response"
        GetTaskNotes:
            content:
