                    $ref: "#/components/schemas/PostId"

        PostReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"
                title:
                    type: string
                deleted:
                    type: boolean
                private:
                    type: boolean

        TaskReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"

        TaskReference_Response:
            type: object
            required: [type, id, title, status]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"
                title:
                    type: string
                status:
                    $ref: "#/components/schemas/TaskStatus"
