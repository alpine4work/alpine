# This is the source OpenAPI specification for the Alpine REST API. We run a
# couple transformations before we get to the OpenAPI specification we'll share
# with users.
#
# - All comments are stripped from the final specification.
#
# - There are some template variables you can use that'll be replaced (for
#   example `idRegExp` in Mustache curly brackets).
#
# - Schema names that end with an underscore (e.g. `_Response`) are
#   "specializations" of the base type (e.g.
#   `ContentMentionInlineElement_Response` is a specialization of
#   `ContentMentionInlineElement`).
#
#   Specializations create entirely new type hierarchies that use the
#   specialized type instead of the base type. For example, we generate
#   `ContentInlineElement_Response` that references
#   `ContentMentionInlineElement_Response` instead of
#   `ContentMentionInlineElement`.
#
#   We also update any schema references used in request bodies or responses
#   to use the `_Request` or `_Response` specialization respectively if such a
#   specialization is available.

openapi: 3.0.0
info:
    title: Alpine API
    description: The Alpine REST API.
    version: 1.0.0

servers:
    - url: https://api.alpine.inc

paths:
    /specification.yaml:
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/yaml: {}

    # TODO(calebmer, #public-api): Document that if you have a bot and the bot is
    # trying to read an account that was a former member of the space you'll get
    # the account's old data at removal time instead of the latest data.
    /accounts/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/AccountId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [account]
                                additionalProperties: false
                                properties:
                                    account:
                                        $ref: "#/components/schemas/AccountWithoutSpace"

    /accounts/{id}/reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/AccountId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/AccountReference"

    /spaces/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [space]
                                additionalProperties: false
                                properties:
                                    space:
                                        $ref: "#/components/schemas/Space"

    /spaces/{id}/accounts/{accountId}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
            - name: accountId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/AccountId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [account]
                                additionalProperties: false
                                properties:
                                    account:
                                        $ref: "#/components/schemas/Account"

    /spaces/{id}/bots/{botId}/settings:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
            - name: botId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/BotId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [settings]
                                additionalProperties: false
                                properties:
                                    settings:
                                        type: object
                                        required: [values]
                                        additionalProperties: false
                                        properties:
                                            values:
                                                type: object
                                                additionalProperties: true

    /spaces/{id}/accounts/{accountId}/bots/{botId}/settings:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
            - name: accountId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/AccountId"}
            - name: botId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/BotId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [settings]
                                additionalProperties: false
                                properties:
                                    settings:
                                        type: object
                                        required: [values, space]
                                        additionalProperties: false
                                        properties:
                                            values:
                                                type: object
                                                additionalProperties: true
                                            space:
                                                type: object
                                                required: [values]
                                                additionalProperties: false
                                                properties:
                                                    values:
                                                        type: object
                                                        additionalProperties: true

    /chats:
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [spaceId, chat]
                            additionalProperties: false
                            properties:
                                spaceId:
                                    $ref: "#/components/schemas/SpaceId"
                                chat:
                                    $ref: "#/components/schemas/CreateChatRequestBodyChat"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetChat"}

    /chats/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetChat"}

    /chats/{id}/reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/ChatReference"

    # TODO(calebmer, #public-api): Add a `-markdown` variant endpoint for all
    # endpoints that deal with content. This variant should return a string for
    # content instead of an AST. Also add a `-markdown` variant for any `/messages`
    # endpoints (both `GET` and `POST`).
    /chats/{id}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /chats/{id}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: integer
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [Start, End]
                      default: Start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /chats/{id}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /chats/{id}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /chats/{id}/messages/{index}/stream/parts:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        post:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /chats/{id}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /documents:
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [spaceId, document]
                            additionalProperties: false
                            properties:
                                spaceId:
                                    $ref: "#/components/schemas/SpaceId"
                                document:
                                    type: object
                                    required: [title, content]
                                    additionalProperties: false
                                    properties:
                                        creator:
                                            type: object
                                            required: [id]
                                            additionalProperties: false
                                            properties:
                                                id:
                                                    $ref: "#/components/schemas/AccountId"
                                        title:
                                            type: string
                                        content:
                                            $ref: "#/components/schemas/Content"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetDocument"}

    /documents/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetDocument"}
        patch:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [document]
                            additionalProperties: false
                            properties:
                                document:
                                    type: object
                                    required: [version, title, content]
                                    additionalProperties: false
                                    properties:
                                        version:
                                            type: integer
                                        title:
                                            type: string
                                        content:
                                            $ref: "#/components/schemas/Content"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetDocument"}

    /documents/{id}/reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/DocumentReference"

    /documents/{id}/threads/{threadId}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, thread]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    thread:
                                        $ref: "#/components/schemas/DocumentThread"

    /documents/{id}/threads/{threadId}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /documents/{id}/threads/{threadId}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: integer
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [Start, End]
                      default: Start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /documents/{id}/threads/{threadId}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /documents/{id}/threads/{threadId}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /documents/{id}/threads/{threadId}/messages/{index}/stream/parts:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        post:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /documents/{id}/threads/{threadId}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /channels/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChannelId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, channel]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    channel:
                                        $ref: "#/components/schemas/Channel"

    /channels/{id}/reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChannelId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/ChannelReference"

    /posts:
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            # TODO(ifitzsimmons, #ai): Eventually, we'll allow posts to be created
                            # without a channel. That's the reason this endpoint isn't formatted
                            # like `/channels/{id}/posts`. However, since we can't support post
                            # creation outside of channels right now, users are required to provide
                            # a channelId in the request. Going from required to optional will be
                            # a backwards compatible change when the time comes.
                            required: [channelId, content]
                            additionalProperties: false
                            # TODO(ifitzsimmons, #public-api-blocking): Response bodies should be
                            # assignable to request bodies for objects of the same type. So `GetPost`
                            # should be assignable to this request body.
                            properties:
                                channelId:
                                    $ref: "#/components/schemas/ChannelId"
                                createdTimeZone:
                                    $ref: "#/components/schemas/TimeZone"
                                content:
                                    $ref: "#/components/schemas/Content"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetPost"}

    /posts/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetPost"}

    /posts/{id}/reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/PostReference"

    /posts/{id}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /posts/{id}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: integer
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [Start, End]
                      default: Start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /posts/{id}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /posts/{id}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /posts/{id}/messages/{index}/stream/parts:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        post:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /posts/{id}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    # TODO(ifitzsimmons, #ai): Change this interface so that it returns a parsed string
    # representation of the search filters and an indication of whether a particular
    # result matched the search filter or not.
    /spaces/{id}/search:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
        get:
            parameters:
                - name: query
                  in: query
                  required: true
                  schema:
                      type: string
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [results]
                                additionalProperties: false
                                properties:
                                    results:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/SearchResult"

    /tasks/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, task]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    task:
                                        $ref: "#/components/schemas/Task"

    /tasks/{id}/reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/TaskReference"

    /tasks/{id}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /tasks/{id}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: integer
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [Start, End]
                      default: Start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /tasks/{id}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /tasks/{id}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /tasks/{id}/messages/{index}/stream/parts:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        post:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /tasks/{id}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /task-collections/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, taskCollection]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    taskCollection:
                                        $ref: "#/components/schemas/TaskCollection"

    /task-collections/{id}/reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/TaskCollectionReference"

    /task-collections/{id}/tasks:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}

        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: string
                - name: status
                  in: query
                  schema:
                      type: array
                      items:
                          type: string
                          enum: [Open, Closed]
                      maxItems: 2
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, nextCursor, tasks]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    nextCursor:
                                        type: [string, "null"]
                                    tasks:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/TaskWithoutContent"

webhooks:
    bot:
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [spaceId, botAccount, attempt, accessToken, eventId, event]
                            additionalProperties: false
                            properties:
                                spaceId:
                                    $ref: "#/components/schemas/SpaceId"
                                botAccount:
                                    type: object
                                    required: [id, bot]
                                    additionalProperties: false
                                    properties:
                                        id:
                                            $ref: "#/components/schemas/AccountId"
                                        bot:
                                            type: object
                                            required: [id]
                                            additionalProperties: false
                                            properties:
                                                id:
                                                    $ref: "#/components/schemas/BotId"
                                attempt:
                                    type: integer
                                    minimum: 1
                                accessToken:
                                    type: string
                                eventId:
                                    $ref: "#/components/schemas/BotWebhookEventId"
                                event:
                                    $ref: "#/components/schemas/BotWebhookEvent"
            responses:
                "200":
                    description:
                        Return a 200 status to indicate that the data was received successfully

components:
    responses:
        Error:
            content:
                application/json:
                    schema:
                        type: object
                        required: [error]
                        additionalProperties: false
                        properties:
                            error:
                                type: object
                                required: [message, retry]
                                additionalProperties: false
                                properties:
                                    message:
                                        type: string
                                        description:
                                            A human-readable message providing more details about
                                            the error.
                                    retry:
                                        type: object
                                        required: [able]
                                        additionalProperties: false
                                        properties:
                                            able:
                                                type: boolean
                                                description:
                                                    If true, it indicates that the request should
                                                    succeed if tried again.

        GetChat:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, chat]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            chat:
                                $ref: "#/components/schemas/Chat"

        GetDocument:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, document]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            document:
                                $ref: "#/components/schemas/Document"

        GetMessage:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, message]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            message:
                                $ref: "#/components/schemas/Message"

        GetMessages:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, totalMessageCount, nextCursor, messages]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            totalMessageCount:
                                type: integer
                            nextCursor:
                                type: [integer, "null"]
                                minimum: 0
                            messages:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Message"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/completion` endpoints but the
        # intention is to add that endpoint and for it to return the same type as the
        # `PUT` endpoint.
        GetMessageStreamCompletion:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, completion]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            completion:
                                type: object
                                required: [completedTime]
                                additionalProperties: false
                                properties:
                                    completedTime:
                                        $ref: "#/components/schemas/DateTime"

        # NOTE(ifitzsimmons, 2025-11-14): If a client tries pinging a stream after it's
        # been completed, we don't throw an error. Instead, we return the completed time
        # and the last stream ping time (without updating the last stream ping time).
        GetMessageStreamPing:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, ping]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            ping:
                                type: object
                                required: [lastUpdatedTime]
                                additionalProperties: false
                                properties:
                                    lastUpdatedTime:
                                        $ref: "#/components/schemas/DateTime"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/parts/{partIndex}` endpoints but
        # the intention is to add that endpoint and for it to return the same type as
        # the `PUT` endpoint.
        GetMessageStreamPart:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"

        GetPost:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, post]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            post:
                                $ref: "#/components/schemas/Post"

    requestBodies:
        # TODO(ifitzsimmons, #public-api-blocking): Response bodies should be
        # assignable to request bodies for objects of the same type. So `GetMessage`
        # should be assignable to `CreateMessage`.
        #
        # This means we need to nest these properties in a `message` object right?
        CreateMessage:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [content]
                        additionalProperties: false
                        properties:
                            createdTimeZone:
                                $ref: "#/components/schemas/TimeZone"
                            parent:
                                $ref: "#/components/schemas/MessageContentPayloadParent"
                            content:
                                $ref: "#/components/schemas/Content"
                            isStream:
                                type: boolean

        # TODO(ifitzsimmons, #public-api-blocking): Response bodies should be
        # assignable to request bodies for objects of the same type. So
        # `GetMessageStreamPart` should be assignable to `PutMessageStreamPart`.
        PutMessageStreamPart:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [payload]
                        additionalProperties: false
                        properties:
                            payload:
                                $ref: "#/components/schemas/MessageStreamPartPayload"

    schemas:
        LabelString:
            type: string
            minLength: 1
            maxLength: {{maxLabelStringLength}}

        DateTime:
            type: string
            format: date-time

        TimeZone:
            type: string

        FileContentType:
            type: string
            enum: {{fileContentTypes}}

        # =========================================================================== #
        #                                     IDs                                     #
        # =========================================================================== #
        #
        # Ordered alphabetically assuming `Id` isn't appended as a suffix. e.g.
        # `TaskId` comes before `TaskCollectionId` even though `C` comes before `I` in
        # the alphabet.

        AccountId:
            type: string
            pattern: ^{{idRegExp}}$

        BotId:
            type: string
            pattern: ^{{idRegExp}}$

        BotWebhookEventId:
            type: string
            pattern: ^{{idRegExp}}$

        ChannelId:
            type: string
            pattern: ^{{idRegExp}}$

        ChatId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentThreadId:
            type: string
            pattern: ^{{idRegExp}}$

        FileId:
            type: string
            pattern: ^{{idRegExp}}$

        PostId:
            type: string
            pattern: ^{{idRegExp}}$

        SpaceId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskCollectionId:
            type: string
            pattern: ^{{idRegExp}}$

        # =========================================================================== #
        #                                 References                                  #
        # =========================================================================== #

        AccountReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Account
                id:
                    $ref: "#/components/schemas/AccountId"

        AccountReference_Response:
            type: object
            required: [type, id, title, shortName]
            additionalProperties: false
            properties: &accountReferenceResponseProperties
                type:
                    const: Account
                id:
                    $ref: "#/components/schemas/AccountId"
                # NOCOMMIT: Make sure `title` is the long name in mentions
                title:
                    type: string
                # NOCOMMIT: Make sure we return `botId` when returning an account target! Mentions + search results.
                shortName:
                    $ref: "#/components/schemas/LabelString"
                bot:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/BotId"

        ChannelReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"

        ChannelReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"
                title:
                    type: string

        ChatReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"

        ChatReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"
                title:
                    type: string

        DocumentReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Document
                id:
                    $ref: "#/components/schemas/DocumentId"

        DocumentReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Document
                id:
                    $ref: "#/components/schemas/DocumentId"
                title:
                    type: string

        PostReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"

        PostReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"
                title:
                    type: string

        TaskReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"

        TaskReference_Response:
            type: object
            required: [type, id, title, status]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"
                title:
                    type: string
                status:
                    $ref: "#/components/schemas/TaskStatus"

        TaskCollectionReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"

        TaskCollectionReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"
                title:
                    type: string

        MentionReference:
            oneOf:
                - $ref: "#/components/schemas/AccountReference"
                - $ref: "#/components/schemas/ChannelReference"
                - $ref: "#/components/schemas/ChatReference"
                - $ref: "#/components/schemas/DocumentReference"
                - $ref: "#/components/schemas/PostReference"
                - $ref: "#/components/schemas/TaskReference"
                - $ref: "#/components/schemas/TaskCollectionReference"
            discriminator:
                propertyName: type
                mapping:
                    Account: "#/components/schemas/AccountReference"
                    Channel: "#/components/schemas/ChannelReference"
                    Chat: "#/components/schemas/ChatReference"
                    Document: "#/components/schemas/DocumentReference"
                    Post: "#/components/schemas/PostReference"
                    Task: "#/components/schemas/TaskReference"
                    TaskCollection: "#/components/schemas/TaskCollectionReference"

        PreviewReference:
            oneOf:
                - $ref: "#/components/schemas/ChannelReference"
                - $ref: "#/components/schemas/ChatReference"
                - $ref: "#/components/schemas/DocumentReference"
                - $ref: "#/components/schemas/PostReference"
                - $ref: "#/components/schemas/TaskReference"
                - $ref: "#/components/schemas/TaskCollectionReference"
            discriminator:
                propertyName: type
                mapping:
                    Channel: "#/components/schemas/ChannelReference"
                    Chat: "#/components/schemas/ChatReference"
                    Document: "#/components/schemas/DocumentReference"
                    Post: "#/components/schemas/PostReference"
                    Task: "#/components/schemas/TaskReference"
                    TaskCollection: "#/components/schemas/TaskCollectionReference"

        # =========================================================================== #
        #                                   Content                                   #
        # =========================================================================== #

        Content:
            type: object
            additionalProperties: false
            required: [elements]
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentBlockElement"

        ContentBlockElement:
            # TODO(calebmer, #public-api): We need to be able to add items without breaking
            # backwards compatibility. When publishing the API, let's figure out what our
            # schema evolution policy is.
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentHeadingBlockElement"
                - $ref: "#/components/schemas/ContentDividerBlockElement"
                - $ref: "#/components/schemas/ContentTableBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
                - $ref: "#/components/schemas/ContentFileBlockElement"
                - $ref: "#/components/schemas/ContentFileGalleryBlockElement"
                - $ref: "#/components/schemas/ContentFileFloatBlockElement"
                - $ref: "#/components/schemas/ContentPreviewBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Heading: "#/components/schemas/ContentHeadingBlockElement"
                    Divider: "#/components/schemas/ContentDividerBlockElement"
                    Table: "#/components/schemas/ContentTableBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"
                    File: "#/components/schemas/ContentFileBlockElement"
                    FileGallery: "#/components/schemas/ContentFileGalleryBlockElement"
                    FileFloat: "#/components/schemas/ContentFileFloatBlockElement"
                    Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentParagraphBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Paragraph
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentListBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentUnorderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: UnorderedList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentOrderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: OrderedList
                orderStart:
                    type: integer
                    minimum: 1
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentCheckListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: CheckList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCheckListBlockElementItem"

        ContentListBlockElementItem:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                # TODO(calebmer, #public-api): If `elements` is an empty array then this is a
                # "phantom" list item. Phantom list items exist purely to increase the
                # indentation level of their children and aren't rendered as a list item
                # themselves. There's no bullet! An `elements` array with an empty paragraph
                # does render an item.
                #
                # We need to clearly document this behavior in our API documentation.
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentCheckListBlockElementItem:
            type: object
            required: [checked, elements]
            additionalProperties: false
            properties:
                checked:
                    type: boolean
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentQuoteBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Quote
                elements:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentQuoteBlockElementBlockElement"

        ContentQuoteBlockElementBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentHeadingBlockElement:
            type: object
            required: [type, level, elements]
            additionalProperties: false
            properties:
                type:
                    const: Heading
                level:
                    type: integer
                    minimum: 1
                    maximum: 3
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentDividerBlockElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Divider

        ContentTableBlockElement:
            type: object
            required: [type, width, columns, rows]
            additionalProperties: false
            properties:
                type:
                    const: Table
                width:
                    type: number
                hasHeaderRow:
                    type: boolean
                hasHeaderColumn:
                    type: boolean
                columns:
                    type: array
                    minItems: 2
                    items:
                        type: object
                        required: [width]
                        additionalProperties: false
                        properties:
                            width:
                                type: number
                rows:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementRow"

        ContentTableBlockElementRow:
            type: object
            required: [cells]
            additionalProperties: false
            properties:
                cells:
                    type: array
                    minItems: 2
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCell"

        ContentTableBlockElementCell:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCellBlockElement"

        ContentTableBlockElementCellBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
                - $ref: "#/components/schemas/ContentFileBlockElement"
                - $ref: "#/components/schemas/ContentPreviewBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"
                    File: "#/components/schemas/ContentFileBlockElement"
                    Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentCodeBlockElement:
            type: object
            required: [type, language, lines]
            additionalProperties: false
            properties:
                type:
                    const: Code
                language:
                    type: string
                    enum: {{codeBlockLanguageIds}}
                lines:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementLine"

        ContentCodeBlockElementLine:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElement"

        ContentFileBlockElement:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: File
                id:
                    $ref: "#/components/schemas/FileId"

        ContentFileBlockElement_Response:
            type: object
            required: [type, id, contentType, contentLength]
            additionalProperties: false
            properties:
                type:
                    const: File
                id:
                    $ref: "#/components/schemas/FileId"
                contentType:
                    $ref: "#/components/schemas/FileContentType"
                contentLength:
                    type: integer
                    minimum: 0

        ContentPreviewBlockElement:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Preview
                reference:
                    $ref: "#/components/schemas/PreviewReference"

        ContentFileGalleryBlockElement:
            type: object
            required: [type, rows]
            additionalProperties: false
            properties:
                type:
                    const: FileGallery
                rows:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentFileGalleryBlockElementRow"

        ContentFileGalleryBlockElementRow:
            type: object
            required: [items]
            additionalProperties: false
            properties:
                items:
                    type: array
                    minItems: 1
                    maxItems: 3
                    items:
                        $ref: "#/components/schemas/ContentFileGalleryBlockElementRowItem"

        ContentFileGalleryBlockElementRowItem:
            type: object
            required: [element]
            additionalProperties: false
            properties:
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentFileGalleryBlockElementRowItem_Response:
            type: object
            required: [width, element]
            additionalProperties: false
            properties:
                width:
                    type: number
                    minimum: 0
                    maximum: 1
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentFileFloatBlockElement:
            type: object
            required: [type, side, element]
            additionalProperties: false
            properties:
                type:
                    const: FileFloat
                side:
                    type: string
                    enum: [Left, Right]
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentInlineElement:
            oneOf:
                - $ref: "#/components/schemas/ContentTextInlineElement"
                - $ref: "#/components/schemas/ContentBreakInlineElement"
                - $ref: "#/components/schemas/ContentMentionInlineElement"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/ContentTextInlineElement"
                    Break: "#/components/schemas/ContentBreakInlineElement"
                    Mention: "#/components/schemas/ContentMentionInlineElement"

        ContentTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                # TODO(calebmer, #public-api): Document that marks are an unordered set. Mark
                # order doesn't matter and duplicates aren't allowed.
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentBreakInlineElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Break
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentMentionInlineElement:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                # TODO(calebmer, #public-api): Document that `title` is loaded using the search
                # index so may be stale by up to 90s! (60s for slow document reindexing + 10s
                # for OpenSearch refresh interval. Say 90s to give us enough buffer.)
                reference:
                    $ref: "#/components/schemas/MentionReference"
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementBoldMark"
                - $ref: "#/components/schemas/ContentInlineElementItalicMark"
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementLinkMark"
                - $ref: "#/components/schemas/ContentInlineElementCodeMark"
                - $ref: "#/components/schemas/ContentInlineElementHighlightMark"
                - $ref: "#/components/schemas/ContentInlineElementCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentInlineElementBoldMark"
                    Italic: "#/components/schemas/ContentInlineElementItalicMark"
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Link: "#/components/schemas/ContentInlineElementLinkMark"
                    Code: "#/components/schemas/ContentInlineElementCodeMark"
                    Highlight: "#/components/schemas/ContentInlineElementHighlightMark"
                    Comment: "#/components/schemas/ContentInlineElementCommentMark"

        ContentInlineElementBoldMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Bold

        ContentInlineElementItalicMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Italic

        ContentInlineElementStrikeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Strike

        ContentInlineElementLinkMark:
            type: object
            required: [type, url]
            additionalProperties: false
            properties:
                type:
                    const: Link
                url:
                    type: string

        ContentInlineElementCodeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Code

        ContentInlineElementHighlightMark:
            type: object
            required: [type, color]
            additionalProperties: false
            properties:
                type:
                    const: Highlight
                color:
                    $ref: "#/components/schemas/ContentInlineElementHighlightMarkColor"

        ContentInlineElementHighlightMarkColor:
            type: string
            enum:
                - Red
                - Orange
                - Green
                - Blue
                - Purple

        ContentInlineElementCommentMark:
            type: object
            required: [type, threadId]
            additionalProperties: false
            properties:
                type:
                    const: Comment
                thread:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/DocumentThreadId"

        ContentCodeBlockElementTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                    pattern: ^[^\n\r]*$
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElementMark"

        ContentCodeBlockElementTextInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementBoldMark"
                - $ref: "#/components/schemas/ContentInlineElementItalicMark"
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementLinkMark"
                - $ref: "#/components/schemas/ContentInlineElementHighlightMark"
                - $ref: "#/components/schemas/ContentInlineElementCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentInlineElementBoldMark"
                    Italic: "#/components/schemas/ContentInlineElementItalicMark"
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Link: "#/components/schemas/ContentInlineElementLinkMark"
                    Highlight: "#/components/schemas/ContentInlineElementHighlightMark"
                    Comment: "#/components/schemas/ContentInlineElementCommentMark"

        # =========================================================================== #
        #                                  Entities                                   #
        # =========================================================================== #

        AccountWithoutSpace:
            type: object
            required: [id, name, shortName]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    $ref: "#/components/schemas/LabelString"
                bot:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/BotId"

        Space:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/SpaceId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Account:
            type: object
            required: [id, name, shortName, space]
            additionalProperties: false
            properties: &accountProperties
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    $ref: "#/components/schemas/LabelString"
                bot:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/BotId"
                space:
                    $ref: "#/components/schemas/AccountSpace"

        AccountSpace:
            type: object
            required: [role, addedTime]
            additionalProperties: false
            properties:
                role:
                    type: string
                    enum: [Owner, Admin, Member]
                addedTime:
                    $ref: "#/components/schemas/DateTime"
                # TODO(calebmer, #public-api-blocking): Switch this to `state` and add an
                # `Active` variant.
                inactive:
                    oneOf:
                        - type: object
                          required: [type]
                          additionalProperties: false
                          properties:
                              type:
                                  const: Removed
                              removedTime:
                                  $ref: "#/components/schemas/DateTime"
                        - type: object
                          required: [type]
                          additionalProperties: false
                          properties:
                              type:
                                  const: InvitePending

        Chat:
            oneOf:
                - $ref: "#/components/schemas/DirectChat"
                - $ref: "#/components/schemas/RoomChat"
            discriminator:
                propertyName: type
                mapping:
                    Direct: "#/components/schemas/DirectChat"
                    Room: "#/components/schemas/RoomChat"

        DirectChat:
            type: object
            required: [type, id, members, reference]
            additionalProperties: false
            properties:
                type:
                    const: Direct
                id:
                    $ref: "#/components/schemas/ChatId"
                members:
                    type: array
                    items:
                        type: object
                        required: [account]
                        additionalProperties: false
                        properties:
                            account:
                                $ref: "#/components/schemas/Account"
                # TODO(#public-api): Document how this is the same as the chat's `title` when
                # displayed as a mention.
                reference:
                    type: object
                    required: [title]
                    additionalProperties: false
                    properties:
                        title:
                            type: string

        RoomChat:
            type: object
            required: [type, id, name]
            additionalProperties: false
            properties:
                type:
                    const: Room
                id:
                    $ref: "#/components/schemas/ChatId"
                name:
                    $ref: "#/components/schemas/LabelString"

        CreateChatRequestBodyChat:
            oneOf:
                - $ref: "#/components/schemas/CreateChatRequestBodyDirectChat"
                - $ref: "#/components/schemas/CreateChatRequestBodyRoomChat"
            discriminator:
                propertyName: type
                mapping:
                    Direct: "#/components/schemas/CreateChatRequestBodyDirectChat"
                    Room: "#/components/schemas/CreateChatRequestBodyRoomChat"

        CreateChatRequestBodyDirectChat:
            type: object
            required: [type, members]
            additionalProperties: false
            properties:
                type:
                    const: Direct
                # TODO(#public-api): Should we add additional properties from `DirectChat` here
                # so if you pass in a `DirectChat` object, it would work?
                members:
                    type: array
                    items:
                        type: object
                        required: [account]
                        additionalProperties: false
                        properties:
                            account:
                                type: object
                                required: [id]
                                additionalProperties: false
                                properties:
                                    id:
                                        $ref: "#/components/schemas/AccountId"
                                    # Allow properties from `Account` or `AccountReference` when declaring this
                                    # account. These properties are ignored but it allows you to pass an object
                                    # from the API response in as input.
                                    #
                                    # TODO(#public-api): Make sure these properties are hidden in the
                                    # documentation!
                                    <<: [*accountProperties, *accountReferenceResponseProperties]

        CreateChatRequestBodyRoomChat:
            type: object
            required: [type, name]
            additionalProperties: false
            properties:
                type:
                    const: Room
                # TODO(#public-api): Should we add additional properties from `RoomChat` here
                # so if you pass in a `RoomChat` object, it would work?
                name:
                    $ref: "#/components/schemas/LabelString"

        Document:
            type: object
            required: [id, version, title, content]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentId"
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                version:
                    type: integer
                    minimum: 0
                title:
                    type: string
                content:
                    $ref: "#/components/schemas/Content"

        DocumentPreview:
            type: object
            required: [id, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentId"
                title:
                    type: string

        DocumentThread:
            type: object
            required:
                [
                    id,
                    createdTime,
                    isResolved,
                    commentCount,
                    firstCommentAuthor,
                    documentContentSnippet,
                ]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentThreadId"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                isResolved:
                    type: boolean
                commentCount:
                    type: integer
                    minimum: 0
                firstCommentAuthor:
                    oneOf:
                        - $ref: "#/components/schemas/Account"
                        - type: "null"
                documentContentSnippet:
                    $ref: "#/components/schemas/Content"

        ChannelPreview:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Channel:
            type: object
            required: [id, name, description]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"
                description:
                    $ref: "#/components/schemas/Content"

        Post:
            type: object
            # `channel` is intentionally optional since we may allow users to create posts
            # that aren't in a channel in the future.
            required: [id, author, createdTime, createdTimeZone, content, reference]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/PostId"
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                channel:
                    $ref: "#/components/schemas/ChannelPreview"
                content:
                    $ref: "#/components/schemas/Content"
                # TODO(#public-api): Document how this is the same as the chat's `title` when
                # displayed as a mention.
                reference:
                    type: object
                    required: [title]
                    additionalProperties: false
                    properties:
                        title:
                            type: string

        Task:
            type: object
            required: [id, status, title, content]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                assignee:
                    $ref: "#/components/schemas/Account"
                due:
                    type: object
                    required: [date]
                    additionalProperties: false
                    properties:
                        date:
                            type: string
                            format: date
                priority:
                    type: string
                    enum: [Low, Medium, High, Urgent]
                content:
                    $ref: "#/components/schemas/Content"

        TaskWithoutContent:
            type: object
            required: [id, status, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                assignee:
                    $ref: "#/components/schemas/Account"
                due:
                    type: object
                    required: [date]
                    additionalProperties: false
                    properties:
                        date:
                            type: string
                            format: date
                priority:
                    type: string
                    enum: [Low, Medium, High, Urgent]

        TaskPreview:
            type: object
            required: [id, status, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string

        TaskStatus:
            oneOf:
                - type: object
                  required: [type, isActive]
                  additionalProperties: false
                  properties:
                      type:
                          const: Open
                      isActive:
                          type: boolean
                - type: object
                  required: [type]
                  additionalProperties: false
                  properties:
                      type:
                          const: Closed

        TaskCollection:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskCollectionId"
                name:
                    $ref: "#/components/schemas/LabelString"

        # =========================================================================== #
        #                                  Messages                                   #
        # =========================================================================== #

        Message:
            type: object
            required: [index, author, createdTime, createdTimeZone, payload]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                payload:
                    $ref: "#/components/schemas/MessagePayload"

        MessagePayload:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayload"
                - $ref: "#/components/schemas/MessageDeletedPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageContentPayload"
                    Deleted: "#/components/schemas/MessageDeletedPayload"

        MessageContentPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                parent:
                    $ref: "#/components/schemas/MessageContentPayloadParent"
                content:
                    $ref: "#/components/schemas/Content"

        MessageContentPayloadParent:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayloadMessageParent"
                - $ref: "#/components/schemas/MessageContentPayloadPostParent"
            discriminator:
                propertyName: type
                mapping:
                    Message: "#/components/schemas/MessageContentPayloadMessageParent"
                    Post: "#/components/schemas/MessageContentPayloadPostParent"

        # TODO(calebmer, #api): Files? How do we get AI to read any attached files?

        MessageContentPayloadMessageParent:
            type: object
            required: [type, index]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                    minimum: 0

        MessageContentPayloadMessageParent_Response:
            type: object
            required: [type, index, author, contentSnippet]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                    minimum: 0
                # NOTE(ifitzsimmons, #api): Alpine users can reply to a selection of content that
                # that can span across more than 1 message (we refer to this as a "range"). If the
                # parent is a "range", the `index` is the start index of the range the `endIndex`
                # will be a positive integer (instead of undefined).
                endIndex:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                contentSnippet:
                    $ref: "#/components/schemas/MessageContentPayloadParentContentSnippet"

        MessageContentPayloadPostParent:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Post

        # TODO(ifitzsimmons, #public-api): We don't actually return the range information for
        # now. In order for a client to use the actual range, we need to return the start
        # and end index *along with the content version*. Eventually, we should encode these
        # into `postSelectionId` – but I don't think we should expose the range in the meantime.
        # In terms of our agents, we can use the `isTruncated` property to determine whether we
        # need to fetch the whole post. The full message and the truncated message should give
        # the agent enough context to reply to the request.
        MessageContentPayloadPostParent_Response:
            type: object
            required: [type, author, contentSnippet]
            additionalProperties: false
            properties:
                type:
                    const: Post
                author:
                    $ref: "#/components/schemas/Account"
                contentSnippet:
                    $ref: "#/components/schemas/MessageContentPayloadParentContentSnippet"

        MessageDeletedPayload:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Deleted

        MessageStreamPart:
            type: object
            required: [index, createdTime, version, payload]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                createdTime:
                    type: string
                    format: date-time
                version:
                    type: integer
                    minimum: 0
                payload:
                    $ref: "#/components/schemas/MessageStreamPartPayload"

        MessageStreamPartPayload:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamContentPartPayload"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayload"
                - $ref: "#/components/schemas/MessageStreamReasoningPartPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageStreamContentPartPayload"
                    ToolCall: "#/components/schemas/MessageStreamToolCallPartPayload"
                    Reasoning: "#/components/schemas/MessageStreamReasoningPartPayload"

        MessageStreamContentPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamReasoningPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Reasoning
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamToolCallPartPayload:
            type: object
            required: [type, call]
            additionalProperties: false
            properties:
                type:
                    const: ToolCall
                call:
                    $ref: "#/components/schemas/MessageStreamToolCallPartPayloadCall"

        MessageStreamToolCallPartPayloadCall:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadCreateCall"
            discriminator:
                propertyName: type
                mapping:
                    Read: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                    Search: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"
                    Create: "#/components/schemas/MessageStreamToolCallPartPayloadCreateCall"

        MessageStreamToolCallPartPayloadReadCall:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Read
                reference:
                    $ref: "#/components/schemas/MentionReference"

        MessageStreamToolCallPartPayloadSearchCall:
            type: object
            required: [type, query]
            additionalProperties: false
            properties:
                type:
                    const: Search
                query:
                    type: string

        MessageStreamToolCallPartPayloadCreateCall:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Create
                reference:
                    $ref: "#/components/schemas/MessageStreamToolCallPartCreateCallReference"

        MessageStreamToolCallPartCreateCallReference:
            oneOf:
                - $ref: "#/components/schemas/DocumentReference"
                - $ref: "#/components/schemas/PostReference"
                - $ref: "#/components/schemas/TaskReference"
                - $ref: "#/components/schemas/TaskCollectionReference"
            discriminator:
                propertyName: type
                mapping:
                    Document: "#/components/schemas/DocumentReference"
                    Post: "#/components/schemas/PostReference"
                    Task: "#/components/schemas/TaskReference"
                    TaskCollection: "#/components/schemas/TaskCollectionReference"

        # =========================================================================== #
        #                                  Webhooks                                   #
        # =========================================================================== #

        BotWebhookEvent:
            oneOf:
                - $ref: "#/components/schemas/BotWebhookCreatedMessageEvent"
                - $ref: "#/components/schemas/BotWebhookCreatedPostEvent"
            discriminator:
                propertyName: type
                mapping:
                    CreatedMessage: "#/components/schemas/BotWebhookCreatedMessageEvent"
                    CreatedPost: "#/components/schemas/BotWebhookCreatedPostEvent"

        BotWebhookCreatedMessageEvent:
            type: object
            required: [type, room, index, author, createdTimeZone]
            additionalProperties: false
            properties:
                type:
                    const: CreatedMessage
                room:
                    $ref: "#/components/schemas/MessageRoomReference"
                index:
                    type: integer
                    minimum: 0
                author:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                parent:
                    $ref: "#/components/schemas/BotWebhookCreatedMessageEventParent"
                wasMentioned:
                    type: boolean
                viewing:
                    type: object
                    required: [reference]
                    additionalProperties: false
                    properties:
                        reference:
                            $ref: "#/components/schemas/MentionReference"

        BotWebhookCreatedMessageEventParent:
            oneOf:
                - $ref: "#/components/schemas/BotWebhookCreatedMessageEventMessageParent"
                - $ref: "#/components/schemas/BotWebhookCreatedMessageEventPostParent"
            discriminator:
                propertyName: type
                mapping:
                    Message: "#/components/schemas/BotWebhookCreatedMessageEventMessageParent"
                    Post: "#/components/schemas/BotWebhookCreatedMessageEventPostParent"

        BotWebhookCreatedMessageEventMessageParent:
            type: object
            required: [type, index, author]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                author:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"

        BotWebhookCreatedMessageEventPostParent:
            type: object
            required: [type, author]
            additionalProperties: false
            properties:
                type:
                    const: Post
                author:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"

        BotWebhookCreatedPostEvent:
            type: object
            required: [type, post, author, createdTimeZone]
            additionalProperties: false
            properties:
                type:
                    const: CreatedPost
                post:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/PostId"
                author:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                wasMentioned:
                    type: boolean

        MessageContentPayloadParentContentSnippet:
            type: object
            required: [elements, isTruncated]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadParentContentSnippetTextInlineElement"
                isTruncated:
                    type: boolean

        MessageContentPayloadParentContentSnippetTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadParentContentSnippetInlineElementMark"

        MessageContentPayloadParentContentSnippetInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementCodeMark"
            discriminator:
                propertyName: type
                mapping:
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Code: "#/components/schemas/ContentInlineElementCodeMark"

        MessageRoomReference:
            oneOf:
                - $ref: "#/components/schemas/ChatMessageRoomReference"
                - $ref: "#/components/schemas/DocumentThreadMessageRoomReference"
                - $ref: "#/components/schemas/PostMessageRoomReference"
                - $ref: "#/components/schemas/TaskMessageRoomReference"
            discriminator:
                propertyName: type
                mapping:
                    Chat: "#/components/schemas/ChatMessageRoomReference"
                    DocumentThread: "#/components/schemas/DocumentThreadMessageRoomReference"
                    Post: "#/components/schemas/PostMessageRoomReference"
                    Task: "#/components/schemas/TaskMessageRoomReference"

        # NOCOMMIT: Get rid of these? Replace with actual reference types.
        ChatMessageRoomReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"

        DocumentThreadMessageRoomReference:
            type: object
            required: [type, id, threadId]
            additionalProperties: false
            properties:
                type:
                    const: DocumentThread
                id:
                    $ref: "#/components/schemas/DocumentId"
                threadId:
                    $ref: "#/components/schemas/DocumentThreadId"

        PostMessageRoomReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"

        TaskMessageRoomReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"

        # =========================================================================== #
        #                                  Search                                    #
        # =========================================================================== #

        # Search results have the following shared properties:
        #
        # - `type` (required)
        # - `title` (optional)
        # - `bodyMatch` (optional)
        SearchResult:
            oneOf:
                - $ref: "#/components/schemas/SearchAccountResult"
                - $ref: "#/components/schemas/SearchChannelResult"
                - $ref: "#/components/schemas/SearchChatResult"
                - $ref: "#/components/schemas/SearchChatMessageResult"
                - $ref: "#/components/schemas/SearchDocumentResult"
                - $ref: "#/components/schemas/SearchDocumentMessageResult"
                - $ref: "#/components/schemas/SearchPostResult"
                - $ref: "#/components/schemas/SearchPostMessageResult"
                - $ref: "#/components/schemas/SearchTaskResult"
                - $ref: "#/components/schemas/SearchTaskMessageResult"
                - $ref: "#/components/schemas/SearchTaskCollectionResult"
            discriminator:
                propertyName: type
                mapping:
                    Account: "#/components/schemas/SearchAccountResult"
                    Channel: "#/components/schemas/SearchChannelResult"
                    Chat: "#/components/schemas/SearchChatResult"
                    ChatMessage: "#/components/schemas/SearchChatMessageResult"
                    Document: "#/components/schemas/SearchDocumentResult"
                    DocumentMessage: "#/components/schemas/SearchDocumentMessageResult"
                    Post: "#/components/schemas/SearchPostResult"
                    PostMessage: "#/components/schemas/SearchPostMessageResult"
                    Task: "#/components/schemas/SearchTaskResult"
                    TaskMessage: "#/components/schemas/SearchTaskMessageResult"
                    TaskCollection: "#/components/schemas/SearchTaskCollectionResult"

        SearchAccountResult:
            type: object
            required: [type, id, title, bodyMatch, shortName]
            additionalProperties: false
            properties:
                type:
                    const: Account
                id:
                    $ref: "#/components/schemas/AccountId"
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                shortName:
                    $ref: "#/components/schemas/LabelString"
                # NOCOMMIT: Make sure we return `botId` when returning an account target! Mentions + search results.
                bot:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/BotId"

        SearchChannelResult:
            type: object
            required: [type, id, title, bodyMatch]
            additionalProperties: false
            properties:
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchChatResult:
            type: object
            required: [type, id, title, bodyMatch]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchChatMessageResult:
            type: object
            required: [type, id, title, bodyMatch, index, author]
            additionalProperties: false
            properties:
                type:
                    const: ChatMessage
                id:
                    $ref: "#/components/schemas/ChatId"
                title:
                    const: null
                bodyMatch:
                    $ref: "#/components/schemas/SearchResultBodyMatch"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchDocumentResult:
            type: object
            required: [type, id, title, bodyMatch]
            additionalProperties: false
            properties:
                type:
                    const: Document
                id:
                    $ref: "#/components/schemas/DocumentId"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchDocumentMessageResult:
            type: object
            required: [type, id, title, bodyMatch, threadId, index, author]
            additionalProperties: false
            properties:
                type:
                    const: DocumentMessage
                id:
                    $ref: "#/components/schemas/DocumentId"
                title:
                    const: null
                bodyMatch:
                    $ref: "#/components/schemas/SearchResultBodyMatch"
                threadId:
                    $ref: "#/components/schemas/DocumentThreadId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchPostResult:
            type: object
            required: [type, id, title, bodyMatch, author]
            additionalProperties: false
            properties:
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchPostMessageResult:
            type: object
            required: [type, id, title, bodyMatch, index, author]
            additionalProperties: false
            properties:
                type:
                    const: PostMessage
                id:
                    $ref: "#/components/schemas/PostId"
                title:
                    const: null
                bodyMatch:
                    $ref: "#/components/schemas/SearchResultBodyMatch"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskResult:
            type: object
            required: [type, id, title, bodyMatch, status]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskMessageResult:
            type: object
            required: [type, id, title, bodyMatch, index, author]
            additionalProperties: false
            properties:
                type:
                    const: TaskMessage
                id:
                    $ref: "#/components/schemas/TaskId"
                title:
                    const: null
                bodyMatch:
                    $ref: "#/components/schemas/SearchResultBodyMatch"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskCollectionResult:
            type: object
            required: [type, id, title, bodyMatch]
            additionalProperties: false
            properties:
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchResultBodyMatch:
            type: array
            items:
                type: object
                required: [text]
                additionalProperties: false
                properties:
                    text:
                        type: string
                    isMatch:
                        const: true

        SearchResultParsedFilter:
            type: object
            required: [summary]
            additionalProperties: false
            properties:
                summary:
                    type: string
