                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageExperimentalApprovals"}

    /task-collections:
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [spaceId, collection]
                            additionalProperties: false
                            properties:
                                spaceId:
                                    $ref: "#/components/schemas/SpaceId"
                                collection:
                                    type: object
                                    required: [name]
                                    additionalProperties: false
                                    properties:
                                        creator:
                                            # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                                            type: object
                                            required: [id]
                                            additionalProperties: false
                                            properties:
                                                id:
                                                    $ref: "#/components/schemas/AccountId"
                                        name:
                                            $ref: "#/components/schemas/LabelString"
                                        color:
                                            oneOf:
                                                - $ref: "#/components/schemas/TaskCollectionColor"
                                                - type: "null"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, collection]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    collection:
                                        $ref: "#/components/schemas/TaskCollection"

    /task-collections/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        patch:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [patches]
                            additionalProperties: false
                            properties:
                                # TODO(#public-api-blocking): This should be an actor object?
                                actor:
                                    type: object
                                    required: [id]
                                    additionalProperties: false
                                    properties:
                                        id:
                                            $ref: "#/components/schemas/AccountId"
                                patches:
                                    type: array
                                    minItems: 1
                                    items:
                                        $ref: "#/components/schemas/TaskCollectionPatch"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, collection]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    collection:
                                        $ref: "#/components/schemas/TaskCollection"
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, collection]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    collection:
                                        $ref: "#/components/schemas/TaskCollection"

    /task-collections/{id}-reference:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, reference]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    reference:
                                        $ref: "#/components/schemas/TaskCollectionReference"

    /task-collections/{id}-preview:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, collection]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    collection:
                                        $ref: "#/components/schemas/TaskCollectionPreview"

    /task-collections/{id}/tasks:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      $ref: "#/components/schemas/TaskQueryCursor"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetTaskCollectionTasks"}

    # NOTE(calebmer): `-query` refers to the upcoming HTTP `QUERY` method, not
    # `TaskQuery`. Eventually we should add `QUERY /task-collections/{id}/tasks`
    # and keep this endpoint around for backwards compatibility.
    /task-collections/{id}/tasks-query:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: []
                            additionalProperties: false
                            properties:
                                limit:
                                    type: integer
                                    minimum: 1
                                    maximum: 100
                                    default: 10
                                cursor:
                                    $ref: "#/components/schemas/TaskQueryCursor"
                                filters:
                                    type: array
                                    items:
                                        $ref: "#/components/schemas/TaskQueryFilter"
                                sorts:
                                    type: array
                                    items:
                                        $ref: "#/components/schemas/TaskQuerySort"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetTaskCollectionTasks"}

    /files/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/FileId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [id, contentType, contentLength, signedUrl, isUploading]
                                additionalProperties: false
                                properties:
                                    id:
                                        $ref: "#/components/schemas/FileId"
                                    contentType:
                                        type: string
                                    contentLength:
                                        type: integer
                                    signedUrl:
                                        type: string
                                    isUploading:
                                        type: boolean

    /files/{id}/content:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/FileId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "302":
                    headers:
                        location:
                            schema: {type: string}

webhooks:
    bot:
        post:
            parameters:
                - name: Alpine-Signature
                  in: header
                  required: false
                  description: >
                      Signature of the raw request body formatted as `sha256=<hex>` where `<hex>` is
                      the hex-encoded HMAC SHA-256 of the raw request body keyed with the bot's
                      webhook secret. Only sent when the bot has a webhook secret configured.
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [spaceId, botAccount, attempt, accessToken, eventId, event]
                            additionalProperties: false
                            properties:
                                spaceId:
                                    $ref: "#/components/schemas/SpaceId"
                                botAccount:
                                    type: object
                                    required: [id, bot]
                                    additionalProperties: false
                                    properties:
                                        id:
                                            $ref: "#/components/schemas/AccountId"
                                        bot:
                                            type: object
                                            required: [id]
                                            additionalProperties: false
                                            properties:
                                                id:
                                                    $ref: "#/components/schemas/BotId"
                                attempt:
                                    type: integer
                                    minimum: 1
                                accessToken:
                                    type: string
                                eventId:
                                    $ref: "#/components/schemas/BotWebhookEventId"
                                event:
                                    $ref: "#/components/schemas/BotWebhookEvent"
            responses:
                "200":
                    description:
                        Return a 200 status to indicate that the data was received successfully

components:
    responses:
        Error:
            content:
                application/json:
                    schema:
                        type: object
                        required: [error]
                        additionalProperties: false
                        properties:
                            error:
                                type: object
                                required: [message, retry]
                                additionalProperties: false
                                properties:
                                    message:
                                        type: string
                                        description:
                                            A human-readable message providing more details about
                                            the error.
                                    retry:
                                        type: object
                                        required: [able]
                                        additionalProperties: false
                                        properties:
                                            able:
                                                type: boolean
                                                description:
                                                    If true, it indicates that the request should
                                                    succeed if tried again.

        GetChannel:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, channel]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            channel:
                                $ref: "#/components/schemas/Channel"

        GetChat:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, chat]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            chat:
                                $ref: "#/components/schemas/Chat"

        GetDocument:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, document]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            document:
                                $ref: "#/components/schemas/Document"

        GetTask:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, task]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            task:
                                $ref: "#/components/schemas/Task"

        GetTaskWithNotes:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, task]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            task:
                                $ref: "#/components/schemas/TaskWithNotes"

        PatchTask:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, task, results]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            task:
                                $ref: "#/components/schemas/Task"
                            results:
                                type: array
                                items:
                                    $ref: "#/components/schemas/TaskPatchResult"

        PatchTasks:
            content:
                application/json:
                    schema:
                        type: object
                        required: [tasks, results]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            tasks:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Task"
                            results:
                                type: array
                                items:
                                    $ref: "#/components/schemas/TaskBatchPatchResult"

        GetTaskNotes:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, notes]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            notes:
                                $ref: "#/components/schemas/TaskNotes"

        GetTaskCollectionTasks:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, collection, nextCursor, tasks]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            collection:
                                $ref: "#/components/schemas/TaskCollection"
                            # TODO(calebmer): We should document how if the default sorts change
                            # while iterating through this collection an error will be thrown if
                            # sorts aren't explicitly specified.
                            nextCursor:
                                oneOf:
                                    - $ref: "#/components/schemas/TaskQueryCursor"
                                    - type: "null"
                            tasks:
                                type: array
                                items:
                                    $ref: "#/components/schemas/TaskQueryItem"

        GetMessage:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, message]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            message:
                                $ref: "#/components/schemas/Message"

        GetMessages:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, totalMessageCount, nextCursor, messages]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            totalMessageCount:
                                type: integer
                            nextCursor:
                                type: [integer, "null"]
                                minimum: 0
                            messages:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Message"

        GetMessageExperimentalApprovals:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, approvals]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            approvals:
                                type: array
                                items:
                                    $ref: "#/components/schemas/MessageExperimentalApproval"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/completion` endpoints but the
        # intention is to add that endpoint and for it to return the same type as the
        # `PUT` endpoint.
        GetMessageStreamCompletion:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, completion]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            completion:
                                type: object
                                required: [completedTime]
                                additionalProperties: false
                                properties:
                                    completedTime:
                                        $ref: "#/components/schemas/DateTime"

        # NOTE(ifitzsimmons, 2025-11-14): If a client tries pinging a stream after it's
        # been completed, we don't throw an error. Instead, we return the completed time
        # and the last stream ping time (without updating the last stream ping time).
        GetMessageStreamPing:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, ping]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            ping:
                                type: object
                                required: [lastUpdatedTime]
                                additionalProperties: false
                                properties:
                                    lastUpdatedTime:
                                        $ref: "#/components/schemas/DateTime"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/parts/{partIndex}` endpoints but
        # the intention is to add that endpoint and for it to return the same type as
        # the `PUT` endpoint.
        GetMessageStreamPart:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"

        GetPost:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, post]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            post:
                                $ref: "#/components/schemas/Post"

    requestBodies:
        # TODO(ifitzsimmons, #public-api-blocking): Response bodies should be
        # assignable to request bodies for objects of the same type. So `GetMessage`
        # should be assignable to `CreateMessage`.
        #
        # This means we need to nest these properties in a `message` object right?
        CreateMessage:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [content]
                        additionalProperties: false
                        properties:
                            isStream:
                                type: boolean
                            createdTimeZone:
                                $ref: "#/components/schemas/TimeZone"
                            parent:
                                $ref: "#/components/schemas/MessageContentPayloadParent"
                            content:
                                $ref: "#/components/schemas/Content"
                            files:
                                type: array
                                items:
                                    $ref: "#/components/schemas/MessageContentPayloadFile"

        # Applies one decision value to every approval in the message that is still
        # undecided. Pending approvals are resolved server side, so a caller with a
        # stale view of the approvals can't mis-target or fail on an approval that
        # was decided concurrently. A message with no pending approvals is a no-op.
        PutMessageExperimentalApprovalsPendingDecision:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [decision]
                        additionalProperties: false
                        properties:
                            decision:
                                type: object
                                required: [value]
                                additionalProperties: false
                                properties:
                                    value:
                                        $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue"

        PatchMessageExperimentalApprovals:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [patches]
                        additionalProperties: false
                        properties:
                            patches:
                                type: array
                                items:
                                    type: object
                                    required: [type, index, decision]
                                    additionalProperties: false
                                    properties:
                                        type:
                                            const: SetDecisionValue
                                        index:
                                            type: integer
                                            minimum: 0
                                        decision:
                                            type: object
                                            required: [value]
                                            additionalProperties: false
                                            properties:
                                                value:
                                                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue"

        # TODO(ifitzsimmons, #public-api-blocking): Response bodies should be
        # assignable to request bodies for objects of the same type. So
        # `GetMessageStreamPart` should be assignable to `PutMessageStreamPart`.
        PutMessageStreamPart:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [payload]
                        additionalProperties: false
                        properties:
                            payload:
                                $ref: "#/components/schemas/MessageStreamPartPayload"

    schemas:
        LabelString:
            type: string
            minLength: 1
            maxLength: {{maxLabelStringLength}}

        DateTime:
            type: string
            format: date-time

        TimeZone:
            type: string

        FileContentType:
            type: string
            enum: {{fileContentTypes}}

        # =========================================================================== #
        #                                     IDs                                     #
        # =========================================================================== #
        #
        # Ordered alphabetically assuming `Id` isn't appended as a suffix. e.g.
        # `TaskId` comes before `TaskCollectionId` even though `C` comes before `I` in
        # the alphabet.

        AccountId:
            type: string
            pattern: ^{{idRegExp}}$

        BotId:
            type: string
            pattern: ^{{idRegExp}}$

        BotWebhookEventId:
            type: string
            pattern: ^{{idRegExp}}$

        ChannelId:
            type: string
            pattern: ^{{idRegExp}}$

        ChatId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentThreadId:
            type: string
            pattern: ^{{idRegExp}}$

        FileId:
            type: string
            pattern: ^{{idRegExp}}$

        PostId:
            type: string
            pattern: ^{{idRegExp}}$

        SiteId:
            type: string
            pattern: ^{{idRegExp}}$

        SpaceId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskCollectionId:
            type: string
            pattern: ^{{idRegExp}}$

        ContentKey:
            type: string
            minLength: 1

        ContentPosition:
            oneOf:
                - $ref: "#/components/schemas/ContentInlinePosition"
                - $ref: "#/components/schemas/ContentBeforePosition"
                - $ref: "#/components/schemas/ContentAfterPosition"
