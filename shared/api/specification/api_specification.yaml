                    $ref: "#/components/schemas/TaskCollectionId"

        TaskCollectionReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"
                title:
                    type: string

        # TODO(#sites-api): We may want to add a mention response type for sites
        # that includes the first entity id in the site. I'm still not sure how
        # we will communicate site data via the API, so I'm only adding what's
        # necessary for now. The mention target is necessary because the site file
        # entity mention will exist in Alpine content, and API requests to fetch that
        # content should still succeed.
        # We also may NOT want to add a mention target response with the first entity
        # id. Rerouting to the first entity in the site makes sense in the app since
        # we render the site chrome around the entity. For the API, that "reroute"
        # may be pretty confusing/jarring for clients.
        SiteReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Site
                id:
                    $ref: "#/components/schemas/SiteId"

        SiteReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Site
                id:
                    $ref: "#/components/schemas/SiteId"
                title:
                    type: string
                deleted:
                    type: boolean
                private:
                    type: boolean

        MentionReference:
            oneOf:
                - $ref: "#/components/schemas/AccountReference"
                - $ref: "#/components/schemas/ChannelReference"
                - $ref: "#/components/schemas/ChatReference"
                - $ref: "#/components/schemas/DocumentReference"
                - $ref: "#/components/schemas/PostReference"
                - $ref: "#/components/schemas/TaskReference"
                - $ref: "#/components/schemas/TaskCollectionReference"
                - $ref: "#/components/schemas/SiteReference"
            discriminator:
                propertyName: type
                mapping:
                    Account: "#/components/schemas/AccountReference"
                    Channel: "#/components/schemas/ChannelReference"
                    Chat: "#/components/schemas/ChatReference"
                    Document: "#/components/schemas/DocumentReference"
                    Post: "#/components/schemas/PostReference"
                    Task: "#/components/schemas/TaskReference"
                    TaskCollection: "#/components/schemas/TaskCollectionReference"
                    Site: "#/components/schemas/SiteReference"

        PreviewReference:
            oneOf:
                - $ref: "#/components/schemas/ChannelReference"
                - $ref: "#/components/schemas/ChatReference"
                - $ref: "#/components/schemas/DocumentReference"
                - $ref: "#/components/schemas/PostReference"
                - $ref: "#/components/schemas/TaskReference"
                - $ref: "#/components/schemas/TaskCollectionReference"
                - $ref: "#/components/schemas/SiteReference"
            discriminator:
                propertyName: type
                mapping:
                    Channel: "#/components/schemas/ChannelReference"
                    Chat: "#/components/schemas/ChatReference"
                    Document: "#/components/schemas/DocumentReference"
                    Post: "#/components/schemas/PostReference"
                    Task: "#/components/schemas/TaskReference"
                    TaskCollection: "#/components/schemas/TaskCollectionReference"
                    Site: "#/components/schemas/SiteReference"

        # =========================================================================== #
        #                                    Auth                                     #
        # =========================================================================== #

        Auth:
            oneOf:
                - $ref: "#/components/schemas/BotAccountAuth"
            discriminator:
                propertyName: type
                mapping:
                    BotAccount: "#/components/schemas/BotAccountAuth"

        BotAccountAuth:
            type: object
            additionalProperties: false
            required: [type, spaceId, botAccount]
            properties:
                type:
                    const: BotAccount
                spaceId:
                    $ref: "#/components/schemas/SpaceId"
                botAccount:
                    $ref: "#/components/schemas/BotAccount"

        # =========================================================================== #
        #                                   Content                                   #
        # =========================================================================== #

        Content:
            type: object
            additionalProperties: false
            required: [elements]
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentBlockElement"

        ContentBlockElement:
            # TODO(calebmer, #public-api): We need to be able to add items without breaking
            # backwards compatibility. When publishing the API, let's figure out what our
            # schema evolution policy is.
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentHeadingBlockElement"
                - $ref: "#/components/schemas/ContentDividerBlockElement"
                - $ref: "#/components/schemas/ContentTableBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
                - $ref: "#/components/schemas/ContentFileBlockElement"
                - $ref: "#/components/schemas/ContentFileGalleryBlockElement"
                - $ref: "#/components/schemas/ContentFileFloatBlockElement"
                - $ref: "#/components/schemas/ContentPreviewBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Heading: "#/components/schemas/ContentHeadingBlockElement"
                    Divider: "#/components/schemas/ContentDividerBlockElement"
                    Table: "#/components/schemas/ContentTableBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"
                    File: "#/components/schemas/ContentFileBlockElement"
                    FileGallery: "#/components/schemas/ContentFileGalleryBlockElement"
                    FileFloat: "#/components/schemas/ContentFileFloatBlockElement"
                    Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentParagraphBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Paragraph
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentParagraphBlockElement_Response:
            type: object
            required: [type, key, elements]
            additionalProperties: false
            properties:
                type:
                    const: Paragraph
                key:
                    $ref: "#/components/schemas/ContentKey"
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement_Response"

        ContentParagraphBlockElement_Response_WithoutKeys:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Paragraph
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement_Response"

        ContentListBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentUnorderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: UnorderedList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentOrderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: OrderedList
                orderStart:
                    type: integer
                    minimum: 1
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentCheckListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: CheckList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCheckListBlockElementItem"

        ContentListBlockElementItem:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                # TODO(calebmer, #public-api): If `elements` is an empty array then this is a
                # "phantom" list item. Phantom list items exist purely to increase the
                # indentation level of their children and aren't rendered as a list item
                # themselves. There's no bullet! An `elements` array with an empty paragraph
                # does render an item.
                #
                # We need to clearly document this behavior in our API documentation.
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentCheckListBlockElementItem:
            type: object
            required: [checked, elements]
            additionalProperties: false
            properties:
                checked:
                    type: boolean
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentQuoteBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Quote
                elements:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentQuoteBlockElementBlockElement"

        ContentQuoteBlockElementBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentHeadingBlockElement:
            type: object
            required: [type, level, elements]
            additionalProperties: false
            properties:
                type:
                    const: Heading
                level:
                    type: integer
                    minimum: 1
                    maximum: 3
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentHeadingBlockElement_Response:
            type: object
            required: [type, key, level, elements]
            additionalProperties: false
            properties:
                type:
                    const: Heading
                key:
                    $ref: "#/components/schemas/ContentKey"
                level:
                    type: integer
                    minimum: 1
                    maximum: 3
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement_Response"

        ContentHeadingBlockElement_Response_WithoutKeys:
            type: object
            required: [type, level, elements]
            additionalProperties: false
            properties:
                type:
                    const: Heading
                level:
                    type: integer
                    minimum: 1
                    maximum: 3
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement_Response"

        ContentDividerBlockElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Divider

        ContentDividerBlockElement_Response:
            type: object
            required: [type, key]
            additionalProperties: false
            properties:
                type:
                    const: Divider
                key:
                    $ref: "#/components/schemas/ContentKey"

        ContentDividerBlockElement_Response_WithoutKeys:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Divider

        ContentTableBlockElement:
            type: object
            required: [type, width, columns, rows]
            additionalProperties: false
            properties:
                type:
                    const: Table
                width:
                    type: number
                hasHeaderRow:
                    type: boolean
                hasHeaderColumn:
                    type: boolean
                columns:
                    type: array
                    minItems: 2
                    items:
                        type: object
                        required: [width]
                        additionalProperties: false
                        properties:
                            width:
                                type: number
                rows:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementRow"

        ContentTableBlockElementRow:
            type: object
            required: [cells]
            additionalProperties: false
            properties:
                cells:
                    type: array
                    minItems: 2
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCell"

        ContentTableBlockElementCell:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCellBlockElement"

        ContentTableBlockElementCellBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
                - $ref: "#/components/schemas/ContentFileBlockElement"
                - $ref: "#/components/schemas/ContentPreviewBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"
                    File: "#/components/schemas/ContentFileBlockElement"
                    Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentCodeBlockElement:
            type: object
            required: [type, language, lines]
            additionalProperties: false
            properties:
                type:
                    const: Code
                language:
                    type: string
                    enum: {{codeBlockLanguageIds}}
                lines:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementLine"

        ContentCodeBlockElementLine:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElement"

        ContentCodeBlockElementLine_Response:
            type: object
            required: [key, elements]
            additionalProperties: false
            properties:
                key:
                    $ref: "#/components/schemas/ContentKey"
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElement"

        ContentCodeBlockElementLine_Response_WithoutKeys:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElement"

        ContentFileBlockElement:
            type: object
            required: [type, file]
            additionalProperties: false
            properties:
                type:
                    const: File
                file:
                    $ref: "#/components/schemas/ContentFileBlockElementFile"
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCommentMark"

        ContentFileBlockElement_Response:
            type: object
            required: [type, key, file]
            additionalProperties: false
            properties:
                type:
                    const: File
                key:
                    $ref: "#/components/schemas/ContentKey"
                file:
                    $ref: "#/components/schemas/ContentFileBlockElementFile"
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCommentMark"

        ContentFileBlockElement_Response_WithoutKeys:
            type: object
            required: [type, file]
            additionalProperties: false
            properties:
                type:
                    const: File
                file:
                    $ref: "#/components/schemas/ContentFileBlockElementFile"
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCommentMark"

        ContentFileBlockElementFile:
            type: object
            required: [id]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/FileId"

        ContentFileBlockElementFile_Response:
            type: object
            required: [id, contentType, contentLength]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/FileId"
                contentType:
                    $ref: "#/components/schemas/FileContentType"
                contentLength:
                    type: integer
                    minimum: 0

        ContentPreviewBlockElement:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Preview
                reference:
                    $ref: "#/components/schemas/PreviewReference"
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCommentMark"

        ContentPreviewBlockElement_Response:
            type: object
            required: [type, key, reference]
            additionalProperties: false
            properties:
                type:
                    const: Preview
                key:
                    $ref: "#/components/schemas/ContentKey"
                reference:
                    $ref: "#/components/schemas/PreviewReference"
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCommentMark"

        ContentPreviewBlockElement_Response_WithoutKeys:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Preview
                reference:
                    $ref: "#/components/schemas/PreviewReference"
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCommentMark"

        ContentFileGalleryBlockElement:
            type: object
            required: [type, rows]
            additionalProperties: false
            properties:
                type:
                    const: FileGallery
                rows:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentFileGalleryBlockElementRow"
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCommentMark"

        ContentFileGalleryBlockElementRow:
            type: object
            required: [items]
            additionalProperties: false
            properties:
                items:
                    type: array
                    minItems: 1
                    maxItems: 3
                    items:
                        $ref: "#/components/schemas/ContentFileGalleryBlockElementRowItem"

        ContentFileGalleryBlockElementRowItem:
            type: object
            required: [element]
            additionalProperties: false
            properties:
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentFileGalleryBlockElementRowItem_Response:
            type: object
            required: [width, element]
            additionalProperties: false
            properties:
                width:
                    type: number
                    minimum: 0
                    maximum: 1
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentFileFloatBlockElement:
            type: object
            required: [type, side, element]
            additionalProperties: false
            properties:
                type:
                    const: FileFloat
                side:
                    type: string
                    enum: [Left, Right]
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentInlineElement:
            oneOf:
                - $ref: "#/components/schemas/ContentTextInlineElement"
                - $ref: "#/components/schemas/ContentBreakInlineElement"
                - $ref: "#/components/schemas/ContentMentionInlineElement"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/ContentTextInlineElement"
                    Break: "#/components/schemas/ContentBreakInlineElement"
                    Mention: "#/components/schemas/ContentMentionInlineElement"

        ContentTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                    pattern: ^[^\n\r]*$
                # TODO(calebmer, #public-api): Document that marks are an unordered set. Mark
                # order doesn't matter and duplicates aren't allowed.
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentBreakInlineElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Break
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentMentionInlineElement:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                # TODO(calebmer, #public-api): Document that `title` is loaded using the search
                # index so may be stale by up to 90s! (60s for slow document reindexing + 10s
                # for OpenSearch refresh interval. Say 90s to give us enough buffer.)
                reference:
                    $ref: "#/components/schemas/MentionReference"
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentBoldMark"
                - $ref: "#/components/schemas/ContentItalicMark"
                - $ref: "#/components/schemas/ContentStrikeMark"
                - $ref: "#/components/schemas/ContentLinkMark"
                - $ref: "#/components/schemas/ContentCodeMark"
                - $ref: "#/components/schemas/ContentHighlightMark"
                - $ref: "#/components/schemas/ContentCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentBoldMark"
                    Italic: "#/components/schemas/ContentItalicMark"
                    Strike: "#/components/schemas/ContentStrikeMark"
                    Link: "#/components/schemas/ContentLinkMark"
                    Code: "#/components/schemas/ContentCodeMark"
                    Highlight: "#/components/schemas/ContentHighlightMark"
                    Comment: "#/components/schemas/ContentCommentMark"

        ContentBoldMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Bold

        ContentItalicMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Italic

        ContentStrikeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Strike

        ContentLinkMark:
            type: object
            required: [type, url]
            additionalProperties: false
            properties:
                type:
                    const: Link
                url:
                    type: string

        ContentCodeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Code

        ContentHighlightMark:
            type: object
            required: [type, color]
            additionalProperties: false
            properties:
                type:
                    const: Highlight
                color:
                    $ref: "#/components/schemas/ContentHighlightMarkColor"

        ContentHighlightMarkColor:
            type: string
            enum:
                - Red
                - Orange
                - Green
                - Blue
                - Purple

        ContentCommentMark:
            type: object
            required: [type, thread]
            additionalProperties: false
            properties:
                type:
                    const: Comment
                thread:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/DocumentThreadId"

        ContentCodeBlockElementTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                    pattern: ^[^\n\r]*$
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElementMark"

        ContentCodeBlockElementTextInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentBoldMark"
                - $ref: "#/components/schemas/ContentItalicMark"
                - $ref: "#/components/schemas/ContentStrikeMark"
                - $ref: "#/components/schemas/ContentLinkMark"
                - $ref: "#/components/schemas/ContentHighlightMark"
                - $ref: "#/components/schemas/ContentCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentBoldMark"
                    Italic: "#/components/schemas/ContentItalicMark"
                    Strike: "#/components/schemas/ContentStrikeMark"
                    Link: "#/components/schemas/ContentLinkMark"
                    Highlight: "#/components/schemas/ContentHighlightMark"
                    Comment: "#/components/schemas/ContentCommentMark"

        LabelContent:
            type: object
            additionalProperties: false
            required: [elements]
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/LabelContentInlineElement"

        LabelContentInlineElement:
            oneOf:
                - $ref: "#/components/schemas/LabelContentTextInlineElement"
                - $ref: "#/components/schemas/LabelContentMentionInlineElement"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/LabelContentTextInlineElement"
                    Mention: "#/components/schemas/LabelContentMentionInlineElement"

        LabelContentInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentItalicMark"
                - $ref: "#/components/schemas/ContentCodeMark"
            discriminator:
                propertyName: type
                mapping:
                    Italic: "#/components/schemas/ContentItalicMark"
                    Code: "#/components/schemas/ContentCodeMark"

        LabelContentTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                # TODO(calebmer, #public-api): Document that marks are an unordered set. Mark
                # order doesn't matter and duplicates aren't allowed.
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/LabelContentInlineElementMark"

        LabelContentMentionInlineElement:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                reference:
                    $ref: "#/components/schemas/MentionReference"
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/LabelContentInlineElementMark"

        # =========================================================================== #
        #                                  Entities                                   #
        # =========================================================================== #

        AccountWithoutSpace:
            type: object
            required: [id]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                # NOTE(calebmer): Optional `title` property so we can accept an
                # `AccountReferenceResponse` to this type without `additionalProperties`
                # throwing an error. We should hide this from documentation!
                title:
                    type: string

        AccountWithoutSpace_Response:
            type: object
            required: [id, name, shortName]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    $ref: "#/components/schemas/LabelString"
                bot:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/BotId"

        Space:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/SpaceId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Account:
            type: object
            required: [id]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                # NOTE(calebmer): Optional `title` property so we can accept an
                # `AccountReferenceResponse` to this type without `additionalProperties`
                # throwing an error. We should hide this from documentation!
                title:
                    type: string

        Account_Response:
            type: object
            required: [id, name, shortName, space]
            additionalProperties: false
            properties: &accountResponseProperties
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    $ref: "#/components/schemas/LabelString"
                bot:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/BotId"
                space:
                    $ref: "#/components/schemas/AccountSpace"

        BotAccount:
            $ref: "#/components/schemas/Account"

        BotAccount_Response:
            type: object
            # The only difference between `BotAccount_Response` and `Account_Response` is
            # that `bot` is required in `BotAccount_Response`.
            required: [id, name, shortName, bot, space]
            additionalProperties: false
            properties:
                <<: *accountResponseProperties

        AccountSpace:
            type: object
            required: [role, addedTime]
            additionalProperties: false
            properties:
                role:
                    type: string
                    enum: [Owner, Admin, Member]
                addedTime:
                    $ref: "#/components/schemas/DateTime"
                # TODO(calebmer, #public-api-blocking): Switch this to `state` and add an
                # `Active` variant.
                inactive:
                    $ref: "#/components/schemas/AccountSpaceInactive"

        AccountSpaceInactive:
            oneOf:
                - $ref: "#/components/schemas/AccountSpaceRemovedInactive"
                - $ref: "#/components/schemas/AccountSpaceInvitePendingInactive"
            discriminator:
                propertyName: type
                mapping:
                    Removed: "#/components/schemas/AccountSpaceRemovedInactive"
                    InvitePending: "#/components/schemas/AccountSpaceInvitePendingInactive"

        AccountSpaceRemovedInactive:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Removed
                removedTime:
                    $ref: "#/components/schemas/DateTime"

        AccountSpaceInvitePendingInactive:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: InvitePending

        Inbox:
            type: object
            required: [newEntryCount, loudNotificationCount]
            additionalProperties: false
            properties:
                newEntryCount:
                    type: integer
                    minimum: 0
                loudNotificationCount:
                    type: integer
                    minimum: 0

        InboxEntryShared:
            type: object
            required: [title, time, loudNotificationCount, status, featured]
            additionalProperties: false
            # Anchor merged into each `Inbox*Entry` schema (YAML merge) so shared fields stay
            # single-sourced while each variant remains one flat object for AJV.
            properties: &inboxEntrySharedProperties
                title:
                    type: array
                    items:
                        $ref: "#/components/schemas/InboxEntryTitleItem"
                preview:
                    description: >
                        A short preview of the latest message as rich text items: an `Account` item
                        for the message author followed by a `Text` item with the message snippet.
                        Omitted when the entry has no message content.
                    type: array
                    items:
                        $ref: "#/components/schemas/InboxEntryPreviewItem"
                time:
                    $ref: "#/components/schemas/DateTime"
                loudNotificationCount:
                    type: integer
                    minimum: 0
                status:
                    type: string
                    enum: [New, Done]
                featured:
                    type: object
                    required: [type]
                    additionalProperties: false
                    oneOf:
                        - $ref: "#/components/schemas/InboxEntryAccountFeatured"
                    discriminator:
                        propertyName: type
                        mapping:
                            Account: "#/components/schemas/InboxEntryAccountFeatured"
                otherAccount:
                    $ref: "#/components/schemas/Account"

        InboxEntryTitleItem:
            oneOf:
                - $ref: "#/components/schemas/InboxEntryTitleTextItem"
                - $ref: "#/components/schemas/InboxEntryTitleAccountItem"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/InboxEntryTitleTextItem"
                    Account: "#/components/schemas/InboxEntryTitleAccountItem"

        InboxEntryTitleTextItem:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string

        InboxEntryTitleAccountItem:
            type: object
            required: [type, account]
            additionalProperties: false
            properties:
                type:
                    const: Account
                account:
                    $ref: "#/components/schemas/Account"

        InboxEntryPreviewItem:
            oneOf:
                - $ref: "#/components/schemas/InboxEntryPreviewTextItem"
                - $ref: "#/components/schemas/InboxEntryPreviewAccountItem"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/InboxEntryPreviewTextItem"
                    Account: "#/components/schemas/InboxEntryPreviewAccountItem"

        InboxEntryPreviewTextItem:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string

        InboxEntryPreviewAccountItem:
            type: object
            required: [type, account]
            additionalProperties: false
            properties:
                type:
                    const: Account
                account:
                    $ref: "#/components/schemas/Account"

        InboxEntryAccountFeatured:
            type: object
            required: [type, account]
            additionalProperties: false
            properties:
                type:
                    const: Account
                account:
                    $ref: "#/components/schemas/Account"

        InboxEntry:
            oneOf:
                - $ref: "#/components/schemas/InboxChatEntry"
                - $ref: "#/components/schemas/InboxCreatedChannelPostsEntry"
                - $ref: "#/components/schemas/InboxPostEntry"
                - $ref: "#/components/schemas/InboxCreatedDocumentThreadsEntry"
                - $ref: "#/components/schemas/InboxDocumentThreadEntry"
                - $ref: "#/components/schemas/InboxTaskMessagesEntry"
            discriminator:
                propertyName: type
                mapping:
                    Chat: "#/components/schemas/InboxChatEntry"
                    CreatedChannelPosts: "#/components/schemas/InboxCreatedChannelPostsEntry"
                    Post: "#/components/schemas/InboxPostEntry"
                    CreatedDocumentThreads: "#/components/schemas/InboxCreatedDocumentThreadsEntry"
                    DocumentThread: "#/components/schemas/InboxDocumentThreadEntry"
                    TaskMessages: "#/components/schemas/InboxTaskMessagesEntry"

        InboxChatEntry:
            type: object
            required:
                [title, time, loudNotificationCount, status, featured, type, chat, previewMessage]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: Chat
                chat:
                    $ref: "#/components/schemas/ChatReference_Response"
                previewMessage:
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        InboxCreatedChannelPostsEntry:
            type: object
            required: [title, time, loudNotificationCount, status, featured, type, channel, posts]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: CreatedChannelPosts
                channel:
                    $ref: "#/components/schemas/ChannelReference_Response"
                posts:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required: [id]
                        additionalProperties: false
                        properties:
                            id:
                                $ref: "#/components/schemas/PostId"

        InboxPostEntry:
            type: object
            required: [title, time, loudNotificationCount, status, featured, type, post]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: Post
                post:
                    $ref: "#/components/schemas/PostReference_Response"
                previewMessage:
                    # Present when the entry surfaces a specific comment (deep-linked
                    # via its index). Absent for post-body mentions, which link to the
                    # post itself.
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        InboxCreatedDocumentThreadsEntry:
            type: object
            required:
                [title, time, loudNotificationCount, status, featured, type, document, threads]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: CreatedDocumentThreads
                document:
                    $ref: "#/components/schemas/DocumentReference_Response"
                threads:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required: [id]
                        additionalProperties: false
                        properties:
                            id:
                                $ref: "#/components/schemas/DocumentThreadId"

        InboxDocumentThreadEntry:
            type: object
            required:
                [
                    title,
                    time,
                    loudNotificationCount,
                    status,
                    featured,
                    type,
                    document,
                    thread,
                    previewMessage,
                ]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: DocumentThread
                document:
                    $ref: "#/components/schemas/DocumentReference_Response"
                thread:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/DocumentThreadId"
                previewMessage:
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        InboxTaskMessagesEntry:
            type: object
            required:
                [title, time, loudNotificationCount, status, featured, type, task, previewMessage]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: TaskMessages
                task:
                    $ref: "#/components/schemas/TaskReference_Response"
                previewMessage:
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        Chat:
            oneOf:
                - $ref: "#/components/schemas/DirectChat"
                - $ref: "#/components/schemas/RoomChat"
            discriminator:
                propertyName: type
                mapping:
                    Direct: "#/components/schemas/DirectChat"
                    Room: "#/components/schemas/RoomChat"

        DirectChat:
            type: object
            required: [type, id, members, reference]
            additionalProperties: false
            properties:
                type:
                    const: Direct
                id:
                    $ref: "#/components/schemas/ChatId"
                members:
                    type: array
                    items:
                        type: object
                        required: [account]
                        additionalProperties: false
                        properties:
                            account:
                                $ref: "#/components/schemas/Account"
                # TODO(#public-api): Document how this is the same as the chat's `title` when
                # displayed as a mention.
                reference:
                    type: object
                    required: [title]
                    additionalProperties: false
                    properties:
                        title:
                            type: string

        RoomChat:
            type: object
            required: [type, id, name]
            additionalProperties: false
            properties:
                type:
                    const: Room
                id:
                    $ref: "#/components/schemas/ChatId"
                name:
                    $ref: "#/components/schemas/LabelString"

        ChatCreateRequest:
            oneOf:
                - $ref: "#/components/schemas/DirectChatCreateRequest"
                - $ref: "#/components/schemas/RoomChatCreateRequest"
            discriminator:
                propertyName: type
                mapping:
                    Direct: "#/components/schemas/DirectChatCreateRequest"
                    Room: "#/components/schemas/RoomChatCreateRequest"

        DirectChatCreateRequest:
            type: object
            required: [type, members]
            additionalProperties: false
            properties:
                type:
                    const: Direct
                # TODO(#public-api): Should we add additional properties from `DirectChat` here
                # so if you pass in a `DirectChat` object, it would work?
                members:
                    type: array
                    items:
                        type: object
                        required: [account]
                        additionalProperties: false
                        properties:
                            account:
                                $ref: "#/components/schemas/Account"

        RoomChatCreateRequest:
            type: object
            required: [type, name]
            additionalProperties: false
            properties:
                type:
                    const: Room
                # TODO(#public-api): Should we add additional properties from `RoomChat` here
                # so if you pass in a `RoomChat` object, it would work?
                name:
                    $ref: "#/components/schemas/LabelString"

        Document:
            type: object
            required: [id, version, title, content]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentId"
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                version:
                    type: integer
                    minimum: 0
                title:
                    type: string
                content:
                    $ref: "#/components/schemas/Content"

        DocumentPatch:
            oneOf:
                - $ref: "#/components/schemas/DocumentSetTitlePatch"
                - $ref: "#/components/schemas/DocumentSetContentPatch"
            discriminator:
                propertyName: type
                mapping:
                    SetTitle: "#/components/schemas/DocumentSetTitlePatch"
                    SetContent: "#/components/schemas/DocumentSetContentPatch"

        DocumentSetTitlePatch:
            type: object
            required: [type, version, title]
            additionalProperties: false
            properties:
                type:
                    const: SetTitle
                version:
                    type: integer
                    minimum: 0
                title:
                    type: string

        DocumentSetContentPatch:
            type: object
            required: [type, version, content]
            additionalProperties: false
            properties:
                type:
                    const: SetContent
                version:
                    type: integer
                    minimum: 0
                content:
                    $ref: "#/components/schemas/Content"

        DocumentThread:
            type: object
            required: [id, isResolved, totalMessageCount, firstMessage]
            additionalProperties: false
            properties: &documentThreadProperties
                id:
                    $ref: "#/components/schemas/DocumentThreadId"
                isResolved:
                    type: boolean
                totalMessageCount:
                    type: integer
                    minimum: 0
                firstMessage:
                    type: object
                    required: [author, createdTime, createdTimeZone]
                    additionalProperties: false
                    properties:
                        author:
                            $ref: "#/components/schemas/Account"
                        createdTime:
                            $ref: "#/components/schemas/DateTime"
                        createdTimeZone:
                            $ref: "#/components/schemas/TimeZone"

        DocumentThreadPatch:
            oneOf:
                - $ref: "#/components/schemas/DocumentThreadResolvePatch"
                - $ref: "#/components/schemas/DocumentThreadUnresolvePatch"
            discriminator:
                propertyName: type
                mapping:
                    Resolve: "#/components/schemas/DocumentThreadResolvePatch"
                    Unresolve: "#/components/schemas/DocumentThreadUnresolvePatch"

        DocumentThreadResolvePatch:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Resolve

        DocumentThreadUnresolvePatch:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Unresolve

        DocumentThreadWithPreview:
            type: object
            required: [id, isResolved, totalMessageCount, firstMessage, preview]
            additionalProperties: false
            properties:
                <<: *documentThreadProperties
                preview:
                    type: object
                    required: [version, contentSnippet]
                    additionalProperties: false
                    properties:
                        version:
                            type: integer
                        contentSnippet:
                            $ref: "#/components/schemas/Content_WithoutKeys"

        ChannelPreview:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Channel:
            type: object
            required: [id, name, description]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"
                description:
                    $ref: "#/components/schemas/Content"

        ChannelPatch:
            oneOf:
                - $ref: "#/components/schemas/ChannelSetNamePatch"
                - $ref: "#/components/schemas/ChannelSetDescriptionPatch"
            discriminator:
                propertyName: type
                mapping:
                    SetName: "#/components/schemas/ChannelSetNamePatch"
                    SetDescription: "#/components/schemas/ChannelSetDescriptionPatch"

        ChannelSetNamePatch:
            type: object
            required: [type, name]
            additionalProperties: false
            properties:
                type:
                    const: SetName
                name:
                    $ref: "#/components/schemas/LabelString"

        ChannelSetDescriptionPatch:
            type: object
            required: [type, description]
            additionalProperties: false
            properties:
                type:
                    const: SetDescription
                description:
                    $ref: "#/components/schemas/Content"

        Post:
            type: object
            # `channel` is intentionally optional since we may allow users to create posts
            # that aren't in a channel in the future.
            required: [id, author, createdTime, createdTimeZone, content, reference]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/PostId"
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                channel:
                    $ref: "#/components/schemas/ChannelPreview"
                content:
                    $ref: "#/components/schemas/Content"
                # TODO(#public-api): Document how this is the same as the chat's `title` when
                # displayed as a mention.
                reference:
                    type: object
                    required: [title]
                    additionalProperties: false
                    properties:
                        title:
                            type: string

        # TODO(calebmer, #public-api): The intent here is that a `/channels/{id}/posts`
        # endpoint would return this object insted of a `Post`. We need a
        # `contentSnippet` on this object then you'll have a small post with a "read
        # more" link.
        PostPreview:
            type: object
            # `channel` is intentionally optional since we may allow users to create posts
            # that aren't in a channel in the future.
            required:
                [id, author, createdTime, createdTimeZone, contentSnippet, commentCount, reference]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/PostId"
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                channel:
                    $ref: "#/components/schemas/ChannelPreview"
                contentSnippet:
                    $ref: "#/components/schemas/Content_WithoutKeys"
                commentCount:
                    type: integer
                    minimum: 0
                # TODO(#public-api): Document how this is the same as the chat's `title` when
                # displayed as a mention.
                reference:
                    type: object
                    required: [title]
                    additionalProperties: false
                    properties:
                        title:
                            type: string

        # =========================================================================== #
        #                                    Tasks                                    #
        # =========================================================================== #

        TaskQueryCursor:
            type: string

        TaskQueryItem:
            type: object
            required: [cursor, task]
            additionalProperties: false
            properties:
                cursor:
                    $ref: "#/components/schemas/TaskQueryCursor"
                task:
                    $ref: "#/components/schemas/Task"

        Task:
            type: object
            required: [id, status, title, collections, subtasks]
            additionalProperties: false
            properties: &taskProperties
                id:
                    $ref: "#/components/schemas/TaskId"
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                    maxLength: {{taskTitleMaxLength}}
                assignee:
                    $ref: "#/components/schemas/Account"
                due:
                    $ref: "#/components/schemas/TaskDue"
                priority:
                    $ref: "#/components/schemas/TaskPriority"
                layout:
                    $ref: "#/components/schemas/TaskLayout"
                parent:
                    $ref: "#/components/schemas/TaskParent"
                collections:
                    type: array
                    items:
                        $ref: "#/components/schemas/TaskCollectionItem"
                subtasks:
                    $ref: "#/components/schemas/TaskSubtasks"

        TaskWithNotes:
            type: object
            required: [id, status, title, collections, subtasks, notes]
            additionalProperties: false
            properties:
                <<: *taskProperties
                notes:
                    $ref: "#/components/schemas/TaskNotes"

        TaskSubtasks:
            type: object
            required: [openTaskCount, closedTaskCount]
            additionalProperties: false
            properties:
                openTaskCount:
                    type: integer
                    minimum: 0
                closedTaskCount:
                    type: integer
                    minimum: 0

        TaskDue:
            type: object
            required: [date]
            additionalProperties: false
            properties:
                date:
                    type: string
                    format: date

        TaskPriority:
            oneOf:
                - $ref: "#/components/schemas/TaskLowPriority"
                - $ref: "#/components/schemas/TaskMediumPriority"
                - $ref: "#/components/schemas/TaskHighPriority"
                - $ref: "#/components/schemas/TaskUrgentPriority"
            discriminator:
                propertyName: type
                mapping:
                    Low: "#/components/schemas/TaskLowPriority"
                    Medium: "#/components/schemas/TaskMediumPriority"
                    High: "#/components/schemas/TaskHighPriority"
                    Urgent: "#/components/schemas/TaskUrgentPriority"

        TaskLowPriority:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Low

        TaskMediumPriority:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Medium

        TaskHighPriority:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: High

        TaskUrgentPriority:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Urgent

        TaskNotes:
            type: object
            required: [version, content]
            additionalProperties: false
            properties:
                version:
                    type: integer
                    minimum: 0
                content:
                    $ref: "#/components/schemas/Content"

        TaskNotesPatch:
            oneOf:
                - $ref: "#/components/schemas/TaskNotesSetContentPatch"
            discriminator:
                propertyName: type
                mapping:
                    SetContent: "#/components/schemas/TaskNotesSetContentPatch"

        TaskNotesSetContentPatch:
            type: object
            required: [type, version, content]
            additionalProperties: false
            properties:
                type:
                    const: SetContent
                version:
                    type: integer
                    minimum: 0
                content:
                    $ref: "#/components/schemas/Content"

        TaskLayout:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Project

        TaskParent:
            type: object
            required: [task]
            additionalProperties: false
            properties:
                task:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/TaskId"

        TaskParent_Response:
            type: object
            required: [task]
            additionalProperties: false
            properties:
                task:
                    type: object
                    required: [id, title, status]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/TaskId"
                        title:
                            type: string
                        status:
                            $ref: "#/components/schemas/TaskStatus"

        TaskCollectionItem:
            type: object
            required: [collection]
            additionalProperties: false
            properties:
                collection:
                    $ref: "#/components/schemas/TaskCollectionPreview"

        TaskCreateRequest:
            type: object
            additionalProperties: false
            properties:
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                    maxLength: {{taskTitleMaxLength}}
                assignee:
