                propertyName: type
                mapping:
                    Inline: "#/components/schemas/ContentInlinePosition"
                    Before: "#/components/schemas/ContentBeforePosition"
                    After: "#/components/schemas/ContentAfterPosition"

        ContentInlinePosition:
            type: object
            required: [type, key, index]
            additionalProperties: false
            properties:
                type:
                    const: Inline
                key:
                    $ref: "#/components/schemas/ContentKey"
                index:
                    type: integer
                    minimum: 0

        ContentBeforePosition:
            type: object
            required: [type, key]
            additionalProperties: false
            properties:
                type:
                    const: Before
                key:
                    $ref: "#/components/schemas/ContentKey"

        ContentAfterPosition:
            type: object
            required: [type, key]
            additionalProperties: false
            properties:
                type:
                    const: After
                key:
                    $ref: "#/components/schemas/ContentKey"

        ContentRange:
            type: object
            required: [start, end]
            additionalProperties: false
            properties:
                start:
                    $ref: "#/components/schemas/ContentPosition"
                end:
                    $ref: "#/components/schemas/ContentPosition"

