webhooks:
    bot:
        post:
            parameters:
                - name: Alpine-Signature
                  in: header
                  required: false
                  description: >
                      Signature of the raw request body formatted as `sha256=<hex>` where `<hex>` is
                      the hex-encoded HMAC SHA-256 of the raw request body keyed with the bot's
                      webhook secret. Only sent when the bot has a webhook secret configured.
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                [spaceId, botId, botAccountId, attempt, accessToken, eventId, event]
                            additionalProperties: false
                            properties:
                                spaceId:
                                    $ref: "#/components/schemas/SpaceId"
                                botId:
                                    $ref: "#/components/schemas/BotId"
                                botAccountId:
                                    $ref: "#/components/schemas/AccountId"
                                # TODO(calebmer, #public-api): Remove `accountId` after this commit deploys.
                                # It's only here for backwards compatibility purposes.
                                accountId:
                                    $ref: "#/components/schemas/AccountId"
                                attempt:
                                    type: integer
                                    minimum: 1
                                accessToken:
                                    type: string
                                eventId:
                                    $ref: "#/components/schemas/BotWebhookEventId"
                                event:
                                    $ref: "#/components/schemas/BotWebhookEvent"
            responses:
                "200":
                    description:
                        Return a 200 status to indicate that the data was received successfully

components:
    responses:
        Error:
            content:
                application/json:
                    schema:
                        type: object
                        required: [error]
                        additionalProperties: false
                        properties:
                            error:
                                type: object
                                required: [message, retry]
                                additionalProperties: false
                                properties:
                                    message:
                                        type: string
                                        description:
                                            A human-readable message providing more details about
                                            the error.
                                    retry:
                                        type: object
                                        required: [able]
                                        additionalProperties: false
                                        properties:
                                            able:
                                                type: boolean
                                                description:
                                                    If true, it indicates that the request should
                                                    succeed if tried again.

        GetDocument:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, document]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            document:
                                $ref: "#/components/schemas/Document"

        GetTask:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, task]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            task:
                                $ref: "#/components/schemas/Task"

        GetTaskNotes:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, notes]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            notes:
                                $ref: "#/components/schemas/TaskNotes"

        GetMessage:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, message]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            message:
                                $ref: "#/components/schemas/Message"

        GetMessages:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, nextCursor, totalMessageCount, messages]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            totalMessageCount:
                                type: integer
                            # TODO(calebmer, #public-api): My dream is for the API browser to return this
                            # as a link. So you can conveniently paginate through the API in your browser
                            # by clicking `nextCursor`.
                            nextCursor:
                                type: [integer, "null"]
                                minimum: 0
                            messages:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Message"

        GetMessageExperimentalApprovals:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, approvals]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            approvals:
                                type: array
                                items:
                                    $ref: "#/components/schemas/MessageExperimentalApproval"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/completion` endpoints but the
        # intention is to add that endpoint and for it to return the same type as the
        # `PUT` endpoint.
        GetMessageStreamCompletion:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, completion]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            completion:
                                type: object
                                required: [completedTime]
                                additionalProperties: false
                                properties:
                                    completedTime:
                                        $ref: "#/components/schemas/DateTime"

        # NOTE(ifitzsimmons, 2025-11-14): If a client tries pinging a stream after it's
        # been completed, we don't throw an error. Instead, we return the completed time
        # and the last stream ping time (without updating the last stream ping time).
        GetMessageStreamPing:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, ping]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            ping:
                                type: object
                                required: [lastUpdatedTime]
                                additionalProperties: false
                                properties:
                                    lastUpdatedTime:
                                        $ref: "#/components/schemas/DateTime"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/parts/{partIndex}` endpoints but
        # the intention is to add that endpoint and for it to return the same type as
        # the `PUT` endpoint.
        GetMessageStreamPart:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"

        GetPost:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, post]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            post:
                                $ref: "#/components/schemas/Post"

    requestBodies:
        # TODO(ifitzsimmons, #public-api): Response bodies should be assignable to request
        # bodies for objects of the same type. So `GetMessage` should be
        # assignable to `CreateMessage`.
        CreateMessage:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [content]
                        additionalProperties: false
                        properties:
                            isStream:
                                type: boolean
                            createdTimeZone:
                                $ref: "#/components/schemas/TimeZone"
                            parent:
                                $ref: "#/components/schemas/MessageContentPayloadParent"
                            content:
                                $ref: "#/components/schemas/Content"
                            files:
                                type: array
                                items:
                                    $ref: "#/components/schemas/MessageContentPayloadFile"

        # Applies one decision value to every approval in the message that is still
        # undecided. Pending approvals are resolved server side, so a caller with a
        # stale view of the approvals can't mis-target or fail on an approval that
        # was decided concurrently. A message with no pending approvals is a no-op.
        PutMessageExperimentalApprovalsPendingDecision:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [decision]
                        additionalProperties: false
                        properties:
                            decision:
                                type: object
                                required: [value]
                                additionalProperties: false
                                properties:
                                    value:
                                        $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue"

        PatchMessageExperimentalApprovals:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [patches]
                        additionalProperties: false
                        properties:
                            patches:
                                type: array
                                items:
                                    type: object
                                    required: [type, index, decision]
                                    additionalProperties: false
                                    properties:
                                        type:
                                            const: SetDecisionValue
                                        index:
                                            type: integer
                                            minimum: 0
                                        decision:
                                            type: object
                                            required: [value]
                                            additionalProperties: false
                                            properties:
                                                value:
                                                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue"

        # TODO(ifitzsimmons, #public-api): Response bodies should be assignable to request
        # bodies for objects of the same type. So `GetMessageStreamPart` should be
        # assignable to `PutMessageStreamPart`.
        PutMessageStreamPart:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [payload]
                        additionalProperties: false
                        properties:
                            payload:
                                $ref: "#/components/schemas/MessageStreamPartPayload"

    schemas:
        LabelString:
            type: string
            minLength: 1
            maxLength: {{maxLabelStringLength}}

        DateTime:
            type: string
            format: date-time

        TimeZone:
            type: string

        # =========================================================================== #
        #                                     IDs                                     #
        # =========================================================================== #
        #
        # Ordered alphabetically assuming `Id` isn't appended as a suffix. e.g.
        # `TaskId` comes before `TaskCollectionId` even though `C` comes before `I` in
        # the alphabet.

        AccountId:
            type: string
            pattern: ^{{idRegExp}}$

        BotId:
            type: string
            pattern: ^{{idRegExp}}$

        BotWebhookEventId:
            type: string
            pattern: ^{{idRegExp}}$

        ChannelId:
            type: string
            pattern: ^{{idRegExp}}$

        ChatId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentThreadId:
            type: string
            pattern: ^{{idRegExp}}$

        FileId:
            type: string
            pattern: ^{{idRegExp}}$

        PostId:
            type: string
            pattern: ^{{idRegExp}}$

        SiteId:
            type: string
            pattern: ^{{idRegExp}}$

        SpaceId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskCollectionId:
            type: string
            pattern: ^{{idRegExp}}$

        ContentKey:
            type: string
            minLength: 1

        ContentPosition:
            oneOf:
                - $ref: "#/components/schemas/ContentInlinePosition"
                - $ref: "#/components/schemas/ContentBeforePosition"
                - $ref: "#/components/schemas/ContentAfterPosition"
            discriminator:
                propertyName: type
                mapping:
                    Inline: "#/components/schemas/ContentInlinePosition"
                    Before: "#/components/schemas/ContentBeforePosition"
                    After: "#/components/schemas/ContentAfterPosition"

        ContentInlinePosition:
            type: object
            required: [type, key, index]
            additionalProperties: false
            properties:
                type:
                    const: Inline
                key:
                    $ref: "#/components/schemas/ContentKey"
                index:
                    type: integer
                    minimum: 0

        ContentBeforePosition:
            type: object
            required: [type, key]
            additionalProperties: false
            properties:
                type:
                    const: Before
                key:
                    $ref: "#/components/schemas/ContentKey"

        ContentAfterPosition:
            type: object
            required: [type, key]
            additionalProperties: false
            properties:
                type:
                    const: After
                key:
                    $ref: "#/components/schemas/ContentKey"

        ContentRange:
            type: object
            required: [start, end]
            additionalProperties: false
            properties:
                start:
                    $ref: "#/components/schemas/ContentPosition"
                end:
                    $ref: "#/components/schemas/ContentPosition"

        TaskCollectionColor:
            type: string
            enum: [Red, Orange, Yellow, Green, Cyan, Blue, Indigo, Purple, Pink]

        # =========================================================================== #
        #                               Mention targets                               #
        # =========================================================================== #

        # TODO: Rename *MentionTarget to *Target. These are shared between
        # mentions and previews, so "Mention" in the name is misleading.
        # Skip Accounts (no account previews)

        AccountMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Account
                id:
                    $ref: "#/components/schemas/AccountId"

        ChannelMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"

        ChatMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"

        DocumentMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Document
                id:
                    $ref: "#/components/schemas/DocumentId"

        PostMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"

        # TODO(#sites-api): We may want to add a mention response type for sites
        # that includes the first entity id in the site. I'm still not sure how
        # we will communicate site data via the API, so I'm only adding what's
        # necessary for now. The mention target is necessary because the site file
        # entity mention will exist in Alpine content, and API requests to fetch that
        # content should still succeed.
        # We also may NOT want to add a mention target response with the first entity
        # id. Rerouting to the first entity in the site makes sense in the app since
        # we render the site chrome around the entity. For the API, that "reroute"
        # may be pretty confusing/jarring for clients.
        SiteMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Site
                id:
                    $ref: "#/components/schemas/SiteId"

        TaskMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"

        TaskMentionTarget_Response:
            type: object
            required: [type, id, status]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"

        TaskCollectionMentionTarget:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"

        MentionTarget:
            oneOf:
                - $ref: "#/components/schemas/AccountMentionTarget"
                - $ref: "#/components/schemas/ChannelMentionTarget"
                - $ref: "#/components/schemas/ChatMentionTarget"
                - $ref: "#/components/schemas/DocumentMentionTarget"
                - $ref: "#/components/schemas/PostMentionTarget"
                - $ref: "#/components/schemas/SiteMentionTarget"
                - $ref: "#/components/schemas/TaskMentionTarget"
                - $ref: "#/components/schemas/TaskCollectionMentionTarget"
            discriminator:
                propertyName: type
                mapping:
                    Account: "#/components/schemas/AccountMentionTarget"
                    Channel: "#/components/schemas/ChannelMentionTarget"
                    Chat: "#/components/schemas/ChatMentionTarget"
                    Document: "#/components/schemas/DocumentMentionTarget"
                    Post: "#/components/schemas/PostMentionTarget"
                    Site: "#/components/schemas/SiteMentionTarget"
                    Task: "#/components/schemas/TaskMentionTarget"
                    TaskCollection: "#/components/schemas/TaskCollectionMentionTarget"

        PreviewTarget:
            oneOf:
                - $ref: "#/components/schemas/ChannelMentionTarget"
                - $ref: "#/components/schemas/ChatMentionTarget"
                - $ref: "#/components/schemas/DocumentMentionTarget"
                - $ref: "#/components/schemas/PostMentionTarget"
                - $ref: "#/components/schemas/SiteMentionTarget"
                - $ref: "#/components/schemas/TaskMentionTarget"
                - $ref: "#/components/schemas/TaskCollectionMentionTarget"
            discriminator:
                propertyName: type
                mapping:
                    Channel: "#/components/schemas/ChannelMentionTarget"
                    Chat: "#/components/schemas/ChatMentionTarget"
                    Document: "#/components/schemas/DocumentMentionTarget"
                    Post: "#/components/schemas/PostMentionTarget"
                    Site: "#/components/schemas/SiteMentionTarget"
                    Task: "#/components/schemas/TaskMentionTarget"
                    TaskCollection: "#/components/schemas/TaskCollectionMentionTarget"

        # =========================================================================== #
        #                                   Content                                   #
        # =========================================================================== #

        Content:
            type: object
            additionalProperties: false
            required: [elements]
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentBlockElement"

        ContentBlockElement:
            # TODO(calebmer, #public-api): We need to be able to add items without breaking
            # backwards compatibility. When publishing the API, let's figure out what our
            # schema evolution policy is.
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentHeadingBlockElement"
                - $ref: "#/components/schemas/ContentDividerBlockElement"
                - $ref: "#/components/schemas/ContentTableBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
                - $ref: "#/components/schemas/ContentFileBlockElement"
                - $ref: "#/components/schemas/ContentFileGalleryBlockElement"
                - $ref: "#/components/schemas/ContentFileFloatBlockElement"
                - $ref: "#/components/schemas/ContentPreviewBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Heading: "#/components/schemas/ContentHeadingBlockElement"
                    Divider: "#/components/schemas/ContentDividerBlockElement"
                    Table: "#/components/schemas/ContentTableBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"
                    File: "#/components/schemas/ContentFileBlockElement"
                    FileGallery: "#/components/schemas/ContentFileGalleryBlockElement"
                    FileFloat: "#/components/schemas/ContentFileFloatBlockElement"
                    Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentParagraphBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Paragraph
                key:
                    $ref: "#/components/schemas/ContentKey"
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentParagraphBlockElement_Response:
            type: object
            required: [type, key, elements]
            additionalProperties: false
            properties:
                type:
                    const: Paragraph
                key:
                    $ref: "#/components/schemas/ContentKey"
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement_Response"

        ContentListBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentUnorderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: UnorderedList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentOrderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: OrderedList
                orderStart:
                    type: integer
                    minimum: 1
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentCheckListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: CheckList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCheckListBlockElementItem"

        ContentListBlockElementItem:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                # TODO(calebmer, #public-api): If `elements` is an empty array then this is a
                # "phantom" list item. Phantom list items exist purely to increase the
                # indentation level of their children and aren't rendered as a list item
                # themselves. There's no bullet! An `elements` array with an empty paragraph
                # does render an item.
                #
                # We need to clearly document this behavior in our API documentation.
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentCheckListBlockElementItem:
            type: object
            required: [checked, elements]
            additionalProperties: false
            properties:
                checked:
                    type: boolean
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentQuoteBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Quote
                elements:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentQuoteBlockElementBlockElement"

        ContentQuoteBlockElementBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentHeadingBlockElement:
            type: object
            required: [type, level, elements]
            additionalProperties: false
            properties:
                type:
                    const: Heading
                key:
                    $ref: "#/components/schemas/ContentKey"
                level:
                    type: integer
                    minimum: 1
                    maximum: 3
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentHeadingBlockElement_Response:
            type: object
            required: [type, key, level, elements]
            additionalProperties: false
            properties:
                type:
                    const: Heading
                key:
                    $ref: "#/components/schemas/ContentKey"
                level:
                    type: integer
                    minimum: 1
                    maximum: 3
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement_Response"

        ContentDividerBlockElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Divider

        ContentTableBlockElement:
            type: object
            required: [type, width, columns, rows]
            additionalProperties: false
            properties:
                type:
                    const: Table
                width:
                    type: number
                hasHeaderRow:
                    type: boolean
                hasHeaderColumn:
                    type: boolean
                columns:
                    type: array
                    minItems: 2
                    items:
                        type: object
                        required: [width]
                        additionalProperties: false
                        properties:
                            width:
                                type: number
                rows:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementRow"

        ContentTableBlockElementRow:
            type: object
            required: [cells]
            additionalProperties: false
            properties:
                cells:
                    type: array
                    minItems: 2
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCell"

        ContentTableBlockElementCell:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCellBlockElement"

        ContentTableBlockElementCellBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
                - $ref: "#/components/schemas/ContentFileBlockElement"
                - $ref: "#/components/schemas/ContentPreviewBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"
                    File: "#/components/schemas/ContentFileBlockElement"
                    Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentCodeBlockElement:
            type: object
            required: [type, language, lines]
            additionalProperties: false
            properties:
                type:
                    const: Code
                language:
                    type: string
                    enum: {{codeBlockLanguageIds}}
                lines:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementLine"

        ContentCodeBlockElementLine:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                key:
                    $ref: "#/components/schemas/ContentKey"
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElement"

        ContentCodeBlockElementLine_Response:
            type: object
            required: [key, elements]
            additionalProperties: false
            properties:
                key:
                    $ref: "#/components/schemas/ContentKey"
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElement"

        ContentFileBlockElement:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: File
                id:
                    $ref: "#/components/schemas/FileId"
                # Ignored on write but ensures ContentFileBlockElement_Response
                # is compatible as input.
                contentType:
                    type: string
                    enum: {{fileContentTypes}}
                contentLength:
                    type: integer
                    minimum: 0

        ContentFileBlockElement_Response:
            type: object
            required: [type, key, id, contentType, contentLength]
            additionalProperties: false
            properties:
                type:
                    const: File
                key:
                    $ref: "#/components/schemas/ContentKey"
                id:
                    $ref: "#/components/schemas/FileId"
                contentType:
                    type: string
                    enum: {{fileContentTypes}}
                contentLength:
                    type: integer
                    minimum: 0

        ContentPreviewBlockElement:
            type: object
            required: [type, target]
            additionalProperties: false
            properties:
                type:
                    const: Preview
                target:
                    $ref: "#/components/schemas/PreviewTarget"
                # Ignored on write but ensures ContentPreviewBlockElement_Response
                # is compatible as input.
                title:
                    type: string

        # TODO: Auto-generate _Response variants from their base types instead
        # of duplicating fields manually.
        ContentPreviewBlockElement_Response:
            type: object
            required: [type, key, target, title]
            additionalProperties: false
            properties:
                type:
                    const: Preview
                key:
                    $ref: "#/components/schemas/ContentKey"
                target:
                    $ref: "#/components/schemas/PreviewTarget"
                title:
                    type: string
                    minLength: 1

        ContentFileGalleryBlockElement:
            type: object
            required: [type, rows]
            additionalProperties: false
            properties:
                type:
                    const: FileGallery
                rows:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentFileGalleryBlockElementRow"

        ContentFileGalleryBlockElementRow:
            type: object
            required: [items]
            additionalProperties: false
            properties:
                items:
                    type: array
                    minItems: 1
                    maxItems: 3
                    items:
                        $ref: "#/components/schemas/ContentFileGalleryBlockElementRowItem"

        ContentFileGalleryBlockElementRowItem:
            type: object
            required: [element]
            additionalProperties: false
            properties:
                # Fractional width from 0 to 1 representing the item's share
                # of the row width. Values in a row sum to 1. Ignored on
                # write, populated on read.
                width:
                    type: number
                    minimum: 0
                    maximum: 1
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentFileGalleryBlockElementRowItem_Response:
            type: object
            required: [width, element]
            additionalProperties: false
            properties:
                width:
                    type: number
                    minimum: 0
                    maximum: 1
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentFileFloatBlockElement:
            type: object
            required: [type, side, element]
            additionalProperties: false
            properties:
                type:
                    const: FileFloat
                side:
                    type: string
                    enum: [Left, Right]
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        ContentInlineElement:
            oneOf:
                - $ref: "#/components/schemas/ContentTextInlineElement"
                - $ref: "#/components/schemas/ContentBreakInlineElement"
                - $ref: "#/components/schemas/ContentMentionInlineElement"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/ContentTextInlineElement"
                    Break: "#/components/schemas/ContentBreakInlineElement"
                    Mention: "#/components/schemas/ContentMentionInlineElement"

        ContentTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                # TODO(calebmer, #public-api): Document that marks are an unordered set. Mark
                # order doesn't matter and duplicates aren't allowed.
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentBreakInlineElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Break
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentMentionInlineElement:
            type: object
            required: [type, target]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                target:
                    $ref: "#/components/schemas/MentionTarget"
                # TODO(calebmer, #public-api): Document that this will be ignored if you try to
                # create content with a `title`. This property exists solely as a convenience
                # for code that wants to operate on both `ContentMentionInlineElement` and
                # `ContentMentionInlineElement_Response` (which will always have a title).
                title:
                    type: string
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentMentionInlineElement_Response:
            type: object
            required: [type, target, title]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                target:
                    $ref: "#/components/schemas/MentionTarget"
                # TODO(calebmer, #public-api): Document that `title` is loaded using the search
                # index so may be stale by up to 90s! (60s for slow document reindexing + 10s
                # for OpenSearch refresh interval. Say 90s to give us enough buffer.)
                title:
                    type: string
                    minLength: 1
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        # Simpler mention type that's compatible with `ContentMentionInlineElement` but
        # without extra element properties like `type` and `marks`.
        Mention:
            type: object
            required: [target]
            additionalProperties: false
            properties:
                target:
                    $ref: "#/components/schemas/MentionTarget"
                # TODO(calebmer, #public-api): Document that this will be ignored if you try to
                # create content with a `title`. This property exists solely as a convenience
                # for code that wants to operate on both `ContentMentionInlineElement` and
                # `ContentMentionInlineElement_Response` (which will always have a title).
                title:
                    type: string

        Mention_Response:
            type: object
            required: [target, title]
            additionalProperties: false
            properties:
                target:
                    $ref: "#/components/schemas/MentionTarget"
                title:
                    type: string

        ContentInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementBoldMark"
                - $ref: "#/components/schemas/ContentInlineElementItalicMark"
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementLinkMark"
                - $ref: "#/components/schemas/ContentInlineElementCodeMark"
                - $ref: "#/components/schemas/ContentInlineElementHighlightMark"
                - $ref: "#/components/schemas/ContentInlineElementCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentInlineElementBoldMark"
                    Italic: "#/components/schemas/ContentInlineElementItalicMark"
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Link: "#/components/schemas/ContentInlineElementLinkMark"
                    Code: "#/components/schemas/ContentInlineElementCodeMark"
                    Highlight: "#/components/schemas/ContentInlineElementHighlightMark"
                    Comment: "#/components/schemas/ContentInlineElementCommentMark"

        ContentInlineElementBoldMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Bold

        ContentInlineElementItalicMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Italic

        ContentInlineElementStrikeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Strike

        ContentInlineElementLinkMark:
            type: object
            required: [type, url]
            additionalProperties: false
            properties:
                type:
                    const: Link
                url:
                    type: string

        ContentInlineElementCodeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Code

        ContentInlineElementHighlightMark:
            type: object
            required: [type, color]
            additionalProperties: false
            properties:
                type:
                    const: Highlight
                color:
                    $ref: "#/components/schemas/ContentInlineElementHighlightMarkColor"

        ContentInlineElementHighlightMarkColor:
            type: string
            enum:
                - Red
                - Orange
                - Green
                - Blue
                - Purple

        ContentInlineElementCommentMark:
            type: object
            required: [type, threadId]
            additionalProperties: false
            properties:
                type:
                    const: Comment
                threadId:
                    $ref: "#/components/schemas/DocumentThreadId"

        ContentCodeBlockElementTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                    pattern: ^[^\n\r]*$
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElementMark"

        ContentCodeBlockElementTextInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementBoldMark"
                - $ref: "#/components/schemas/ContentInlineElementItalicMark"
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementLinkMark"
                - $ref: "#/components/schemas/ContentInlineElementHighlightMark"
                - $ref: "#/components/schemas/ContentInlineElementCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentInlineElementBoldMark"
                    Italic: "#/components/schemas/ContentInlineElementItalicMark"
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Link: "#/components/schemas/ContentInlineElementLinkMark"
                    Highlight: "#/components/schemas/ContentInlineElementHighlightMark"
                    Comment: "#/components/schemas/ContentInlineElementCommentMark"

        LabelContent:
            type: object
            additionalProperties: false
            required: [elements]
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/LabelContentInlineElement"

        LabelContentInlineElement:
            oneOf:
                - $ref: "#/components/schemas/LabelContentTextInlineElement"
                - $ref: "#/components/schemas/LabelContentMentionInlineElement"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/LabelContentTextInlineElement"
                    Mention: "#/components/schemas/LabelContentMentionInlineElement"

        LabelContentInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementItalicMark"
                - $ref: "#/components/schemas/ContentInlineElementCodeMark"
            discriminator:
                propertyName: type
                mapping:
                    Italic: "#/components/schemas/ContentInlineElementItalicMark"
                    Code: "#/components/schemas/ContentInlineElementCodeMark"

        LabelContentTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                # TODO(calebmer, #public-api): Document that marks are an unordered set. Mark
                # order doesn't matter and duplicates aren't allowed.
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/LabelContentInlineElementMark"

        LabelContentMentionInlineElement:
            type: object
            required: [type, target]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                target:
                    $ref: "#/components/schemas/MentionTarget"
                # TODO(calebmer, #public-api): Document that this will be ignored if you try to
                # create content with a `title`. This property exists solely as a convenience
                # for code that wants to operate on both `ContentMentionInlineElement` and
                # `ContentMentionInlineElement_Response` (which will always have a title).
                title:
                    type: string
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/LabelContentInlineElementMark"

        LabelContentMentionInlineElement_Response:
            type: object
            required: [type, target, title]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                target:
                    $ref: "#/components/schemas/MentionTarget"
                # TODO(calebmer, #public-api): Document that `title` is loaded using the search
                # index so may be stale by up to 90s! (60s for slow document reindexing + 10s
                # for OpenSearch refresh interval. Say 90s to give us enough buffer.)
                title:
                    type: string
                    minLength: 1
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/LabelContentInlineElementMark"

        # =========================================================================== #
        #                                  Entities                                   #
        # =========================================================================== #

        AccountWithoutSpace:
            type: object
            required: [id, name, shortName]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    $ref: "#/components/schemas/LabelString"
                botId:
                    $ref: "#/components/schemas/BotId"

        Space:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/SpaceId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Account:
            type: object
            required: [id, name, shortName, space]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    type: string
                    minLength: 1
                    maxLength: 50
                botId:
                    $ref: "#/components/schemas/BotId"
                space:
                    type: object
                    required: [role, addedTime]
                    additionalProperties: false
                    properties:
                        role:
                            type: string
                            enum: [Owner, Admin, Member]
                        addedTime:
                            $ref: "#/components/schemas/DateTime"
                        # TODO(calebmer, #public-api): Bikeshed what the right way to expose account
                        # state over the public API is.
                        inactive:
                            $ref: "#/components/schemas/AccountSpaceInactive"

        AccountSpaceInactive:
            oneOf:
                - $ref: "#/components/schemas/AccountSpaceRemovedInactive"
                - $ref: "#/components/schemas/AccountSpaceInvitePendingInactive"
            discriminator:
                propertyName: type
                mapping:
                    Removed: "#/components/schemas/AccountSpaceRemovedInactive"
                    InvitePending: "#/components/schemas/AccountSpaceInvitePendingInactive"

        AccountSpaceRemovedInactive:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Removed
                removedTime:
                    $ref: "#/components/schemas/DateTime"

        AccountSpaceInvitePendingInactive:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: InvitePending

        Inbox:
            type: object
            required: [newEntryCount, loudNotificationCount]
            additionalProperties: false
            properties:
                newEntryCount:
                    type: integer
                    minimum: 0
                loudNotificationCount:
                    type: integer
                    minimum: 0

        InboxEntryShared:
            type: object
            required: [title, time, loudNotificationCount, status, featured]
            additionalProperties: false
            # Anchor merged into each `Inbox*Entry` schema (YAML merge) so shared fields stay
            # single-sourced while each variant remains one flat object for AJV.
            properties: &inboxEntrySharedProperties
                title:
                    type: array
                    items:
                        $ref: "#/components/schemas/InboxEntryTitleItem"
                preview:
                    type: string
                time:
                    $ref: "#/components/schemas/DateTime"
                loudNotificationCount:
                    type: integer
                    minimum: 0
                status:
                    type: string
                    enum: [New, Done]
                featured:
                    type: object
                    required: [type]
                    additionalProperties: false
                    oneOf:
                        - $ref: "#/components/schemas/InboxEntryAccountFeatured"
                    discriminator:
                        propertyName: type
                        mapping:
                            Account: "#/components/schemas/InboxEntryAccountFeatured"
                otherAccount:
                    $ref: "#/components/schemas/Account"

        InboxEntryTitleItem:
            oneOf:
                - $ref: "#/components/schemas/InboxEntryTitleTextItem"
                - $ref: "#/components/schemas/InboxEntryTitleAccountItem"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/InboxEntryTitleTextItem"
                    Account: "#/components/schemas/InboxEntryTitleAccountItem"

        InboxEntryTitleTextItem:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string

        InboxEntryTitleAccountItem:
            type: object
            required: [type, account]
            additionalProperties: false
            properties:
                type:
                    const: Account
                account:
                    $ref: "#/components/schemas/Account"

        InboxEntryAccountFeatured:
            type: object
            required: [type, account]
            additionalProperties: false
            properties:
                type:
                    const: Account
                account:
                    $ref: "#/components/schemas/Account"

        InboxEntry:
            oneOf:
                - $ref: "#/components/schemas/InboxChatEntry"
                - $ref: "#/components/schemas/InboxCreatedChannelPostsEntry"
                - $ref: "#/components/schemas/InboxPostEntry"
                - $ref: "#/components/schemas/InboxCreatedDocumentThreadsEntry"
                - $ref: "#/components/schemas/InboxDocumentThreadEntry"
                - $ref: "#/components/schemas/InboxTaskMessagesEntry"
            discriminator:
                propertyName: type
                mapping:
                    Chat: "#/components/schemas/InboxChatEntry"
                    CreatedChannelPosts: "#/components/schemas/InboxCreatedChannelPostsEntry"
                    Post: "#/components/schemas/InboxPostEntry"
                    CreatedDocumentThreads: "#/components/schemas/InboxCreatedDocumentThreadsEntry"
                    DocumentThread: "#/components/schemas/InboxDocumentThreadEntry"
                    TaskMessages: "#/components/schemas/InboxTaskMessagesEntry"

        InboxChatEntry:
            type: object
            required:
                [title, time, loudNotificationCount, status, featured, type, chat, previewMessage]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: Chat
                chat:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/ChatId"
                previewMessage:
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        InboxCreatedChannelPostsEntry:
            type: object
            required: [title, time, loudNotificationCount, status, featured, type, channel, posts]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: CreatedChannelPosts
                channel:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/ChannelId"
                posts:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required: [id]
                        additionalProperties: false
                        properties:
                            id:
                                $ref: "#/components/schemas/PostId"

        InboxPostEntry:
            type: object
            required: [title, time, loudNotificationCount, status, featured, type, post]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: Post
                post:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/PostId"
                # TODO(#public-api): Document that `previewMessage` is optional because an
                # `InboxPostEntry` can be created from a mention in the post itself, before
                # any comments exist on the post. In that case there is no comment to preview.
                previewMessage:
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        InboxCreatedDocumentThreadsEntry:
            type: object
            required:
                [title, time, loudNotificationCount, status, featured, type, document, threads]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: CreatedDocumentThreads
                document:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/DocumentId"
                threads:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required: [id]
                        additionalProperties: false
                        properties:
                            id:
                                $ref: "#/components/schemas/DocumentThreadId"

        InboxDocumentThreadEntry:
            type: object
            required:
                [title, time, loudNotificationCount, status, featured, type, thread, previewMessage]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: DocumentThread
                thread:
                    type: object
                    required: [id, document]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/DocumentThreadId"
                        document:
                            type: object
                            required: [id]
                            additionalProperties: false
                            properties:
                                id:
                                    $ref: "#/components/schemas/DocumentId"
                previewMessage:
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        InboxTaskMessagesEntry:
            type: object
            required:
                [title, time, loudNotificationCount, status, featured, type, task, previewMessage]
            additionalProperties: false
            properties:
                <<: *inboxEntrySharedProperties
                type:
                    const: TaskMessages
                task:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/TaskId"
                previewMessage:
                    type: object
                    required: [index]
                    additionalProperties: false
                    properties:
                        index:
                            type: integer
                            minimum: 0

        Chat:
            oneOf:
                - $ref: "#/components/schemas/DirectChat"
                - $ref: "#/components/schemas/RoomChat"
            discriminator:
                propertyName: type
                mapping:
                    Direct: "#/components/schemas/DirectChat"
                    Room: "#/components/schemas/RoomChat"

        DirectChat:
            type: object
            required: [type, id, members]
            additionalProperties: false
            properties:
                type:
                    const: Direct
                id:
                    $ref: "#/components/schemas/ChatId"
                members:
                    type: array
                    items:
                        type: object
                        required: [account]
                        additionalProperties: false
                        properties:
                            account:
                                $ref: "#/components/schemas/Account"

        RoomChat:
            type: object
            required: [type, id, name]
            additionalProperties: false
            properties:
                type:
                    const: Room
                id:
                    $ref: "#/components/schemas/ChatId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Document:
            type: object
            required: [id, version, title, content]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentId"
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                version:
                    type: integer
                    minimum: 0
                title:
                    type: string
                content:
                    $ref: "#/components/schemas/Content"

        DocumentPreview:
            type: object
            required: [id, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentId"
                title:
                    type: string

        DocumentCommentThread:
            type: object
            required:
                [
                    id,
                    createdTime,
                    isResolved,
                    commentCount,
                    firstCommentAuthor,
                    documentContentSnippet,
                ]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentThreadId"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                isResolved:
                    type: boolean
                commentCount:
                    type: integer
                    minimum: 0
                firstCommentAuthor:
                    oneOf:
                        - $ref: "#/components/schemas/Account"
                        - type: "null"
                documentContentSnippet:
                    $ref: "#/components/schemas/Content"

        ChannelPreview:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Channel:
            type: object
            required: [id, name, description]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"
                description:
                    $ref: "#/components/schemas/Content"

        Post:
            type: object
            # `channel` is intentionally optional since we may allow users to create posts
            # that aren't in a channel in the future.
            required: [id, author, createdTime, createdTimeZone, content, contentPreview]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/PostId"
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                channel:
                    $ref: "#/components/schemas/ChannelPreview"
                content:
                    $ref: "#/components/schemas/Content"
                contentPreview:
                    type: string

        # TODO(ifitzsimmons, #ai): Add a `/posts/{id}/preview` endpoint that returns a
        # a `PostPreview`
        # https://alpine.inc/s/c2pwxmpv3z7b3db19tsn6y1qfg/tasks/znbyh8f7sx5s0nb29zygvcasjw
        PostPreview:
            type: object
            required: [id, author, createdTime, createdTimeZone]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/PostId"
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                channel:
                    $ref: "#/components/schemas/ChannelPreview"

        Task:
            type: object
            required: [id, status, title, notes]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                    maxLength: {{taskTitleMaxLength}}
                assignee:
                    $ref: "#/components/schemas/Account"
                due:
                    $ref: "#/components/schemas/TaskDueDate"
                priority:
                    type: string
                    enum: [Low, Medium, High, Urgent]
                layout:
                    $ref: "#/components/schemas/TaskLayout"
                parent:
                    $ref: "#/components/schemas/TaskParent"
                collections:
                    type: array
                    items:
                        $ref: "#/components/schemas/TaskCollectionItem"
                notes:
                    $ref: "#/components/schemas/TaskNotes"

        TaskWithoutNotes:
            type: object
            required: [id, status, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                    maxLength: {{taskTitleMaxLength}}
                assignee:
                    $ref: "#/components/schemas/Account"
                due:
                    $ref: "#/components/schemas/TaskDueDate"
                priority:
                    type: string
                    enum: [Low, Medium, High, Urgent]
                layout:
                    $ref: "#/components/schemas/TaskLayout"
                parent:
                    $ref: "#/components/schemas/TaskParent"
                collections:
                    type: array
                    items:
                        $ref: "#/components/schemas/TaskCollectionItem"

        TaskPreview:
            type: object
            required: [id, status, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string

        TaskDueDate:
            type: object
            required: [date]
            additionalProperties: false
            properties:
                date:
                    type: string
                    format: date

        TaskNotes:
            type: object
            required: [version, content]
            additionalProperties: false
            properties:
                version:
                    type: integer
                    minimum: 0
                content:
                    $ref: "#/components/schemas/Content"

        TaskLayout:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Project

        TaskParent:
            type: object
            required: [task]
            additionalProperties: false
            properties:
                task:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/TaskId"

        TaskCollectionItem:
            type: object
            required: [collection]
            additionalProperties: false
            properties:
                collection:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/TaskCollectionId"

        TaskPatch:
            oneOf:
                - $ref: "#/components/schemas/TaskSetTitlePatch"
                - $ref: "#/components/schemas/TaskSetAssigneePatch"
                - $ref: "#/components/schemas/TaskSetStatusPatch"
                - $ref: "#/components/schemas/TaskSetDueDatePatch"
                - $ref: "#/components/schemas/TaskSetPriorityPatch"
                - $ref: "#/components/schemas/TaskSetLayoutPatch"
                - $ref: "#/components/schemas/TaskSetParentPatch"
                - $ref: "#/components/schemas/TaskAddCollectionPatch"
                - $ref: "#/components/schemas/TaskRemoveCollectionPatch"
            discriminator:
                propertyName: type
                mapping:
                    SetTitle: "#/components/schemas/TaskSetTitlePatch"
                    SetAssignee: "#/components/schemas/TaskSetAssigneePatch"
                    SetStatus: "#/components/schemas/TaskSetStatusPatch"
                    SetDueDate: "#/components/schemas/TaskSetDueDatePatch"
                    SetPriority: "#/components/schemas/TaskSetPriorityPatch"
                    SetLayout: "#/components/schemas/TaskSetLayoutPatch"
                    SetParent: "#/components/schemas/TaskSetParentPatch"
                    AddCollection: "#/components/schemas/TaskAddCollectionPatch"
                    RemoveCollection: "#/components/schemas/TaskRemoveCollectionPatch"

        TaskSetTitlePatch:
            type: object
            required: [type, title]
            additionalProperties: false
            properties:
                type:
                    const: SetTitle
                title:
                    type: string

        TaskSetAssigneePatch:
            type: object
            required: [type, assignee]
            additionalProperties: false
            properties:
                type:
                    const: SetAssignee
                assignee:
                    oneOf:
                        - $ref: "#/components/schemas/AccountId"
                        - type: "null"

        TaskSetStatusPatch:
            type: object
            required: [type, status]
            additionalProperties: false
            properties:
                type:
                    const: SetStatus
                status:
                    $ref: "#/components/schemas/TaskStatus"

        TaskSetDueDatePatch:
            type: object
            required: [type, due]
            additionalProperties: false
            properties:
                type:
                    const: SetDueDate
                due:
                    oneOf:
                        - $ref: "#/components/schemas/TaskDueDate"
                        - type: "null"

        TaskSetPriorityPatch:
            type: object
            required: [type, priority]
            additionalProperties: false
            properties:
                type:
                    const: SetPriority
                priority:
                    oneOf:
                        - type: string
                          enum: [Low, Medium, High, Urgent]
                        - type: "null"

        TaskSetLayoutPatch:
            type: object
            required: [type, layout]
            additionalProperties: false
            properties:
                type:
                    const: SetLayout
                layout:
                    oneOf:
                        - $ref: "#/components/schemas/TaskLayout"
                        - type: "null"

        TaskSetParentPatch:
            type: object
            required: [type, parent]
            additionalProperties: false
            properties:
                type:
                    const: SetParent
                parent:
                    oneOf:
                        - $ref: "#/components/schemas/TaskParent"
                        - type: "null"

        TaskAddCollectionPatch:
            type: object
            required: [type, item]
            additionalProperties: false
            properties:
                type:
                    const: AddCollection
                item:
                    $ref: "#/components/schemas/TaskCollectionItem"

        TaskRemoveCollectionPatch:
            type: object
            required: [type, collectionId]
            additionalProperties: false
            properties:
                type:
                    const: RemoveCollection
                collectionId:
                    $ref: "#/components/schemas/TaskCollectionId"

        TaskCollectionPatch:
            oneOf:
                - $ref: "#/components/schemas/TaskCollectionSetNamePatch"
                - $ref: "#/components/schemas/TaskCollectionSetColorPatch"
            discriminator:
                propertyName: type
                mapping:
                    SetName: "#/components/schemas/TaskCollectionSetNamePatch"
                    SetColor: "#/components/schemas/TaskCollectionSetColorPatch"

        TaskCollectionSetNamePatch:
            type: object
            required: [type, name]
            additionalProperties: false
            properties:
                type:
                    const: SetName
                name:
                    $ref: "#/components/schemas/LabelString"

        TaskCollectionSetColorPatch:
            type: object
            required: [type, color]
            additionalProperties: false
            properties:
                type:
                    const: SetColor
                color:
                    oneOf:
                        - $ref: "#/components/schemas/TaskCollectionColor"
                        - type: "null"

        TaskStatus:
            oneOf:
                - $ref: "#/components/schemas/TaskOpenStatus"
                - $ref: "#/components/schemas/TaskClosedStatus"
            discriminator:
                propertyName: type
                mapping:
                    Open: "#/components/schemas/TaskOpenStatus"
                    Closed: "#/components/schemas/TaskClosedStatus"

        TaskOpenStatus:
            type: object
            required: [type, isActive]
            additionalProperties: false
            properties:
                type:
                    const: Open
                isActive:
                    type: boolean

        TaskClosedStatus:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Closed

        TaskCollection:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskCollectionId"
                # TODO(#public-api-blocking): Use `$ref: "#/components/schemas/Actor"` instead.
                creator:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                color:
                    oneOf:
                        - $ref: "#/components/schemas/TaskCollectionColor"
                        - type: "null"

        # =========================================================================== #
        #                                  Messages                                   #
        # =========================================================================== #

        Message:
            type: object
            required: [index, author, createdTime, createdTimeZone, payload]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                payload:
                    $ref: "#/components/schemas/MessagePayload"

        MessagePayload:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayload"
                - $ref: "#/components/schemas/MessageDeletedPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageContentPayload"
                    Deleted: "#/components/schemas/MessageDeletedPayload"

        MessageContentPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                parent:
                    $ref: "#/components/schemas/MessageContentPayloadParent"
                content:
                    $ref: "#/components/schemas/Content"
                files:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadFile"

        MessageContentPayload_Response:
            type: object
            required: [type, content, files]
            additionalProperties: false
            properties:
                type:
                    const: Content
                parent:
                    $ref: "#/components/schemas/MessageContentPayloadParent"
                content:
                    $ref: "#/components/schemas/Content_Response"
                files:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadFile_Response"

        MessageContentPayloadFile:
            type: object
            required: [element]
            additionalProperties: false
            properties:
                rowIndex:
                    type: integer
                    minimum: 0
                width:
                    type: number
                    minimum: 0
                    maximum: 1
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        MessageContentPayloadFileFileElement_Response:
            type: object
            required: [type, id, contentType, contentLength]
            additionalProperties: false
            properties:
                type:
                    const: File
                id:
                    $ref: "#/components/schemas/FileId"
                contentType:
                    type: string
                    enum: {{fileContentTypes}}
                contentLength:
                    type: integer
                    minimum: 0

        MessageContentPayloadFilePreviewElement_Response:
            type: object
            required: [type, target, title]
            additionalProperties: false
            properties:
                type:
                    const: Preview
                target:
                    $ref: "#/components/schemas/PreviewTarget_Response"
                title:
                    type: string
                    minLength: 1

        MessageContentPayloadFileElement_Response:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayloadFileFileElement_Response"
                - $ref: "#/components/schemas/MessageContentPayloadFilePreviewElement_Response"
            discriminator:
                propertyName: type
                mapping:
                    File: "#/components/schemas/MessageContentPayloadFileFileElement_Response"
                    Preview: "#/components/schemas/MessageContentPayloadFilePreviewElement_Response"

        MessageContentPayloadFile_Response:
            type: object
            required: [rowIndex, width, element]
            additionalProperties: false
            properties:
                rowIndex:
                    type: integer
                    minimum: 0
                width:
                    type: number
                    minimum: 0
                    maximum: 1
                element:
                    $ref: "#/components/schemas/MessageContentPayloadFileElement_Response"

        MessageContentPayloadParent:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayloadMessageParent"
                - $ref: "#/components/schemas/MessageContentPayloadPostParent"
            discriminator:
                propertyName: type
                mapping:
                    Message: "#/components/schemas/MessageContentPayloadMessageParent"
                    Post: "#/components/schemas/MessageContentPayloadPostParent"

        MessageContentPayloadMessageParent:
            type: object
            required: [type, index]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                    minimum: 0

        MessageContentPayloadMessageParent_Response:
            type: object
            required: [type, index, author, contentSnippet]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                    minimum: 0
                # NOTE(ifitzsimmons, #api): Alpine users can reply to a selection of content that
                # that can span across more than 1 message (we refer to this as a "range"). If the
                # parent is a "range", the `index` is the start index of the range the `endIndex`
                # will be a positive integer (instead of undefined).
                endIndex:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                contentSnippet:
                    $ref: "#/components/schemas/MessageContentPayloadParentContentSnippet"

        MessageContentPayloadPostParent:
            type: object
            required: [type, author, contentSnippet]
            additionalProperties: false
            properties:
                type:
                    const: Post

        # TODO(ifitzsimmons, #public-api): We don't actually return the range information for
        # now. In order for a client to use the actual range, we need to return the start
        # and end index *along with the content version*. Eventually, we should encode these
        # into `postSelectionId` – but I don't think we should expose the range in the meantime.
        # In terms of our agents, we can use the `isTruncated` property to determine whether we
        # need to fetch the whole post. The full message and the truncated message should give
        # the agent enough context to reply to the request.
        MessageContentPayloadPostParent_Response:
            type: object
            required: [type, author, contentSnippet]
            additionalProperties: false
            properties:
                type:
                    const: Post
                author:
                    $ref: "#/components/schemas/Account"
                contentSnippet:
                    $ref: "#/components/schemas/MessageContentPayloadParentContentSnippet"

        MessageDeletedPayload:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Deleted

        MessageStreamPart:
            type: object
            required: [index, version, payload, createdTime]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                version:
                    type: integer
                    minimum: 0
                createdTime:
                    type: string
                    format: date-time
                payload:
                    $ref: "#/components/schemas/MessageStreamPartPayload"

        MessageStreamPartPayload:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamContentPartPayload"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayload"
                - $ref: "#/components/schemas/MessageStreamReasoningPartPayload"
                - $ref: "#/components/schemas/MessageStreamExperimentalApprovalsPartPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageStreamContentPartPayload"
                    ToolCall: "#/components/schemas/MessageStreamToolCallPartPayload"
                    Reasoning: "#/components/schemas/MessageStreamReasoningPartPayload"
                    ExperimentalApprovals: "#/components/schemas/MessageStreamExperimentalApprovalsPartPayload"

        MessageStreamExperimentalApprovalsPartPayload:
            type: object
            required: [type, approvals]
            additionalProperties: false
            properties:
                type:
                    const: ExperimentalApprovals
                approvals:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageExperimentalApproval"

        MessageExperimentalApproval:
            type: object
            required: [summary, decision]
            additionalProperties: false
            properties:
                summary:
                    $ref: "#/components/schemas/LabelContent"
                decision:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecision"

        MessageExperimentalApprovalDecision:
            type: object
            required: [schema]
            additionalProperties: false
            properties:
                schema:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionSchema"
                value:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue"

        MessageExperimentalApprovalDecisionSchema:
            type: object
            required: [options]
            additionalProperties: false
            properties:
                options:
                    type: array
                    # NOTE(ifitzsimmons, 2026-06-30): Clients must include at least one option,
                    # otherwise the approval is not actionable. Ideally, clients would always
                    # include an `Approved` and `Rejected` option, but we don't require it.
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/MessageExperimentalApprovalDecisionOption"

        MessageExperimentalApprovalDecisionOption:
            oneOf:
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedOption"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedOption"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionOption"
            discriminator:
                propertyName: type
                mapping:
                    Approved: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedOption"
                    Rejected: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedOption"
                    ApprovedForSession: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionOption"

        MessageExperimentalApprovalDecisionApprovedOption:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Approved

        MessageExperimentalApprovalDecisionRejectedOption:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Rejected

        MessageExperimentalApprovalDecisionApprovedForSessionOption:
            type: object
            required: [type, scope, durationMinutes]
            additionalProperties: false
            properties:
                type:
                    const: ApprovedForSession
                scope:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValueScope"
                summary:
                    $ref: "#/components/schemas/LabelContent"
                durationMinutes:
                    oneOf:
                        - type: integer
                          minimum: 1
                        # NOTE(ifitzsimmons) `null` means that the approval is applied for the duration
                        # of the session.
                        - type: "null"

        MessageExperimentalApprovalDecisionValue:
            oneOf:
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedValue"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedValue"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValue"
            discriminator:
                propertyName: type
                mapping:
                    Approved: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedValue"
                    Rejected: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedValue"
                    ApprovedForSession: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValue"

        MessageExperimentalApprovalDecisionApprovedValue:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Approved

        MessageExperimentalApprovalDecisionApprovedValue_Response:
            type: object
            required: [type, decider]
            additionalProperties: false
            properties:
                type:
                    const: Approved
                decider:
                    $ref: "#/components/schemas/Actor"

        MessageExperimentalApprovalDecisionRejectedValue:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Rejected

        MessageExperimentalApprovalDecisionRejectedValue_Response:
            type: object
            required: [type, decider]
            additionalProperties: false
            properties:
                type:
                    const: Rejected
                decider:
                    $ref: "#/components/schemas/Actor"

        MessageExperimentalApprovalDecisionApprovedForSessionValue:
            type: object
            required: [type, scope, durationMinutes]
            additionalProperties: false
            properties:
                type:
                    const: ApprovedForSession
                scope:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValueScope"
                durationMinutes:
                    oneOf:
                        - type: integer
                          minimum: 1
                        # NOTE(ifitzsimmons) `null` means that the approval is applied for the duration
                        # of the session.
                        - type: "null"

        MessageExperimentalApprovalDecisionApprovedForSessionValue_Response:
            type: object
            required: [type, decider, scope, durationMinutes]
            additionalProperties: false
            properties:
                type:
                    const: ApprovedForSession
                decider:
                    $ref: "#/components/schemas/Actor"
                scope:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValueScope"
                durationMinutes:
                    oneOf:
                        - type: integer
                          minimum: 1
                        # NOTE(ifitzsimmons) `null` means that the approval is applied for the duration
                        # of the session.
                        - type: "null"

        MessageExperimentalApprovalDecisionApprovedForSessionValueScope:
            type: object
            required: [value]
            additionalProperties: false
            properties:
                value:
                    description: >
                        Groups equivalent approval options so that one selected approval can approve
                        the same pending scope elsewhere in the same message. For example, let's say
                        an agent is asking for approval to make 3 tool calls: `Write` to Document,
                        `WebFetch` to Website, and `Write` to Task, and each approval has an
                        `ApprovedForSession` option with summary `Approve all writes` and `Approve
                        all web fetches`respectively. If the user selects `Approve all writes` on
                        the document approval, the `Write` task approval should also be approved.
                        Agents can also use this key to decide its own tool permissions. This will
                        only work if the rest of the approval option is the same (e.g.
                        `durationInMinutes` is the same value for the other options with the same
                        `scope` key).
                    type: string

        MessageStreamContentPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamReasoningPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Reasoning
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamToolCallPartPayload:
            type: object
            required: [type, call]
            additionalProperties: false
            properties:
                type:
                    const: ToolCall
                call:
                    $ref: "#/components/schemas/MessageStreamToolCallPartPayloadCall"

        # TODO(#public-api): We should consider removing this discriminator entirely and ask
        # the agent to generate the string that we show in the thinking summary. The only
        # disadvantage would be that we can't easily produce the icon associated with the tool
        # call. The reason for removing the discriminated union is that it exposes the way we
        # built *our* agents, but other agents may use totally different tool call types.
        MessageStreamToolCallPartPayloadCall:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadCreateCall"
            discriminator:
                propertyName: type
                mapping:
                    Read: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                    Search: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"
                    Create: "#/components/schemas/MessageStreamToolCallPartPayloadCreateCall"

        MessageStreamToolCallPartPayloadReadCall:
            type: object
            required: [type, target]
            additionalProperties: false
            properties:
                type:
                    const: Read
                target:
                    $ref: "#/components/schemas/MentionTarget"

        MessageStreamToolCallPartPayloadSearchCall:
            type: object
            required: [type, query]
            additionalProperties: false
            properties:
                type:
                    const: Search
                query:
                    type: string

        MessageStreamToolCallPartPayloadCreateCall:
            type: object
            required: [type, target]
            additionalProperties: false
            properties:
                type:
                    const: Create
                target:
                    $ref: "#/components/schemas/MessageStreamToolCallPartCreateCallTarget"

        MessageStreamToolCallPartCreateCallTarget:
            oneOf:
                - $ref: "#/components/schemas/DocumentMentionTarget"
                - $ref: "#/components/schemas/PostMentionTarget"
                - $ref: "#/components/schemas/TaskMentionTarget"
                - $ref: "#/components/schemas/TaskCollectionMentionTarget"
            discriminator:
                propertyName: type
                mapping:
                    Document: "#/components/schemas/DocumentMentionTarget"
                    Post: "#/components/schemas/PostMentionTarget"
                    Task: "#/components/schemas/TaskMentionTarget"
                    TaskCollection: "#/components/schemas/TaskCollectionMentionTarget"

        # =========================================================================== #
        #                                  Webhooks                                   #
        # =========================================================================== #

        BotWebhookEvent:
            oneOf:
                - $ref: "#/components/schemas/BotWebhookNewMessageEvent"
                - $ref: "#/components/schemas/BotWebhookNewPostEvent"
                - $ref: "#/components/schemas/BotWebhookUpdatedMessageStreamExperimentalApprovalsPartEvent"
            discriminator:
                propertyName: type
                mapping:
                    NewMessage: "#/components/schemas/BotWebhookNewMessageEvent"
                    NewPost: "#/components/schemas/BotWebhookNewPostEvent"
                    UpdatedMessageStreamExperimentalApprovalsPart: "#/components/schemas/BotWebhookUpdatedMessageStreamExperimentalApprovalsPartEvent"

        BotWebhookUpdatedMessageStreamExperimentalApprovalsPartEvent:
            type: object
            required: [type, room, messageIndex, approvals]
            additionalProperties: false
            properties:
                type:
                    const: UpdatedMessageStreamExperimentalApprovalsPart
                room:
                    $ref: "#/components/schemas/MessageRoomTarget"
                messageIndex:
                    type: integer
                    minimum: 0

                # NOTE(ifitzsimmons, 2026-06-29): We need a mechanism to send approvals in bulk
                # to bots, and we should send the entire `decision` object instead of only the
                # values. Here's an example that explains the reasoning:
                #
                # - The agent requests to make 3 Updates and one Create.
                # - For each approval, the agent includes an option to approve all Update/Create
                #   requests for the session.
                # - The human in the loop selects "Accept all Updates for this session" on the first
                #   approval.
                #
                # Internally, we consider all 3 Update requests approved, but the user has not yet
                # taken an action on the Create request. We need to let the agent know that those
                # 3 Update requests were approved so that it can continue marching along, but it
                # shouldn't process the Create request until the user responds to it.
                #
                # This means that the agent may see the same values more than once, and will be
                # expected to no-op on them. In the above example, when the user approves/rejects
                # the Create request, the agent will see the new decision value for the Create and
                # the old decision value for the 3 Updates.
                #
                # In practice, this doesn't matter much right now. The plan is to require humans
                # to respond to all approvals before the agent can continue.
                #
                # We don't just re-use the message stream approval part because it contains the
                # summary content, which is a waste of bandwidth.
                approvals:
                    type: array
                    items:
                        type: object
                        required: [decision]
                        additionalProperties: false
                        properties:
                            decision:
                                type: object
                                required: []
                                additionalProperties: false
                                properties:
                                    value:
                                        $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue_Response"

        BotWebhookNewMessageEvent:
            type: object
            required: [type, room, index, authorId, createdTimeZone]
            additionalProperties: false
            properties:
                type:
                    const: NewMessage
                room:
                    $ref: "#/components/schemas/MessageRoomTarget"
                index:
                    type: integer
                    minimum: 0
                authorId:
                    $ref: "#/components/schemas/AccountId"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                wasMentioned:
                    type: boolean
                viewingTarget:
                    $ref: "#/components/schemas/MentionTarget"
                parent:
                    $ref: "#/components/schemas/BotWebhookNewMessageEventParent"

        BotWebhookNewMessageEventParent:
            oneOf:
                - $ref: "#/components/schemas/BotWebhookNewMessageEventMessageParent"
                - $ref: "#/components/schemas/BotWebhookNewMessageEventPostParent"
            discriminator:
                propertyName: type
                mapping:
                    Message: "#/components/schemas/BotWebhookNewMessageEventMessageParent"
                    Post: "#/components/schemas/BotWebhookNewMessageEventPostParent"

        BotWebhookNewMessageEventMessageParent:
            type: object
            required: [type, index, author]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                author:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"

        BotWebhookNewMessageEventPostParent:
            type: object
            required: [type, author]
            additionalProperties: false
            properties:
                type:
                    const: Post
                author:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"

        BotWebhookNewPostEvent:
            type: object
            required: [type, postId, authorId, createdTimeZone]
            additionalProperties: false
            properties:
                type:
                    const: NewPost
                postId:
                    $ref: "#/components/schemas/PostId"
                authorId:
                    $ref: "#/components/schemas/AccountId"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                wasMentioned:
                    type: boolean

        MessageContentPayloadParentContentSnippet:
            type: object
            required: [isTruncated, elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadParentContentSnippetTextInlineElement"
                isTruncated:
                    type: boolean

        MessageContentPayloadParentContentSnippetTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadParentContentSnippetInlineElementMark"

        MessageContentPayloadParentContentSnippetInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementCodeMark"
            discriminator:
                propertyName: type
                mapping:
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Code: "#/components/schemas/ContentInlineElementCodeMark"

        MessageRoomTarget:
            oneOf:
                - $ref: "#/components/schemas/ChatMessageRoom"
                - $ref: "#/components/schemas/DocumentCommentRoom"
                - $ref: "#/components/schemas/PostCommentRoom"
                - $ref: "#/components/schemas/TaskCommentRoom"
            discriminator:
                propertyName: type
                mapping:
                    Chat: "#/components/schemas/ChatMessageRoom"
                    DocumentCommentThread: "#/components/schemas/DocumentCommentRoom"
                    Post: "#/components/schemas/PostCommentRoom"
                    Task: "#/components/schemas/TaskCommentRoom"

        ChatMessageRoom:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"

        DocumentCommentRoom:
            type: object
            required: [type, id, threadId]
            additionalProperties: false
            properties:
                type:
                    const: DocumentCommentThread
                id:
                    $ref: "#/components/schemas/DocumentId"
                threadId:
                    $ref: "#/components/schemas/DocumentThreadId"

        PostCommentRoom:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"

        TaskCommentRoom:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"

        # =========================================================================== #
        #                                  Search                                     #
        # =========================================================================== #

        # Search results have the following shared properties:
        #
        # - `type` (required)
        # - `title` (optional)
        # - `bodyMatch` (optional)
        SearchResult:
            oneOf:
                - $ref: "#/components/schemas/SearchAccountResult"
                - $ref: "#/components/schemas/SearchChannelResult"
                - $ref: "#/components/schemas/SearchChatResult"
                - $ref: "#/components/schemas/SearchChatMessageResult"
                - $ref: "#/components/schemas/SearchDocumentResult"
                - $ref: "#/components/schemas/SearchDocumentMessageResult"
                - $ref: "#/components/schemas/SearchPostResult"
                - $ref: "#/components/schemas/SearchPostMessageResult"
                - $ref: "#/components/schemas/SearchSiteResult"
                - $ref: "#/components/schemas/SearchTaskResult"
                - $ref: "#/components/schemas/SearchTaskMessageResult"
                - $ref: "#/components/schemas/SearchTaskCollectionResult"
            discriminator:
                propertyName: type
                mapping:
                    Account: "#/components/schemas/SearchAccountResult"
                    Channel: "#/components/schemas/SearchChannelResult"
                    Chat: "#/components/schemas/SearchChatResult"
                    ChatMessage: "#/components/schemas/SearchChatMessageResult"
                    Document: "#/components/schemas/SearchDocumentResult"
                    DocumentMessage: "#/components/schemas/SearchDocumentMessageResult"
                    Post: "#/components/schemas/SearchPostResult"
                    PostMessage: "#/components/schemas/SearchPostMessageResult"
                    Site: "#/components/schemas/SearchSiteResult"
                    Task: "#/components/schemas/SearchTaskResult"
                    TaskMessage: "#/components/schemas/SearchTaskMessageResult"
                    TaskCollection: "#/components/schemas/SearchTaskCollectionResult"

        SearchAccountResult:
            type: object
            required: [title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Account
                id:
                    $ref: "#/components/schemas/AccountId"

        SearchChannelResult:
            type: object
            required: [title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"

        SearchChatResult:
            type: object
            required: [title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"

        SearchChatMessageResult:
            type: object
            required: [title, bodyMatch, type, id, index, author]
            additionalProperties: false
            properties:
                title:
                    const: null
                bodyMatch:
                    $ref: "#/components/schemas/SearchResultBodyMatch"
                type:
                    const: ChatMessage
                id:
                    $ref: "#/components/schemas/ChatId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchDocumentResult:
            type: object
            required: [title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Document
                id:
                    $ref: "#/components/schemas/DocumentId"

        SearchDocumentMessageResult:
            type: object
            required: [title, bodyMatch, type, id, threadId, index, author]
            additionalProperties: false
            properties:
                title:
                    const: null
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: DocumentMessage
                id:
                    $ref: "#/components/schemas/DocumentId"
                threadId:
                    $ref: "#/components/schemas/DocumentThreadId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchPostResult:
            type: object
            required: [title, bodyMatch, type, id, author]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchPostMessageResult:
            type: object
            required: [title, bodyMatch, type, id, index, author]
            additionalProperties: false
            properties:
                title:
                    const: null
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: PostMessage
                id:
                    $ref: "#/components/schemas/PostId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchSiteResult:
            type: object
            required: [title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    const: null
                type:
                    const: Site
                id:
                    $ref: "#/components/schemas/SiteId"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskResult:
            type: object
            required: [title, bodyMatch, type, id, status]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskMessageResult:
            type: object
            required: [title, bodyMatch, type, id, index, author]
            additionalProperties: false
            properties:
                title:
                    const: null
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: TaskMessage
                id:
                    $ref: "#/components/schemas/TaskId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskCollectionResult:
            type: object
            required: [title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"

        SearchResultBodyMatch:
            type: array
            items:
                type: object
                required: [text]
                additionalProperties: false
                properties:
                    text:
                        type: string
                    isMatch:
                        const: true

        SearchResultParsedFilter:
            type: object
            required: [summary]
            additionalProperties: false
            properties:
                summary:
                    type: string

        # =========================================================================== #
        #                                  Common                                     #
        # =========================================================================== #

        Actor:
            type: object
            required: [account]
            additionalProperties: false
            properties:
                account:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/AccountId"

        Actor_Response:
            type: object
            required: [account]
            additionalProperties: false
            properties:
