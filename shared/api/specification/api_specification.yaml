                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                        id:
                            $ref: "#/components/schemas/BotId"

        ChannelReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"

        ChannelReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"
                title:
                    type: string
                deleted:
                    type: boolean
                private:
                    type: boolean

        ChatReference:
            type: object
            required: [type, id]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"

        ChatReference_Response:
            type: object
            required: [type, id, title]
            additionalProperties: false
            properties:
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"
                title:
                    type: string
