                    $ref: "#/components/schemas/TaskQueryTimeFilterOperation"

        TaskQueryAssignedTimeFilter:
            type: object
            required: [type, operation]
            additionalProperties: false
            properties:
                type:
                    const: AssignedTime
                operation:
                    $ref: "#/components/schemas/TaskQueryTimeFilterOperation"

        TaskQueryClosedTimeFilter:
            type: object
            required: [type, operation]
            additionalProperties: false
            properties:
                type:
                    const: ClosedTime
                operation:
                    $ref: "#/components/schemas/TaskQueryTimeFilterOperation"

        TaskQueryActivatedTimeFilter:
            type: object
            required: [type, operation]
            additionalProperties: false
            properties:
                type:
                    const: ActivatedTime
                operation:
                    $ref: "#/components/schemas/TaskQueryTimeFilterOperation"

        TaskQueryTimeFilterOperation:
            oneOf:
                - $ref: "#/components/schemas/TaskQueryTimeFilterLessThanOperation"
                - $ref: "#/components/schemas/TaskQueryTimeFilterGreaterThanOperation"
            discriminator:
                propertyName: type
                mapping:
                    LessThan: "#/components/schemas/TaskQueryTimeFilterLessThanOperation"
                    GreaterThan: "#/components/schemas/TaskQueryTimeFilterGreaterThanOperation"

        TaskQueryTimeFilterLessThanOperation:
            type: object
            required: [type, time]
            additionalProperties: false
            properties:
                type:
                    const: LessThan
                time:
                    $ref: "#/components/schemas/TaskQueryTimeFilterOperationTime"

        TaskQueryTimeFilterGreaterThanOperation:
            type: object
            required: [type, time]
            additionalProperties: false
            properties:
                type:
                    const: GreaterThan
                time:
                    $ref: "#/components/schemas/TaskQueryTimeFilterOperationTime"

        TaskQueryTimeFilterOperationTime:
            oneOf:
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationAbsoluteDateTime"
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationRelativeTodayTime"
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationRelativeAfterTodayTime"
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationRelativeBeforeTodayTime"
            discriminator:
                propertyName: type
                mapping:
                    AbsoluteDate: "#/components/schemas/TaskQueryTimeFilterOperationAbsoluteDateTime"
                    RelativeToday: "#/components/schemas/TaskQueryTimeFilterOperationRelativeTodayTime"
                    RelativeAfterToday: "#/components/schemas/TaskQueryTimeFilterOperationRelativeAfterTodayTime"
                    RelativeBeforeToday: "#/components/schemas/TaskQueryTimeFilterOperationRelativeBeforeTodayTime"

        TaskQueryTimeFilterOperationAbsoluteDateTime:
            type: object
            required: [type, date]
            additionalProperties: false
            properties:
                type:
                    const: AbsoluteDate
                date:
                    oneOf:
                        - type: string
                          format: date
                        - type: "null"

        TaskQueryTimeFilterOperationRelativeTodayTime:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: RelativeToday

        TaskQueryTimeFilterOperationRelativeAfterTodayTime:
            type: object
            required: [type, duration]
            additionalProperties: false
            properties:
                type:
                    const: RelativeAfterToday
                duration:
                    $ref: "#/components/schemas/TaskQueryTimeFilterOperationDuration"

        TaskQueryTimeFilterOperationRelativeBeforeTodayTime:
            type: object
            required: [type, duration]
            additionalProperties: false
            properties:
                type:
                    const: RelativeBeforeToday
                duration:
                    $ref: "#/components/schemas/TaskQueryTimeFilterOperationDuration"

        TaskQueryTimeFilterOperationDuration:
            oneOf:
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationDaysDuration"
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationWeeksDuration"
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationMonthsDuration"
                - $ref: "#/components/schemas/TaskQueryTimeFilterOperationYearsDuration"
            discriminator:
                propertyName: type
                mapping:
                    Days: "#/components/schemas/TaskQueryTimeFilterOperationDaysDuration"
                    Weeks: "#/components/schemas/TaskQueryTimeFilterOperationWeeksDuration"
                    Months: "#/components/schemas/TaskQueryTimeFilterOperationMonthsDuration"
                    Years: "#/components/schemas/TaskQueryTimeFilterOperationYearsDuration"

        TaskQueryTimeFilterOperationDaysDuration:
            type: object
            required: [type, days]
            additionalProperties: false
            properties:
                type:
                    const: Days
                days:
                    type: integer

        TaskQueryTimeFilterOperationWeeksDuration:
            type: object
            required: [type, weeks]
            additionalProperties: false
            properties:
                type:
                    const: Weeks
                weeks:
                    type: integer

        TaskQueryTimeFilterOperationMonthsDuration:
            type: object
            required: [type, months]
            additionalProperties: false
            properties:
                type:
                    const: Months
                months:
                    type: integer

        TaskQueryTimeFilterOperationYearsDuration:
            type: object
            required: [type, years]
            additionalProperties: false
            properties:
                type:
                    const: Years
                years:
                    type: integer

        TaskQuerySort:
            oneOf:
                - $ref: "#/components/schemas/TaskQueryStatusSort"
                - $ref: "#/components/schemas/TaskQueryPrioritySort"
                - $ref: "#/components/schemas/TaskQueryLayoutSort"
                - $ref: "#/components/schemas/TaskQueryAssigneeSort"
                - $ref: "#/components/schemas/TaskQueryCreatorSort"
                - $ref: "#/components/schemas/TaskQueryAssignerSort"
                - $ref: "#/components/schemas/TaskQueryDueSort"
                - $ref: "#/components/schemas/TaskQueryCreatedTimeSort"
                - $ref: "#/components/schemas/TaskQueryAssignedTimeSort"
                - $ref: "#/components/schemas/TaskQueryClosedTimeSort"
                - $ref: "#/components/schemas/TaskQueryActivatedTimeSort"
            discriminator:
                propertyName: type
                mapping:
                    Status: "#/components/schemas/TaskQueryStatusSort"
                    Priority: "#/components/schemas/TaskQueryPrioritySort"
                    Layout: "#/components/schemas/TaskQueryLayoutSort"
                    Assignee: "#/components/schemas/TaskQueryAssigneeSort"
                    Creator: "#/components/schemas/TaskQueryCreatorSort"
                    Assigner: "#/components/schemas/TaskQueryAssignerSort"
                    Due: "#/components/schemas/TaskQueryDueSort"
                    CreatedTime: "#/components/schemas/TaskQueryCreatedTimeSort"
                    AssignedTime: "#/components/schemas/TaskQueryAssignedTimeSort"
                    ClosedTime: "#/components/schemas/TaskQueryClosedTimeSort"
                    ActivatedTime: "#/components/schemas/TaskQueryActivatedTimeSort"

        TaskQuerySortDirection:
            type: string
            enum: [Ascending, Descending]

        TaskQuerySortMissing:
            type: string
            enum: [First, Last]

        TaskQueryStatusSort:
            type: object
            required: [type, direction]
            additionalProperties: false
            properties:
                type:
                    const: Status
                direction:
                    $ref: "#/components/schemas/TaskQuerySortDirection"

        TaskQueryPrioritySort:
            type: object
            required: [type, direction]
            additionalProperties: false
            properties:
                type:
                    const: Priority
                direction:
                    $ref: "#/components/schemas/TaskQuerySortDirection"

        TaskQueryLayoutSort:
            type: object
            required: [type, missing]
            additionalProperties: false
            properties:
                type:
                    const: Layout
                missing:
                    $ref: "#/components/schemas/TaskQuerySortMissing"

        TaskQueryAssigneeSort:
            type: object
            required: [type, missing]
            additionalProperties: false
            properties:
                type:
                    const: Assignee
                missing:
                    $ref: "#/components/schemas/TaskQuerySortMissing"

        TaskQueryCreatorSort:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Creator

        TaskQueryAssignerSort:
            type: object
            required: [type, missing]
            additionalProperties: false
            properties:
                type:
                    const: Assigner
                missing:
                    $ref: "#/components/schemas/TaskQuerySortMissing"

        TaskQueryDueSort:
            type: object
            required: [type, direction]
            additionalProperties: false
            properties:
                type:
                    const: Due
                direction:
                    $ref: "#/components/schemas/TaskQuerySortDirection"

        TaskQueryCreatedTimeSort:
            type: object
            required: [type, direction]
            additionalProperties: false
            properties:
                type:
                    const: CreatedTime
                direction:
                    $ref: "#/components/schemas/TaskQuerySortDirection"

        TaskQueryAssignedTimeSort:
            type: object
            required: [type, direction]
            additionalProperties: false
            properties:
                type:
                    const: AssignedTime
                direction:
                    $ref: "#/components/schemas/TaskQuerySortDirection"

        TaskQueryClosedTimeSort:
            type: object
            required: [type, direction]
            additionalProperties: false
            properties:
                type:
                    const: ClosedTime
                direction:
                    $ref: "#/components/schemas/TaskQuerySortDirection"

        TaskQueryActivatedTimeSort:
            type: object
            required: [type, direction]
            additionalProperties: false
            properties:
                type:
                    const: ActivatedTime
                direction:
                    $ref: "#/components/schemas/TaskQuerySortDirection"

        # =========================================================================== #
        #                                  Messages                                   #
        # =========================================================================== #

        Message:
            type: object
            required: [index, author, createdTime, createdTimeZone, payload]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                payload:
                    $ref: "#/components/schemas/MessagePayload"

        MessagePayload:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayload"
                - $ref: "#/components/schemas/MessageDeletedPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageContentPayload"
                    Deleted: "#/components/schemas/MessageDeletedPayload"

        MessageContentPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                parent:
                    $ref: "#/components/schemas/MessageContentPayloadParent"
                content:
                    $ref: "#/components/schemas/Content"
                files:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadFile"

        MessageContentPayload_Response:
            type: object
            required: [type, content, files]
            additionalProperties: false
            properties:
                type:
                    const: Content
                parent:
                    $ref: "#/components/schemas/MessageContentPayloadParent"
                content:
                    $ref: "#/components/schemas/Content"
                files:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageContentPayloadFile"

        MessageContentPayloadFile:
            type: object
            required: [element]
            additionalProperties: false
            properties:
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement"
                            Preview: "#/components/schemas/ContentPreviewBlockElement"

        MessageContentPayloadFile_Response:
            type: object
            required: [rowIndex, width, element]
            additionalProperties: false
            properties:
                rowIndex:
                    type: integer
                    minimum: 0
                width:
                    type: number
                    minimum: 0
                    maximum: 1
                element:
                    oneOf:
                        - $ref: "#/components/schemas/ContentFileBlockElement_Response_WithoutKeys"
                        - $ref: "#/components/schemas/ContentPreviewBlockElement_Response_WithoutKeys"
                    discriminator:
                        propertyName: type
                        mapping:
                            File: "#/components/schemas/ContentFileBlockElement_Response_WithoutKeys"
                            Preview: "#/components/schemas/ContentPreviewBlockElement_Response_WithoutKeys"

        MessageContentPayloadParent:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayloadMessageParent"
                - $ref: "#/components/schemas/MessageContentPayloadPostParent"
            discriminator:
                propertyName: type
                mapping:
                    Message: "#/components/schemas/MessageContentPayloadMessageParent"
                    Post: "#/components/schemas/MessageContentPayloadPostParent"

        MessageContentPayloadMessageParent:
            type: object
            required: [type, index]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                    minimum: 0

        MessageContentPayloadMessageParent_Response:
            type: object
            required: [type, index, author, contentSnippet]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                    minimum: 0
                # NOTE(ifitzsimmons, #api): Alpine users can reply to a selection of content that
                # that can span across more than 1 message (we refer to this as a "range"). If the
                # parent is a "range", the `index` is the start index of the range the `endIndex`
                # will be a positive integer (instead of undefined).
                endIndex:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                contentSnippet:
                    $ref: "#/components/schemas/MessageContentPayloadParentContentSnippet"

        MessageContentPayloadPostParent:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Post

        # TODO(ifitzsimmons, #public-api): We don't actually return the range information for
        # now. In order for a client to use the actual range, we need to return the start
        # and end index *along with the content version*. Eventually, we should encode these
        # into `postSelectionId` – but I don't think we should expose the range in the meantime.
        # In terms of our agents, we can use the `isTruncated` property to determine whether we
        # need to fetch the whole post. The full message and the truncated message should give
        # the agent enough context to reply to the request.
        MessageContentPayloadPostParent_Response:
            type: object
            required: [type, author, contentSnippet]
            additionalProperties: false
            properties:
                type:
                    const: Post
                author:
                    $ref: "#/components/schemas/Account"
                contentSnippet:
                    $ref: "#/components/schemas/MessageContentPayloadParentContentSnippet"

        MessageDeletedPayload:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Deleted

        MessageStreamPart:
            type: object
            required: [index, createdTime, version, payload]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                createdTime:
                    type: string
                    format: date-time
                version:
                    type: integer
                    minimum: 0
                payload:
                    $ref: "#/components/schemas/MessageStreamPartPayload"

        MessageStreamPartPayload:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamContentPartPayload"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayload"
                - $ref: "#/components/schemas/MessageStreamReasoningPartPayload"
                - $ref: "#/components/schemas/MessageStreamExperimentalApprovalsPartPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageStreamContentPartPayload"
                    ToolCall: "#/components/schemas/MessageStreamToolCallPartPayload"
                    Reasoning: "#/components/schemas/MessageStreamReasoningPartPayload"
                    ExperimentalApprovals: "#/components/schemas/MessageStreamExperimentalApprovalsPartPayload"

        MessageStreamExperimentalApprovalsPartPayload:
            type: object
            required: [type, approvals]
            additionalProperties: false
            properties:
                type:
                    const: ExperimentalApprovals
                approvals:
                    type: array
                    items:
                        $ref: "#/components/schemas/MessageExperimentalApproval"

        MessageExperimentalApproval:
            type: object
            required: [summary, decision]
            additionalProperties: false
            properties:
                summary:
                    $ref: "#/components/schemas/LabelContent"
                decision:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecision"

        MessageExperimentalApprovalDecision:
            type: object
            required: [schema]
            additionalProperties: false
            properties:
                schema:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionSchema"
                value:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue"

        MessageExperimentalApprovalDecisionSchema:
            type: object
            required: [options]
            additionalProperties: false
            properties:
                options:
                    type: array
                    # NOTE(ifitzsimmons, 2026-06-30): Clients must include at least one option,
                    # otherwise the approval is not actionable. Ideally, clients would always
                    # include an `Approved` and `Rejected` option, but we don't require it.
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/MessageExperimentalApprovalDecisionOption"

        MessageExperimentalApprovalDecisionOption:
            oneOf:
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedOption"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedOption"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionOption"
            discriminator:
                propertyName: type
                mapping:
                    Approved: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedOption"
                    Rejected: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedOption"
                    ApprovedForSession: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionOption"

        MessageExperimentalApprovalDecisionApprovedOption:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Approved

        MessageExperimentalApprovalDecisionRejectedOption:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Rejected

        MessageExperimentalApprovalDecisionApprovedForSessionOption:
            type: object
            required: [type, scope, durationMinutes]
            additionalProperties: false
            properties:
                type:
                    const: ApprovedForSession
                scope:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValueScope"
                summary:
                    $ref: "#/components/schemas/LabelContent"
                durationMinutes:
                    oneOf:
                        - type: integer
                          minimum: 1
                        # NOTE(ifitzsimmons) `null` means that the approval is applied for the duration
                        # of the session.
                        - type: "null"

        MessageExperimentalApprovalDecisionValue:
            oneOf:
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedValue"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedValue"
                - $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValue"
            discriminator:
                propertyName: type
                mapping:
                    Approved: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedValue"
                    Rejected: "#/components/schemas/MessageExperimentalApprovalDecisionRejectedValue"
                    ApprovedForSession: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValue"

        MessageExperimentalApprovalDecisionApprovedValue:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Approved

        MessageExperimentalApprovalDecisionApprovedValue_Response:
            type: object
            required: [type, decider]
            additionalProperties: false
            properties:
                type:
                    const: Approved
                decider:
                    $ref: "#/components/schemas/Actor"

        MessageExperimentalApprovalDecisionRejectedValue:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Rejected

        MessageExperimentalApprovalDecisionRejectedValue_Response:
            type: object
            required: [type, decider]
            additionalProperties: false
            properties:
                type:
                    const: Rejected
                decider:
                    $ref: "#/components/schemas/Actor"

        MessageExperimentalApprovalDecisionApprovedForSessionValue:
            type: object
            required: [type, scope, durationMinutes]
            additionalProperties: false
            properties:
                type:
                    const: ApprovedForSession
                scope:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValueScope"
                durationMinutes:
                    oneOf:
                        - type: integer
                          minimum: 1
                        # NOTE(ifitzsimmons) `null` means that the approval is applied for the duration
                        # of the session.
                        - type: "null"

        MessageExperimentalApprovalDecisionApprovedForSessionValue_Response:
            type: object
            required: [type, decider, scope, durationMinutes]
            additionalProperties: false
            properties:
                type:
                    const: ApprovedForSession
                decider:
                    $ref: "#/components/schemas/Actor"
                scope:
                    $ref: "#/components/schemas/MessageExperimentalApprovalDecisionApprovedForSessionValueScope"
                durationMinutes:
                    oneOf:
                        - type: integer
                          minimum: 1
                        # NOTE(ifitzsimmons) `null` means that the approval is applied for the duration
                        # of the session.
                        - type: "null"

        MessageExperimentalApprovalDecisionApprovedForSessionValueScope:
            type: object
            required: [value]
            additionalProperties: false
            properties:
                value:
                    description: >
                        Groups equivalent approval options so that one selected approval can approve
                        the same pending scope elsewhere in the same message. For example, let's say
                        an agent is asking for approval to make 3 tool calls: `Write` to Document,
                        `WebFetch` to Website, and `Write` to Task, and each approval has an
                        `ApprovedForSession` option with summary `Approve all writes` and `Approve
                        all web fetches`respectively. If the user selects `Approve all writes` on
                        the document approval, the `Write` task approval should also be approved.
                        Agents can also use this key to decide its own tool permissions. This will
                        only work if the rest of the approval option is the same (e.g.
                        `durationInMinutes` is the same value for the other options with the same
                        `scope` key).
                    type: string

        MessageStreamContentPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamReasoningPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Reasoning
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamToolCallPartPayload:
            type: object
            required: [type, call]
            additionalProperties: false
            properties:
                type:
                    const: ToolCall
                call:
                    $ref: "#/components/schemas/MessageStreamToolCallPartPayloadCall"

        # TODO(#public-api): We should consider removing this discriminator entirely and ask
        # the agent to generate the string that we show in the thinking summary. The only
        # disadvantage would be that we can't easily produce the icon associated with the tool
        # call. The reason for removing the discriminated union is that it exposes the way we
        # built *our* agents, but other agents may use totally different tool call types.
        MessageStreamToolCallPartPayloadCall:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadCreateCall"
            discriminator:
                propertyName: type
                mapping:
                    Read: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                    Search: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"
                    Create: "#/components/schemas/MessageStreamToolCallPartPayloadCreateCall"

        MessageStreamToolCallPartPayloadReadCall:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Read
                reference:
                    $ref: "#/components/schemas/MentionReference"

        MessageStreamToolCallPartPayloadSearchCall:
            type: object
            required: [type, query]
            additionalProperties: false
            properties:
                type:
                    const: Search
                query:
                    type: string

        MessageStreamToolCallPartPayloadCreateCall:
            type: object
            required: [type, reference]
            additionalProperties: false
            properties:
                type:
                    const: Create
                reference:
                    $ref: "#/components/schemas/MessageStreamToolCallPartCreateCallReference"

        MessageStreamToolCallPartCreateCallReference:
            oneOf:
                - $ref: "#/components/schemas/DocumentReference"
                - $ref: "#/components/schemas/PostReference"
                - $ref: "#/components/schemas/TaskReference"
                - $ref: "#/components/schemas/TaskCollectionReference"
            discriminator:
                propertyName: type
                mapping:
                    Document: "#/components/schemas/DocumentReference"
                    Post: "#/components/schemas/PostReference"
                    Task: "#/components/schemas/TaskReference"
                    TaskCollection: "#/components/schemas/TaskCollectionReference"

        # =========================================================================== #
        #                                  Webhooks                                   #
        # =========================================================================== #

        BotWebhookEvent:
            oneOf:
                - $ref: "#/components/schemas/BotWebhookCreatedMessageEvent"
                - $ref: "#/components/schemas/BotWebhookCreatedPostEvent"
                - $ref: "#/components/schemas/BotWebhookUpdatedMessageStreamExperimentalApprovalsPartEvent"
            discriminator:
                propertyName: type
                mapping:
                    CreatedMessage: "#/components/schemas/BotWebhookCreatedMessageEvent"
                    CreatedPost: "#/components/schemas/BotWebhookCreatedPostEvent"
