        BotWebhookUpdatedMessageStreamExperimentalApprovalsPartEvent:
            type: object
            required: [type, room, messageIndex, approvals]
            additionalProperties: false
            properties:
                type:
                    const: UpdatedMessageStreamExperimentalApprovalsPart
                room:
                    $ref: "#/components/schemas/MessageRoomReference"
                messageIndex:
                    type: integer
                    minimum: 0

                # NOTE(ifitzsimmons, 2026-06-29): We need a mechanism to send approvals in bulk
                # to bots, and we should send the entire `decision` object instead of only the
                # values. Here's an example that explains the reasoning:
                #
                # - The agent requests to make 3 Updates and one Create.
                # - For each approval, the agent includes an option to approve all Update/Create
                #   requests for the session.
                # - The human in the loop selects "Accept all Updates for this session" on the first
                #   approval.
                #
                # Internally, we consider all 3 Update requests approved, but the user has not yet
                # taken an action on the Create request. We need to let the agent know that those
                # 3 Update requests were approved so that it can continue marching along, but it
                # shouldn't process the Create request until the user responds to it.
                #
                # This means that the agent may see the same values more than once, and will be
                # expected to no-op on them. In the above example, when the user approves/rejects
                # the Create request, the agent will see the new decision value for the Create and
                # the old decision value for the 3 Updates.
                #
                # In practice, this doesn't matter much right now. The plan is to require humans
                # to respond to all approvals before the agent can continue.
                #
                # We don't just re-use the message stream approval part because it contains the
                # summary content, which is a waste of bandwidth.
                approvals:
                    type: array
                    items:
                        type: object
                        required: [decision]
                        additionalProperties: false
                        properties:
                            decision:
                                type: object
                                required: []
                                additionalProperties: false
                                properties:
                                    value:
                                        $ref: "#/components/schemas/MessageExperimentalApprovalDecisionValue_Response"

