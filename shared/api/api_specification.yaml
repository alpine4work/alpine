# This is the source OpenAPI specification for the Alpine REST API. We run a
# couple transformations before we get to the OpenAPI specification we'll share
# with users.
#
# - All comments are stripped from the final specification.
#
# - There are some template variables you can use that'll be replaced (for
#   example `idRegExp` in Mustache curly brackets).
#
# - Schema names that end with an underscore (e.g. `_Response`) are
#   "specializations" of the base type (e.g.
#   `ContentMentionInlineElement_Response` is a specialization of
#   `ContentMentionInlineElement`).
#
#   Specializations create entirely new type hierarchies that use the
#   specialized type instead of the base type. For example, we generate
#   `ContentInlineElement_Response` that references
#   `ContentMentionInlineElement_Response` instead of
#   `ContentMentionInlineElement`.
#
#   We also update any schema references used in request bodies or responses
#   to use the `_Request` or `_Response` specialization respectively if such a
#   specialization is available.

openapi: 3.0.0
info:
    title: Alpine API
    description: The Alpine REST API.
    version: 1.0.0

servers:
    - url: https://api.alpine.inc

paths:
    # TODO(calebmer, #public-api): Document that if you have a bot and the bot is
    # trying to read an account that was a former member of the space you'll get
    # the account's old data at removal time instead of the latest data.
    /accounts/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/AccountId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [account]
                                additionalProperties: false
                                properties:
                                    account:
                                        $ref: "#/components/schemas/AccountWithoutSpace"

    /spaces/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [space]
                                additionalProperties: false
                                properties:
                                    space:
                                        $ref: "#/components/schemas/Space"

    /spaces/{id}/accounts/{accountId}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
            - name: accountId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/AccountId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [account]
                                additionalProperties: false
                                properties:
                                    account:
                                        $ref: "#/components/schemas/Account"

    /chats/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, chat]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    chat:
                                        $ref: "#/components/schemas/Chat"

    # TODO(calebmer, #public-api): Add a `-markdown` variant endpoint for all
    # endpoints that deal with content. This variant should return a string for
    # content instead of an AST. Also add a `-markdown` variant for any `/messages`
    # endpoints (both `GET` and `POST`).
    /chats/{id}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /chats/{id}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: integer
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [start, end]
                      default: start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /chats/{id}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /chats/{id}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /chats/{id}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChatId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /documents/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, document]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    document:
                                        $ref: "#/components/schemas/Document"

    /documents/{id}/threads/{threadId}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, commentThread]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    commentThread:
                                        $ref: "#/components/schemas/DocumentCommentThread"

    /documents/{id}/threads/{threadId}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /documents/{id}/threads/{threadId}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                # TODO(calebmer, #public-api): Bikeshed this naming. I like it because we can
                # consistently communicate the same pagination concept across all paginated API
                # endpoints. But `index` here could be clearer for messages.
                - name: cursor
                  in: query
                  schema:
                      type: integer
                # TODO(calebmer, #public-api): Bikeshed this name when we ship the public API.
                # Ian's proposal is `order=ascending`/`order=descending`. Which matches SQL
                # language, could feel more natural.
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [start, end]
                      default: start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /documents/{id}/threads/{threadId}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /documents/{id}/threads/{threadId}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /documents/{id}/threads/{threadId}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentId"}
            - name: threadId
              in: path
              required: true
              schema: {$ref: "#/components/schemas/DocumentThreadId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /channels/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/ChannelId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, channel]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    channel:
                                        $ref: "#/components/schemas/Channel"

    /posts:
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            # TODO(ifitzsimmons, #ai): Eventually, we'll allow posts to be created
                            # without a channel. That's the reason this endpoint isn't formatted
                            # like `/channels/{id}/posts`. However, since we can't support post
                            # creation outside of channels right now, users are required to provide
                            # a channelId in the request. Going from required to optional will be
                            # a backwards compatible change when the time comes.
                            required: [channelId, content]
                            additionalProperties: false
                            properties:
                                channelId:
                                    $ref: "#/components/schemas/ChannelId"
                                createdTimeZone:
                                    $ref: "#/components/schemas/TimeZone"
                                content:
                                    $ref: "#/components/schemas/Content"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetPost"}

    /posts/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetPost"}

    /posts/{id}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /posts/{id}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: integer
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [start, end]
                      default: start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /posts/{id}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /posts/{id}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /posts/{id}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/PostId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    # TODO(ifitzsimmons, #ai): Change this interface so that it returns a parsed string
    # representation of the search filters and an indication of whether a particular
    # result matched the search filter or not.
    /spaces/{id}/search:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/SpaceId"}
        get:
            parameters:
                - name: query
                  in: query
                  required: true
                  schema:
                      type: string
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [results]
                                additionalProperties: false
                                properties:
                                    results:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/SearchResult"

    /tasks/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, task]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    task:
                                        $ref: "#/components/schemas/Task"

    /tasks/{id}/messages/{index}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /tasks/{id}/messages:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: integer
                - name: from
                  in: query
                  schema:
                      type: string
                      enum: [start, end]
                      default: start
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessages"}
        post:
            requestBody: {$ref: "#/components/requestBodies/CreateMessage"}
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessage"}

    /tasks/{id}/messages/{index}/stream/completion:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamCompletion"}

    /tasks/{id}/messages/{index}/stream/ping:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPing"}

    /tasks/{id}/messages/{index}/stream/parts/{partIndex}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskId"}
            - name: index
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
            - name: partIndex
              in: path
              required: true
              schema:
                  type: integer
                  minimum: 0
        put:
            requestBody:
                $ref: "#/components/requestBodies/PutMessageStreamPart"
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200": {$ref: "#/components/responses/GetMessageStreamPart"}

    /task-collections/{id}:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}
        get:
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, taskCollection]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    taskCollection:
                                        $ref: "#/components/schemas/TaskCollection"

    /task-collections/{id}/tasks:
        parameters:
            - name: id
              in: path
              required: true
              schema: {$ref: "#/components/schemas/TaskCollectionId"}

        get:
            parameters:
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: cursor
                  in: query
                  schema:
                      type: string
                - name: status
                  in: query
                  schema:
                      type: array
                      items:
                          type: string
                          enum: [Open, Closed]
                      maxItems: 2
            responses:
                default: {$ref: "#/components/responses/Error"}
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [spaceId, tasks, nextCursor]
                                additionalProperties: false
                                properties:
                                    spaceId:
                                        $ref: "#/components/schemas/SpaceId"
                                    nextCursor:
                                        type: [string, "null"]
                                    tasks:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/TaskWithoutContent"

webhooks:
    bot:
        post:
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [spaceId, accountId, attempt, accessToken, eventId, event]
                            additionalProperties: false
                            properties:
                                spaceId:
                                    $ref: "#/components/schemas/SpaceId"
                                accountId:
                                    $ref: "#/components/schemas/AccountId"
                                attempt:
                                    type: integer
                                    minimum: 1
                                accessToken:
                                    type: string
                                eventId:
                                    $ref: "#/components/schemas/BotWebhookEventId"
                                event:
                                    $ref: "#/components/schemas/BotWebhookEvent"
            responses:
                "200":
                    description:
                        Return a 200 status to indicate that the data was received successfully

components:
    responses:
        Error:
            content:
                application/json:
                    schema:
                        type: object
                        required: [error]
                        additionalProperties: false
                        properties:
                            error:
                                type: object
                                required: [message, retry]
                                additionalProperties: false
                                properties:
                                    message:
                                        type: string
                                        description:
                                            A human-readable message providing more details about
                                            the error.
                                    retry:
                                        type: object
                                        required: [able]
                                        additionalProperties: false
                                        properties:
                                            able:
                                                type: boolean
                                                description:
                                                    If true, it indicates that the request should
                                                    succeed if tried again.

        GetMessage:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, message]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            message:
                                $ref: "#/components/schemas/Message"

        GetMessages:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, nextCursor, totalMessageCount, messages]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            totalMessageCount:
                                type: integer
                            # TODO(calebmer, #public-api): My dream is for the API browser to return this
                            # as a link. So you can conveniently paginate through the API in your browser
                            # by clicking `nextCursor`.
                            nextCursor:
                                type: [integer, "null"]
                                minimum: 0
                            messages:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Message"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/completion` endpoints but the
        # intention is to add that endpoint and for it to return the same type as the
        # `PUT` endpoint.
        GetMessageStreamCompletion:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, completion]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            completion:
                                type: object
                                required: [completedTime]
                                additionalProperties: false
                                properties:
                                    completedTime:
                                        $ref: "#/components/schemas/DateTime"

        # NOTE(ifitzsimmons, 2025-11-14): If a client tries pinging a stream after it's
        # been completed, we don't throw an error. Instead, we return the completed time
        # and the last stream ping time (without updating the last stream ping time).
        GetMessageStreamPing:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, ping]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            ping:
                                type: object
                                required: [lastUpdatedTime]
                                additionalProperties: false
                                properties:
                                    lastUpdatedTime:
                                        $ref: "#/components/schemas/DateTime"

        # TODO(calebmer, #public-api): We don't currently have
        # `GET /chats/{id}/messages/{index}/stream/parts/{partIndex}` endpoints but
        # the intention is to add that endpoint and for it to return the same type as
        # the `PUT` endpoint.
        GetMessageStreamPart:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"

        GetPost:
            content:
                application/json:
                    schema:
                        type: object
                        required: [spaceId, post]
                        additionalProperties: false
                        properties:
                            spaceId:
                                $ref: "#/components/schemas/SpaceId"
                            post:
                                $ref: "#/components/schemas/Post"

    requestBodies:
        CreateMessage:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [content]
                        additionalProperties: false
                        properties:
                            isStream:
                                type: boolean
                            createdTimeZone:
                                $ref: "#/components/schemas/TimeZone"
                            content:
                                $ref: "#/components/schemas/Content"

        PutMessageStreamPart:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [payload]
                        additionalProperties: false
                        properties:
                            payload:
                                $ref: "#/components/schemas/MessageStreamPartPayload"

    schemas:
        LabelString:
            type: string
            minLength: 1
            maxLength: {{defaultMaxLabelStringLength}}

        DateTime:
            type: string
            format: date-time

        TimeZone:
            type: string

        # =========================================================================== #
        #                                     IDs                                     #
        # =========================================================================== #
        #
        # Ordered alphabetically assuming `Id` isn't appended as a suffix. e.g.
        # `TaskId` comes before `TaskCollectionId` even though `C` comes before `I` in
        # the alphabet.

        AccountId:
            type: string
            pattern: ^{{idRegExp}}$

        BotId:
            type: string
            pattern: ^{{idRegExp}}$

        BotWebhookEventId:
            type: string
            pattern: ^{{idRegExp}}$

        ChannelId:
            type: string
            pattern: ^{{idRegExp}}$

        ChatId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentId:
            type: string
            pattern: ^{{idRegExp}}$

        DocumentThreadId:
            type: string
            pattern: ^{{idRegExp}}$

        PostId:
            type: string
            pattern: ^{{idRegExp}}$

        SpaceId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskId:
            type: string
            pattern: ^{{idRegExp}}$

        TaskCollectionId:
            type: string
            pattern: ^{{idRegExp}}$

        # =========================================================================== #
        #                                    Paths                                    #
        # =========================================================================== #
        #
        # Ordered alphabetically assuming `Path` isn't appended as a suffix. e.g.
        # `TaskPath` comes before `TaskCollectionPath` even though `C` comes before `P`
        # in the alphabet.
        #
        # Path unions (e.g. `MessageRoomPath`) are last.

        AccountPath:
            type: string
            pattern: ^/accounts/{{idRegExp}}$

        ChannelPath:
            type: string
            pattern: ^/channels/{{idRegExp}}$

        ChatPath:
            type: string
            pattern: ^/chats/{{idRegExp}}$

        ChatMessagePath:
            type: string
            pattern: ^/chats/{{idRegExp}}/messages/{{integerRegExp}}$

        ChatMessagesListPath:
            type: string
            pattern: ^/chats/{{idRegExp}}/messages$

        DocumentPath:
            type: string
            pattern: ^/documents/{{idRegExp}}$

        DocumentMessagePath:
            type: string
            pattern: ^/documents/{{idRegExp}}/threads/{{idRegExp}}/messages/{{integerRegExp}}$

        DocumentThreadPath:
            type: string
            pattern: ^/documents/{{idRegExp}}/threads/{{idRegExp}}$

        DocumentThreadMessagesListPath:
            type: string
            pattern: ^/documents/{{idRegExp}}/threads/{{idRegExp}}/messages$

        PostPath:
            type: string
            pattern: ^/posts/{{idRegExp}}$

        PostMessagePath:
            type: string
            pattern: ^/posts/{{idRegExp}}/messages/{{integerRegExp}}$

        PostMessagesListPath:
            type: string
            pattern: ^/posts/{{idRegExp}}/messages$

        TaskPath:
            type: string
            pattern: ^/tasks/{{idRegExp}}$

        TaskCollectionPath:
            type: string
            pattern: ^/task-collections/{{idRegExp}}$

        TaskMessagePath:
            type: string
            pattern: ^/tasks/{{idRegExp}}/messages/{{integerRegExp}}$

        TaskMessagesListPath:
            type: string
            pattern: ^/tasks/{{idRegExp}}/messages$

        MessageRoomPath:
            oneOf:
                - $ref: "#/components/schemas/ChatPath"
                - $ref: "#/components/schemas/DocumentThreadPath"
                - $ref: "#/components/schemas/PostPath"
                - $ref: "#/components/schemas/TaskPath"

        MessagesListPath:
            oneOf:
                - $ref: "#/components/schemas/ChatMessagesListPath"
                - $ref: "#/components/schemas/DocumentThreadMessagesListPath"
                - $ref: "#/components/schemas/PostMessagesListPath"
                - $ref: "#/components/schemas/TaskMessagesListPath"

        MentionPath:
            oneOf:
                - $ref: "#/components/schemas/AccountPath"
                - $ref: "#/components/schemas/ChannelPath"
                - $ref: "#/components/schemas/DocumentPath"
                - $ref: "#/components/schemas/PostPath"
                - $ref: "#/components/schemas/TaskPath"
                - $ref: "#/components/schemas/TaskCollectionPath"

        SearchResultPath:
            oneOf:
                - $ref: "#/components/schemas/AccountPath"
                - $ref: "#/components/schemas/ChannelPath"
                - $ref: "#/components/schemas/ChatPath"
                - $ref: "#/components/schemas/ChatMessagePath"
                - $ref: "#/components/schemas/DocumentPath"
                - $ref: "#/components/schemas/DocumentMessagePath"
                - $ref: "#/components/schemas/PostPath"
                - $ref: "#/components/schemas/PostMessagePath"
                - $ref: "#/components/schemas/TaskPath"
                - $ref: "#/components/schemas/TaskMessagePath"
                - $ref: "#/components/schemas/TaskCollectionPath"

        # =========================================================================== #
        #                               Mention targets                               #
        # =========================================================================== #

        AccountMentionTarget_Response:
            type: object
            required: [type, path, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/AccountPath"
                type:
                    const: Account
                id:
                    $ref: "#/components/schemas/AccountId"

        AccountMentionTarget:
            oneOf:
                - type: object
                  required: [path]
                  additionalProperties: false
                  properties:
                      path:
                          $ref: "#/components/schemas/AccountPath"
                - type: object
                  required: [type, id]
                  additionalProperties: {const: path}
                  properties:
                      type:
                          const: Account
                      id:
                          $ref: "#/components/schemas/AccountId"

        ChannelMentionTarget_Response:
            type: object
            required: [type, path, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/ChannelPath"
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"

        ChannelMentionTarget:
            oneOf:
                - type: object
                  required: [path]
                  additionalProperties: false
                  properties:
                      path:
                          $ref: "#/components/schemas/ChannelPath"
                - type: object
                  required: [type, id]
                  additionalProperties: {const: path}
                  properties:
                      type:
                          const: Channel
                      id:
                          $ref: "#/components/schemas/ChannelId"

        DocumentMentionTarget_Response:
            type: object
            required: [type, path, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/DocumentPath"
                type:
                    const: Document
                id:
                    $ref: "#/components/schemas/DocumentId"

        DocumentMentionTarget:
            oneOf:
                - type: object
                  required: [path]
                  additionalProperties: false
                  properties:
                      path:
                          $ref: "#/components/schemas/DocumentPath"
                - type: object
                  required: [type, id]
                  additionalProperties: {const: path}
                  properties:
                      type:
                          const: Document
                      id:
                          $ref: "#/components/schemas/DocumentId"

        PostMentionTarget_Response:
            type: object
            required: [type, path, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/PostPath"
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"

        PostMentionTarget:
            oneOf:
                - type: object
                  required: [path]
                  additionalProperties: false
                  properties:
                      path:
                          $ref: "#/components/schemas/PostPath"
                - type: object
                  required: [type, id]
                  additionalProperties: {const: path}
                  properties:
                      type:
                          const: Post
                      id:
                          $ref: "#/components/schemas/PostId"

        TaskMentionTarget_Response:
            type: object
            required: [type, path, id, status]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/TaskPath"
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"

        TaskMentionTarget:
            oneOf:
                - type: object
                  required: [path]
                  additionalProperties: false
                  properties:
                      path:
                          $ref: "#/components/schemas/TaskPath"
                - type: object
                  required: [type, id]
                  additionalProperties: {const: path}
                  properties:
                      type:
                          const: Task
                      id:
                          $ref: "#/components/schemas/TaskId"

        TaskCollectionMentionTarget_Response:
            type: object
            required: [type, path, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/TaskCollectionPath"
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"

        TaskCollectionMentionTarget:
            oneOf:
                - type: object
                  required: [path]
                  additionalProperties: false
                  properties:
                      path:
                          $ref: "#/components/schemas/TaskCollectionPath"
                - type: object
                  required: [type, id]
                  additionalProperties: {const: path}
                  properties:
                      type:
                          const: TaskCollection
                      id:
                          $ref: "#/components/schemas/TaskCollectionId"

        MentionTarget:
            oneOf:
                - $ref: "#/components/schemas/AccountMentionTarget"
                - $ref: "#/components/schemas/ChannelMentionTarget"
                - $ref: "#/components/schemas/DocumentMentionTarget"
                - $ref: "#/components/schemas/PostMentionTarget"
                - $ref: "#/components/schemas/TaskMentionTarget"
                - $ref: "#/components/schemas/TaskCollectionMentionTarget"

        # NOTE(calebmer): We define both `MentionTarget` and `MentionTarget_Response`
        # (instead of letting our build step generate `MentionTarget_Response`) because
        # the `discriminator` property doesn't work for `MentionTarget`.
        MentionTarget_Response:
            oneOf:
                - $ref: "#/components/schemas/AccountMentionTarget_Response"
                - $ref: "#/components/schemas/ChannelMentionTarget_Response"
                - $ref: "#/components/schemas/DocumentMentionTarget_Response"
                - $ref: "#/components/schemas/PostMentionTarget_Response"
                - $ref: "#/components/schemas/TaskMentionTarget_Response"
                - $ref: "#/components/schemas/TaskCollectionMentionTarget_Response"
            discriminator:
                propertyName: type
                mapping:
                    Account: "#/components/schemas/AccountMentionTarget_Response"
                    Channel: "#/components/schemas/ChannelMentionTarget_Response"
                    Document: "#/components/schemas/DocumentMentionTarget_Response"
                    Post: "#/components/schemas/PostMentionTarget_Response"
                    Task: "#/components/schemas/TaskMentionTarget_Response"
                    TaskCollection: "#/components/schemas/TaskCollectionMentionTarget_Response"

        # =========================================================================== #
        #                                   Content                                   #
        # =========================================================================== #

        Content:
            type: object
            additionalProperties: false
            required: [elements]
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentBlockElement"

        ContentBlockElement:
            # TODO(calebmer, #public-api): We need to be able to add items without breaking
            # backwards compatibility. When publishing the API, let's figure out what our
            # schema evolution policy is.
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentHeadingBlockElement"
                - $ref: "#/components/schemas/ContentDividerBlockElement"
                - $ref: "#/components/schemas/ContentTableBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Heading: "#/components/schemas/ContentHeadingBlockElement"
                    Divider: "#/components/schemas/ContentDividerBlockElement"
                    Table: "#/components/schemas/ContentTableBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"

        ContentParagraphBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Paragraph
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentListBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentUnorderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: UnorderedList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentOrderedListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: OrderedList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentListBlockElementItem"

        ContentCheckListBlockElement:
            type: object
            required: [type, items]
            additionalProperties: false
            properties:
                type:
                    const: CheckList
                items:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCheckListBlockElementItem"

        ContentListBlockElementItem:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                # TODO(calebmer, #public-api): If `elements` is an empty array then this is a
                # "phantom" list item. Phantom list items exist purely to increase the
                # indentation level of their children and aren't rendered as a list item
                # themselves. There's no bullet! An `elements` array with an empty paragraph
                # does render an item.
                #
                # We need to clearly document this behavior in our API documentation.
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentCheckListBlockElementItem:
            type: object
            required: [checked, elements]
            additionalProperties: false
            properties:
                checked:
                    type: boolean
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentParagraphBlockElement"
                nestedListElements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentListBlockElement"

        ContentQuoteBlockElement:
            type: object
            required: [type, elements]
            additionalProperties: false
            properties:
                type:
                    const: Quote
                elements:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentQuoteBlockElementBlockElement"

        ContentQuoteBlockElementBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"

        ContentHeadingBlockElement:
            type: object
            required: [type, level, elements]
            additionalProperties: false
            properties:
                type:
                    const: Heading
                level:
                    type: integer
                    minimum: 1
                    maximum: 3
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElement"

        ContentDividerBlockElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Divider

        ContentTableBlockElement:
            type: object
            required: [type, width, columns, rows]
            additionalProperties: false
            properties:
                type:
                    const: Table
                width:
                    type: number
                hasHeaderRow:
                    type: boolean
                hasHeaderColumn:
                    type: boolean
                columns:
                    type: array
                    minItems: 2
                    items:
                        type: object
                        required: [width]
                        additionalProperties: false
                        properties:
                            width:
                                type: number
                rows:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementRow"

        ContentTableBlockElementRow:
            type: object
            required: [cells]
            additionalProperties: false
            properties:
                cells:
                    type: array
                    minItems: 2
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCell"

        ContentTableBlockElementCell:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentTableBlockElementCellBlockElement"

        ContentTableBlockElementCellBlockElement:
            oneOf:
                - $ref: "#/components/schemas/ContentParagraphBlockElement"
                - $ref: "#/components/schemas/ContentUnorderedListBlockElement"
                - $ref: "#/components/schemas/ContentOrderedListBlockElement"
                - $ref: "#/components/schemas/ContentCheckListBlockElement"
                - $ref: "#/components/schemas/ContentQuoteBlockElement"
                - $ref: "#/components/schemas/ContentCodeBlockElement"
            discriminator:
                propertyName: type
                mapping:
                    Paragraph: "#/components/schemas/ContentParagraphBlockElement"
                    UnorderedList: "#/components/schemas/ContentUnorderedListBlockElement"
                    OrderedList: "#/components/schemas/ContentOrderedListBlockElement"
                    CheckList: "#/components/schemas/ContentCheckListBlockElement"
                    Quote: "#/components/schemas/ContentQuoteBlockElement"
                    Code: "#/components/schemas/ContentCodeBlockElement"

        ContentCodeBlockElement:
            type: object
            required: [type, language, lines]
            additionalProperties: false
            properties:
                type:
                    const: Code
                language:
                    type: string
                    enum: {{codeBlockLanguageIds}}
                lines:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementLine"

        ContentCodeBlockElementLine:
            type: object
            required: [elements]
            additionalProperties: false
            properties:
                elements:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElement"

        ContentInlineElement:
            oneOf:
                - $ref: "#/components/schemas/ContentTextInlineElement"
                - $ref: "#/components/schemas/ContentBreakInlineElement"
                - $ref: "#/components/schemas/ContentMentionInlineElement"
            discriminator:
                propertyName: type
                mapping:
                    Text: "#/components/schemas/ContentTextInlineElement"
                    Break: "#/components/schemas/ContentBreakInlineElement"
                    Mention: "#/components/schemas/ContentMentionInlineElement"

        ContentTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                # TODO(calebmer, #public-api): Document that marks are an unordered set. Mark
                # order doesn't matter and duplicates aren't allowed.
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentBreakInlineElement:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Break
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentMentionInlineElement:
            type: object
            required: [type, target]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                target:
                    $ref: "#/components/schemas/MentionTarget"
                # TODO(calebmer, #public-api): Document that this will be ignored if you try to
                # create content with a `title`. This property exists solely as a convenience
                # for code that wants to operate on both `ContentMentionInlineElement` and
                # `ContentMentionInlineElement_Response` (which will always have a title).
                title:
                    type: string
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentMentionInlineElement_Response:
            type: object
            required: [type, target, title]
            additionalProperties: false
            properties:
                type:
                    const: Mention
                target:
                    $ref: "#/components/schemas/MentionTarget"
                # TODO(calebmer, #public-api): Document that `title` is loaded using the search
                # index so may be stale by up to 90s! (60s for slow document reindexing + 10s
                # for OpenSearch refresh interval. Say 90s to give us enough buffer.)
                title:
                    type: string
                    minLength: 1
                isAccountShortName:
                    type: boolean
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentInlineElementMark"

        ContentInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementBoldMark"
                - $ref: "#/components/schemas/ContentInlineElementItalicMark"
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementLinkMark"
                - $ref: "#/components/schemas/ContentInlineElementCodeMark"
                - $ref: "#/components/schemas/ContentInlineElementHighlightMark"
                - $ref: "#/components/schemas/ContentInlineElementCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentInlineElementBoldMark"
                    Italic: "#/components/schemas/ContentInlineElementItalicMark"
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Link: "#/components/schemas/ContentInlineElementLinkMark"
                    Code: "#/components/schemas/ContentInlineElementCodeMark"
                    Highlight: "#/components/schemas/ContentInlineElementHighlightMark"
                    Comment: "#/components/schemas/ContentInlineElementCommentMark"

        ContentInlineElementBoldMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Bold

        ContentInlineElementItalicMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Italic

        ContentInlineElementStrikeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Strike

        ContentInlineElementLinkMark:
            type: object
            required: [type, url]
            additionalProperties: false
            properties:
                type:
                    const: Link
                url:
                    type: string

        ContentInlineElementCodeMark:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Code

        ContentInlineElementHighlightMark:
            type: object
            required: [type, color]
            additionalProperties: false
            properties:
                type:
                    const: Highlight
                color:
                    $ref: "#/components/schemas/ContentInlineElementHighlightMarkColor"

        ContentInlineElementHighlightMarkColor:
            type: string
            enum:
                - Red
                - Orange
                - Green
                - Blue
                - Purple

        ContentInlineElementCommentMark:
            type: object
            required: [type, threadId]
            additionalProperties: false
            properties:
                type:
                    const: Comment
                threadId:
                    $ref: "#/components/schemas/DocumentThreadId"

        ContentCodeBlockElementTextInlineElement:
            type: object
            required: [type, text]
            additionalProperties: false
            properties:
                type:
                    const: Text
                text:
                    type: string
                    minLength: 1
                    pattern: ^[^\n\r]*$
                marks:
                    type: array
                    items:
                        $ref: "#/components/schemas/ContentCodeBlockElementTextInlineElementMark"

        ContentCodeBlockElementTextInlineElementMark:
            oneOf:
                - $ref: "#/components/schemas/ContentInlineElementBoldMark"
                - $ref: "#/components/schemas/ContentInlineElementItalicMark"
                - $ref: "#/components/schemas/ContentInlineElementStrikeMark"
                - $ref: "#/components/schemas/ContentInlineElementLinkMark"
                - $ref: "#/components/schemas/ContentInlineElementHighlightMark"
                - $ref: "#/components/schemas/ContentInlineElementCommentMark"
            discriminator:
                propertyName: type
                mapping:
                    Bold: "#/components/schemas/ContentInlineElementBoldMark"
                    Italic: "#/components/schemas/ContentInlineElementItalicMark"
                    Strike: "#/components/schemas/ContentInlineElementStrikeMark"
                    Link: "#/components/schemas/ContentInlineElementLinkMark"
                    Highlight: "#/components/schemas/ContentInlineElementHighlightMark"
                    Comment: "#/components/schemas/ContentInlineElementCommentMark"

        # =========================================================================== #
        #                                  Entities                                   #
        # =========================================================================== #

        AccountWithoutSpace:
            type: object
            required: [id, name, shortName]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    $ref: "#/components/schemas/LabelString"
                botId:
                    $ref: "#/components/schemas/BotId"

        Space:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/SpaceId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Account:
            type: object
            required: [id, name, shortName, space]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/AccountId"
                name:
                    $ref: "#/components/schemas/LabelString"
                shortName:
                    type: string
                    minLength: 1
                    maxLength: 50
                botId:
                    $ref: "#/components/schemas/BotId"
                space:
                    type: object
                    required: [role, addedTime]
                    additionalProperties: false
                    properties:
                        role:
                            type: string
                            enum: [Owner, Admin, Member]
                        addedTime:
                            $ref: "#/components/schemas/DateTime"
                        # TODO(calebmer, #public-api): Bikeshed what the right way to expose account
                        # state over the public API is.
                        inactive:
                            oneOf:
                                - type: object
                                  required: [type]
                                  additionalProperties: false
                                  properties:
                                      type:
                                          const: Removed
                                      removedTime:
                                          $ref: "#/components/schemas/DateTime"
                                - type: object
                                  required: [type]
                                  additionalProperties: false
                                  properties:
                                      type:
                                          const: InvitePending

        Chat:
            type: object
            required: [id, members]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChatId"
                members:
                    type: array
                    items:
                        type: object
                        required: [account]
                        additionalProperties: false
                        properties:
                            account:
                                $ref: "#/components/schemas/Account"

        Document:
            type: object
            required: [id, title, content]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentId"
                title:
                    type: string
                content:
                    $ref: "#/components/schemas/Content"

        DocumentPreview:
            type: object
            required: [id, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentId"
                title:
                    type: string

        DocumentCommentThread:
            type: object
            required:
                [
                    id,
                    createdTime,
                    isResolved,
                    commentCount,
                    firstCommentAuthor,
                    documentContentSnippet,
                ]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/DocumentThreadId"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                isResolved:
                    type: boolean
                commentCount:
                    type: integer
                    minimum: 0
                firstCommentAuthor:
                    oneOf:
                        - $ref: "#/components/schemas/Account"
                        - type: "null"
                documentContentSnippet:
                    $ref: "#/components/schemas/Content"

        ChannelPreview:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"

        Channel:
            type: object
            required: [id, name, description]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/ChannelId"
                name:
                    $ref: "#/components/schemas/LabelString"
                description:
                    $ref: "#/components/schemas/Content"

        Post:
            type: object
            # `channel` is intentionally optional since we may allow users to create posts
            # that aren't in a channel in the future.
            required: [id, author, createdTime, createdTimeZone, content, contentPreview]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/PostId"
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                channel:
                    $ref: "#/components/schemas/ChannelPreview"
                content:
                    $ref: "#/components/schemas/Content"
                contentPreview:
                    type: string

        # TODO(ifitzsimmons, #ai): Add a `/posts/{id}/preview` endpoint that returns a
        # a `PostPreview`
        # https://alpine.inc/s/c2pwxmpv3z7b3db19tsn6y1qfg/tasks/znbyh8f7sx5s0nb29zygvcasjw
        PostPreview:
            type: object
            required: [id, author, contentPreview]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/PostId"
                author:
                    $ref: "#/components/schemas/Account"
                channel:
                    $ref: "#/components/schemas/ChannelPreview"
                contentPreview:
                    type: string

        Task:
            type: object
            required: [id, status, title, content]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                assignee:
                    $ref: "#/components/schemas/Account"
                due:
                    type: object
                    required: [date]
                    additionalProperties: false
                    properties:
                        date:
                            type: string
                            format: date
                priority:
                    type: string
                    enum: [Low, Medium, High, Urgent]
                content:
                    $ref: "#/components/schemas/Content"

        TaskWithoutContent:
            type: object
            required: [id, status, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string
                assignee:
                    $ref: "#/components/schemas/Account"
                due:
                    type: object
                    required: [date]
                    additionalProperties: false
                    properties:
                        date:
                            type: string
                            format: date
                priority:
                    type: string
                    enum: [Low, Medium, High, Urgent]

        TaskPreview:
            type: object
            required: [id, status, title]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                title:
                    type: string

        TaskStatus:
            oneOf:
                - type: object
                  required: [type, isActive]
                  additionalProperties: false
                  properties:
                      type:
                          const: Open
                      isActive:
                          type: boolean
                - type: object
                  required: [type]
                  additionalProperties: false
                  properties:
                      type:
                          const: Closed

        TaskCollection:
            type: object
            required: [id, name]
            additionalProperties: false
            properties:
                id:
                    $ref: "#/components/schemas/TaskCollectionId"
                name:
                    $ref: "#/components/schemas/LabelString"

        # =========================================================================== #
        #                                  Messages                                   #
        # =========================================================================== #

        Message:
            type: object
            required: [index, author, createdTime, createdTimeZone, payload]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                # For any useful rendering of a post, you need the author's name. Which is why
                # we include more than just the `AccountId`.
                author:
                    $ref: "#/components/schemas/Account"
                createdTime:
                    $ref: "#/components/schemas/DateTime"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                payload:
                    $ref: "#/components/schemas/MessagePayload"

        MessagePayload:
            oneOf:
                - $ref: "#/components/schemas/MessageContentPayload"
                - $ref: "#/components/schemas/MessageDeletedPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageContentPayload"
                    Deleted: "#/components/schemas/MessageDeletedPayload"

        MessageContentPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                parent:
                    oneOf:
                        - $ref: "#/components/schemas/MessageContentPayloadMessageParent"
                    discriminator:
                        propertyName: type
                        mapping:
                            Message: "#/components/schemas/MessageContentPayloadMessageParent"
                content:
                    $ref: "#/components/schemas/Content"

                # TODO(calebmer, #api): Files? How do we get AI to read any attached files?

        MessageContentPayloadMessageParent:
            type: object
            required: [type, index]
            additionalProperties: false
            properties:
                type:
                    const: Message
                index:
                    type: integer
                    minimum: 0

        MessageDeletedPayload:
            type: object
            required: [type]
            additionalProperties: false
            properties:
                type:
                    const: Deleted

        MessageStreamPart:
            type: object
            required: [index, version, payload, createdTime]
            additionalProperties: false
            properties:
                index:
                    type: integer
                    minimum: 0
                version:
                    type: integer
                    minimum: 0
                createdTime:
                    type: string
                    format: date-time
                payload:
                    $ref: "#/components/schemas/MessageStreamPartPayload"

        MessageStreamPartPayload:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamContentPartPayload"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayload"
                - $ref: "#/components/schemas/MessageStreamReasoningPartPayload"
            discriminator:
                propertyName: type
                mapping:
                    Content: "#/components/schemas/MessageStreamContentPartPayload"
                    ToolCall: "#/components/schemas/MessageStreamToolCallPartPayload"
                    Reasoning: "#/components/schemas/MessageStreamReasoningPartPayload"

        MessageStreamContentPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Content
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamReasoningPartPayload:
            type: object
            required: [type, content]
            additionalProperties: false
            properties:
                type:
                    const: Reasoning
                content:
                    $ref: "#/components/schemas/Content"

        MessageStreamToolCallPartPayload:
            type: object
            required: [type, call]
            additionalProperties: false
            properties:
                type:
                    const: ToolCall
                call:
                    $ref: "#/components/schemas/MessageStreamToolCallPartPayloadCall"

        MessageStreamToolCallPartPayloadCall:
            oneOf:
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                - $ref: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"
            discriminator:
                propertyName: type
                mapping:
                    Read: "#/components/schemas/MessageStreamToolCallPartPayloadReadCall"
                    Search: "#/components/schemas/MessageStreamToolCallPartPayloadSearchCall"

        MessageStreamToolCallPartPayloadReadCall:
            type: object
            required: [type, target]
            additionalProperties: false
            properties:
                type:
                    const: Read
                target:
                    $ref: "#/components/schemas/MentionTarget"

        MessageStreamToolCallPartPayloadSearchCall:
            type: object
            required: [type, query]
            additionalProperties: false
            properties:
                type:
                    const: Search
                query:
                    type: string

        # =========================================================================== #
        #                                  Webhooks                                   #
        # =========================================================================== #

        BotWebhookEvent:
            oneOf:
                - $ref: "#/components/schemas/BotWebhookNewMessageEvent"
            discriminator:
                propertyName: type
                mapping:
                    NewMessage: "#/components/schemas/BotWebhookNewMessageEvent"

        BotWebhookNewMessageEvent:
            type: object
            required: [type, roomPath, index, authorId, createdTimeZone]
            additionalProperties: false
            properties:
                type:
                    const: NewMessage
                roomPath:
                    $ref: "#/components/schemas/MessageRoomPath"
                index:
                    type: integer
                    minimum: 0
                authorId:
                    $ref: "#/components/schemas/AccountId"
                createdTimeZone:
                    $ref: "#/components/schemas/TimeZone"
                wasMentioned:
                    type: boolean

        # =========================================================================== #
        #                                  Search                                    #
        # =========================================================================== #

        # Search results have the following shared properties:
        #
        # - `type` (required)
        # - `path` (required)
        # - `title` (optional)
        # - `bodyMatch` (optional)
        SearchResult:
            oneOf:
                - $ref: "#/components/schemas/SearchAccountResult"
                - $ref: "#/components/schemas/SearchChannelResult"
                - $ref: "#/components/schemas/SearchChatResult"
                - $ref: "#/components/schemas/SearchChatMessageResult"
                - $ref: "#/components/schemas/SearchDocumentResult"
                - $ref: "#/components/schemas/SearchDocumentMessageResult"
                - $ref: "#/components/schemas/SearchPostResult"
                - $ref: "#/components/schemas/SearchPostMessageResult"
                - $ref: "#/components/schemas/SearchTaskResult"
                - $ref: "#/components/schemas/SearchTaskMessageResult"
                - $ref: "#/components/schemas/SearchTaskCollectionResult"
            discriminator:
                propertyName: type
                mapping:
                    Account: "#/components/schemas/SearchAccountResult"
                    Channel: "#/components/schemas/SearchChannelResult"
                    Chat: "#/components/schemas/SearchChatResult"
                    ChatMessage: "#/components/schemas/SearchChatMessageResult"
                    Document: "#/components/schemas/SearchDocumentResult"
                    DocumentMessage: "#/components/schemas/SearchDocumentMessageResult"
                    Post: "#/components/schemas/SearchPostResult"
                    PostMessage: "#/components/schemas/SearchPostMessageResult"
                    Task: "#/components/schemas/SearchTaskResult"
                    TaskMessage: "#/components/schemas/SearchTaskMessageResult"
                    TaskCollection: "#/components/schemas/SearchTaskCollectionResult"

        SearchAccountResult:
            type: object
            required: [path, title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/AccountPath"
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Account
                id:
                    $ref: "#/components/schemas/AccountId"

        SearchChannelResult:
            type: object
            required: [path, title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/ChannelPath"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Channel
                id:
                    $ref: "#/components/schemas/ChannelId"

        SearchChatResult:
            type: object
            required: [path, title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/ChatPath"
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Chat
                id:
                    $ref: "#/components/schemas/ChatId"

        SearchChatMessageResult:
            type: object
            required: [path, title, bodyMatch, type, id, index, author]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/ChatMessagePath"
                title:
                    const: null
                bodyMatch:
                    $ref: "#/components/schemas/SearchResultBodyMatch"
                type:
                    const: ChatMessage
                id:
                    $ref: "#/components/schemas/ChatId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchDocumentResult:
            type: object
            required: [path, title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/DocumentPath"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: Document
                id:
                    $ref: "#/components/schemas/DocumentId"

        SearchDocumentMessageResult:
            type: object
            required: [path, title, bodyMatch, type, id, threadId, index, author]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/DocumentMessagePath"
                title:
                    const: null
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: DocumentMessage
                id:
                    $ref: "#/components/schemas/DocumentId"
                threadId:
                    $ref: "#/components/schemas/DocumentThreadId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchPostResult:
            type: object
            required: [path, title, bodyMatch, type, id, author]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/PostPath"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: Post
                id:
                    $ref: "#/components/schemas/PostId"
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchPostMessageResult:
            type: object
            required: [path, title, bodyMatch, type, id, index, author]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/PostMessagePath"
                title:
                    const: null
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: PostMessage
                id:
                    $ref: "#/components/schemas/PostId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskResult:
            type: object
            required: [path, title, bodyMatch, type, id, status]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/TaskPath"
                title:
                    type: string
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: Task
                id:
                    $ref: "#/components/schemas/TaskId"
                status:
                    $ref: "#/components/schemas/TaskStatus"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskMessageResult:
            type: object
            required: [path, title, bodyMatch, type, id, index, author]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/TaskMessagePath"
                title:
                    const: null
                bodyMatch:
                    oneOf:
                        - $ref: "#/components/schemas/SearchResultBodyMatch"
                        - type: "null"
                type:
                    const: TaskMessage
                id:
                    $ref: "#/components/schemas/TaskId"
                index:
                    type: integer
                    minimum: 0
                author:
                    $ref: "#/components/schemas/Account"
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"

        SearchTaskCollectionResult:
            type: object
            required: [path, title, bodyMatch, type, id]
            additionalProperties: false
            properties:
                path:
                    $ref: "#/components/schemas/TaskCollectionPath"
                title:
                    type: string
                bodyMatch:
                    const: null
                parsedFilter:
                    $ref: "#/components/schemas/SearchResultParsedFilter"
                type:
                    const: TaskCollection
                id:
                    $ref: "#/components/schemas/TaskCollectionId"

        SearchResultBodyMatch:
            type: array
            items:
                type: object
                required: [text]
                additionalProperties: false
                properties:
                    text:
                        type: string
                    isMatch:
                        const: true

        SearchResultParsedFilter:
            type: object
            required: [summary]
            additionalProperties: false
            properties:
                summary:
                    type: string
