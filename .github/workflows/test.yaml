name: Test
on: push

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Get date
              id: date
              shell: bash
              run: |
                  echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT

            - name: Cache Bazel output
              id: bazel-cache
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.cache/bazelisk
                      ~/.cache/bazel
                  key: test-${{ runner.os }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      test-${{ runner.os }}-

            - name: Test
              run: |
                  admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //... --test_tag_filters=-playwright

            # Currently `actions/upload-artifact` doesn't work with symlinked directories.
            # A PR to fix this has been merged but hasn't been released. So read the actual path and
            # put it in our output.
            # https://github.com/actions/upload-artifact/issues/92
            - if: failure()
              name: Get Bazel test logs directory
              id: bazel_test_logs_path
              shell: bash
              run: |
                  echo "path=$(readlink -f bazel-testlogs)" >> $GITHUB_OUTPUT

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@v3
              with:
                  name: test_bazel_testlogs
                  path: ${{ steps.bazel_test_logs_path.outputs.path }}

    test_playwright:
        name: Test Playwright
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            # Unfortunate that Bazel can't install these since they're global dependencies.
            - name: Install Playwright dependencies
              run:
                  sudo apt-get install libvpx7 libevent-2.1-7 libopus0 libwoff1 libharfbuzz-icu0
                  libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 libhyphen0 libmanette-0.2-0
                  libgles2 gstreamer1.0-libav

            - name: Get date
              id: date
              shell: bash
              run: |
                  echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT

            - name: Cache Bazel output
              id: bazel-cache
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.cache/bazelisk
                      ~/.cache/bazel
                  key: test_playwright-${{ runner.os }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      test_playwright-${{ runner.os }}-

            # Run Playwright tests sequentially instead of in parallel. The current
            # machines running GitHub actions are resource constrained and frequently run
            # into timeouts when executing Playwright tests. Running locally on my laptop,
            # parallel execution of Playwright tests is fine. When we upgrade our GitHub
            # Actions machines we can go back to executing these tests in parallel to
            # speed up CI.
            - name: Test Playwright
              run: |
                  admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //... --test_tag_filters=playwright --jobs=1

            # Currently `actions/upload-artifact` doesn't work with symlinked directories.
            # A PR to fix this has been merged but hasn't been released. So read the actual path and
            # put it in our output.
            # https://github.com/actions/upload-artifact/issues/92
            - if: failure()
              name: Get Bazel test logs directory
              id: bazel_test_logs_path
              shell: bash
              run: |
                  echo "path=$(readlink -f bazel-testlogs)" >> $GITHUB_OUTPUT

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@v3
              with:
                  name: test_playwright_bazel_testlogs
                  path: ${{ steps.bazel_test_logs_path.outputs.path }}
