name: Test
on: push

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Cache Bazel output
              id: bazel-cache
              uses: actions/cache@v3
              with:
                  path: "/home/runner/.cache/bazel"
                  key: bazel

            - name: Test
              run: |
                  "${GITHUB_WORKSPACE}/admin/bin/bazel" test //...
