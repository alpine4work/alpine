name: Test
on:
    push:
    workflow_dispatch:
        branches:
            - main

jobs:
    unit-tests:
        name: Unit tests
        runs-on: [self-hosted, aws-test]
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Check for “[SKIP CI]”
              if: github.ref != 'refs/heads/main'
              uses: ./.github/actions/check-skip-ci

            - name: Initialize Bazel cache
              uses: ./.github/actions/initialize-bazel-cache

            # Run TypeScript, ESLint, Prettier, and unit tests. These tests are fast and
            # easily cacheable. Running these tests first gives the developer fast feedback
            # and leads to a lower total cost for CI since we can stop executing tests early
            # on failures.
            - name: Unit tests
              run: |
                  admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //... --config=github-runner --test_tag_filters=-playwright,-macos --nofetch

            # Prepare the `bazel-testlogs` folder for uploading. This script removes the logs
            # and outputs for all tests that passed leaving only the logs and outputs for
            # tests that failed.
            - if: failure()
              name: Prepare Bazel test logs
              run: admin/bazel/prepare_bazel_testlogs_failure_artifact.sh

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@v4
              with:
                  name: bazel_unit_testlogs
                  path: bazel-testlogs
                  retention-days: 7

    integration-tests:
        name: Integration tests (${{ matrix.category }})
        runs-on: [self-hosted, aws-test]
        strategy:
            matrix:
                category:
                    - tasks
                    - documents
                    - forum
                    - miscellaneous
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Check for “[SKIP CI]”
              if: github.ref != 'refs/heads/main'
              uses: ./.github/actions/check-skip-ci

            - name: Initialize Bazel cache
              uses: ./.github/actions/initialize-bazel-cache

            # Run integration tests with Playwright. These tests are expensive to run and
            # are flaky. We run them after all other tests have passed and break them into
            # categories to run in parallel.
            #
            # We set `--notest_keep_going`. If any integration test fails we immediately
            # fail the build and exit to speed up test result turnaround time for
            # developers.
            - name: Integration tests
              run: |
                  admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test \
                      //... \
                      --config=github-runner \
                      --test_tag_filters=${{ matrix.category == 'tasks' && 'playwright_tasks' || matrix.category == 'documents' && 'playwright_documents' || matrix.category == 'forum' && 'playwright_forum' || 'playwright,-playwright_forum,-playwright_documents,-playwright_tasks' }},-macos \
                      --nofetch \
                      --nokeep_going \
                      --notest_keep_going

            # Prepare the `bazel-testlogs` folder for uploading. This script removes the logs
            # and outputs for all tests that passed leaving only the logs and outputs for
            # tests that failed.
            - if: failure()
              name: Prepare Bazel test logs
              run: admin/bazel/prepare_bazel_testlogs_failure_artifact.sh

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@v4
              with:
                  name: bazel_${{ matrix.category }}_integration_testlogs
                  path: bazel-testlogs
                  retention-days: 7

    schedule-deploy:
        name: Schedule deploy
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.SCHEDULE_DEPLOY_AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.SCHEDULE_DEPLOY_AWS_SECRET_ACCESS_KEY }}
        # If tests pass and we're on the main branch then schedule a deploy by sending
        # a message to our job queue via lambda. This will make sure our commit is eventually
        # deployed.
        if: github.ref == 'refs/heads/main'
        needs: [integration-tests, unit-tests]
        steps:
            - name: Schedule deploy
              run: |
                  aws lambda invoke \
                      --function-name ${{ secrets.SCHEDULE_DEPLOY_AWS_LAMBDA_FUNCTION_NAME }} \
                      --payload "{ \"commitSha\": \"${{ github.sha }}\" }" \
                      --cli-binary-format raw-in-base64-out \
                      --region us-east-1 \
                      response.json
