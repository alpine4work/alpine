name: Test
on:
    push:
        branches-ignore:
            - admin/analysis
    workflow_dispatch:
        branches:
            - main

permissions:
    actions: read
    contents: read
    pull-requests: read

jobs:
    prepare-ci:
        name: Prepare CI
        runs-on: ubuntu-slim
        outputs:
            new_ci: ${{ steps.ci_flags.outputs.new_ci }}
            skip_ci: ${{ steps.ci_flags.outputs.skip_ci }}
            bazel_cache_hit: ${{ steps.ami_cache.outputs.cache-hit }}
            unit_test_matrix: ${{ steps.test_buckets.outputs.unit_test_matrix }}
            integration_test_matrix: ${{ steps.test_buckets.outputs.integration_test_matrix }}
            screenshot_test_matrix: ${{ steps.test_buckets.outputs.screenshot_test_matrix }}
        steps:
            - id: ci_flags
              name: Check CI flags
              env:
                  GH_REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  # Pull out PR title
                  set -euo pipefail
                  new_ci=true
                  skip_ci=false
                  write_outputs() {
                      echo "new_ci=$new_ci" >> "$GITHUB_OUTPUT"
                      echo "skip_ci=$skip_ci" >> "$GITHUB_OUTPUT"
                  }

                  if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                      echo "On main, ignoring PR title flags."
                      write_outputs
                      exit 0
                  fi

                  pr_number=
                  if [[ "${GITHUB_REF_NAME:-}" =~ ^graphite-base/([0-9]+)$ ]]; then
                      pr_number="${BASH_REMATCH[1]}"
                  fi

                  if [ -z "$pr_number" ]; then
                      pr_number=$(gh pr view "$GITHUB_REF_NAME" --json number --jq ".number" 2>/dev/null || true)
                  fi

                  if [ -z "$pr_number" ]; then
                      pr_number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq ".[0].number // empty" 2>/dev/null || true)
                  fi

                  if [ -z "$pr_number" ]; then
                      echo "No PR found for this ref, continuing without title flags."
                      write_outputs
                      exit 0
                  fi

                  pr_title=$(gh pr view "$pr_number" --json title --jq ".title" 2>/dev/null || true)
                  if [ -z "$pr_title" ]; then
                      echo "Failed to get PR title, GitHub API may be down. Continuing without title flags."
                      write_outputs
                      exit 0
                  fi

                  # We have all the information we need, check flags.
                  if [[ "$pr_title" == \[SKIP\ CI\]* ]]; then
                      echo "PR title starts with [SKIP CI], marking CI to skip."
                      skip_ci=true
                  fi

                  # TODO: Delete the [OLD CI] flag and legacy branches after the rollout.
                  if [[ "$pr_title" == *\[OLD\ CI\]* ]]; then
                      echo "PR title contains [OLD CI], enabling old CI."
                      new_ci=false
                  fi

                  write_outputs

            - if: steps.ci_flags.outputs.skip_ci == 'true'
              name: Check for “[SKIP CI]”
              run: |
                  echo "PR title starts with [SKIP CI], failing the job to skip CI."
                  exit 1

            - if: steps.ci_flags.outputs.new_ci == 'true'
              name: Checkout repo for cache detection
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 1

            - if: steps.ci_flags.outputs.new_ci == 'true'
              id: ami_cache
              name: Detect AMI Bazel cache hit
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  cache_hit=false
                  ami_head_sha=
                  if ! ami_head_sha=$(
                      gh api \
                          "repos/$GITHUB_REPOSITORY/actions/workflows/build-test-runner-ami.yaml/runs?branch=main&status=success&per_page=1" \
                          --jq '.workflow_runs[0].head_sha // empty'
                  ); then
                      echo "Could not query test runner AMI builds; treating the cache as cold."
                  elif [ -z "$ami_head_sha" ]; then
                      echo "No successful test runner AMI build found; treating the cache as cold."
                  elif ! git fetch --no-tags --depth=1 origin "$ami_head_sha"; then
                      echo "Could not fetch test runner AMI commit; treating the cache as cold."
                  elif git diff --quiet "$ami_head_sha" "$GITHUB_SHA" -- \
                      .bazelversion \
                      WORKSPACE \
                      pnpm-lock.yaml \
                      requirements_lock.txt \
                      ':(glob)admin/patches/*.patch' \
                      ':(glob)admin/patches/bazel/*.patch' \
                      ':(glob)admin/bazel/third_party/*.bazel'
                  then
                      cache_hit=true
                      echo "The current commit matches the Bazel cache in the latest successful test runner AMI."
                  else
                      echo "Bazel cache inputs changed since the latest successful test runner AMI; treating the cache as cold."
                  fi

                  echo "cache-hit=$cache_hit" >> "$GITHUB_OUTPUT"

            - name: Calculate test buckets
              id: test_buckets
              shell: bash
              env:
                  newCi: ${{ steps.ci_flags.outputs.new_ci }}
                  unitTestBucketCount:
                      ${{ steps.ami_cache.outputs.cache-hit == 'true' && 6 || 2 }}
                  integrationTestBucketCount:
                      ${{ steps.ami_cache.outputs.cache-hit == 'true' && 10 || 3 }}
                  screenshotTestBucketCount:
                      ${{ steps.ami_cache.outputs.cache-hit == 'true' && 4 || 1 }}
              run: |
                  set -euo pipefail

                  test_bucket_matrix() {
                      local test_type="$1"
                      local bucket_count="$2"
                      local bucket=1
                      local runner_job_label
                      local unique_runner_label

                      printf '{"include":['
                      while [ "$bucket" -le "$bucket_count" ]; do
                          if [ "$bucket" -gt 1 ]; then
                              printf ','
                          fi

                          if [ "$newCi" = "true" ]; then
                              unique_runner_label="aws-test-asg-job-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${test_type}-${bucket}"
                              runner_job_label="$unique_runner_label"
                          else
                              runner_job_label="aws-test"
                          fi

                          printf '{"bucket":%s,"bucketCount":%s,"runnerJobLabel":"%s"}' \
                              "$bucket" \
                              "$bucket_count" \
                              "$runner_job_label"
                          bucket=$((bucket + 1))
                      done
                      printf ']}'
                  }

                  emit_test_bucket_matrix() {
                      local output_name="$1"
                      local test_type="$2"
                      local bucket_count="$3"

                      if ! [[ "$bucket_count" =~ ^[1-9][0-9]*$ ]]; then
                          echo "Error: $output_name bucket count must be a positive integer" >&2
                          exit 1
                      fi

                      echo "$output_name=$(test_bucket_matrix "$test_type" "$bucket_count")" >> "$GITHUB_OUTPUT"
                  }

                  emit_test_bucket_matrix unit_test_matrix unit "$unitTestBucketCount"
                  emit_test_bucket_matrix integration_test_matrix integration "$integrationTestBucketCount"
                  emit_test_bucket_matrix screenshot_test_matrix screenshot "$screenshotTestBucketCount"

    unit-tests:
        name: Unit tests (${{ matrix.bucket }}/${{ matrix.bucketCount }})
        needs: [prepare-ci]
        runs-on: [self-hosted, "${{ matrix.runnerJobLabel }}"]
        strategy:
            fail-fast: false # Allows all jobs to complete
            matrix: ${{ fromJSON(needs.prepare-ci.outputs.unit_test_matrix) }}
        steps:
            - if: needs.prepare-ci.outputs.new_ci == 'true'
              name: Checkout git SHA
              uses: ./.github/actions/checkout_github_sha
              with:
                  github-token: ${{ github.token }}

            - if: needs.prepare-ci.outputs.new_ci != 'true'
              name: Checkout repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Initialize Bazel cache
              uses: ./.github/actions/initialize-bazel-cache

            # Run TypeScript, ESLint, Prettier, and unit tests. These tests are fast and
            # easily cacheable. Running these tests first gives the developer fast feedback
            # and leads to a lower total cost for CI since we can stop executing tests early
            # on failures.
            #
            # We split unit tests into deterministic buckets to run in parallel across
            # multiple runners. Each target label is hashed and assigned to a bucket.
            - name: Unit tests
              run: |
                  targets=$(admin/bazel/bucket_test_targets.sh ${{ matrix.bucket }} ${{ matrix.bucketCount }} \
                      'tests(//...) except attr(tags, "integration_test|screenshot_test|macos", tests(//...))')
                  if [ -z "$targets" ]; then
                      echo "Error: no test targets in bucket ${{ matrix.bucket }}" >&2
                      exit 1
                  fi
                  target_count=$(echo "$targets" | wc -l | tr -d ' ')
                  echo "Running $target_count test targets in bucket ${{ matrix.bucket }}."
                  bazel_test_flags=""
                  if [ "${{ needs.prepare-ci.outputs.new_ci }}" = "true" ]; then
                      bazel_test_flags="--keep_going --test_keep_going"
                  fi
                  results_path="$RUNNER_TEMP/bazel-unit-results"
                  targets_path="$RUNNER_TEMP/unit-test-targets.txt"
                  coverage_targets_path="$RUNNER_TEMP/unit-coverage-targets.txt"
                  mkdir -p "$results_path"
                  printf '%s\n' "$targets" > "$targets_path"
                  jest_targets=$(admin/bin/bazel query --noshow_progress \
                      'attr(tags, "jest", tests(//...) except attr(tags, "integration_test|screenshot_test|macos", tests(//...)))')
                  comm -12 \
                      <(printf '%s\n' "$targets" | sort) \
                      <(printf '%s\n' "$jest_targets" | sort) \
                      > "$coverage_targets_path"
                  admin/bazel/run_ci_bazel_test_targets.sh "$results_path" "$targets_path" -- \
                      admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test \
                      --config=github-runner \
                      --nofetch \
                      $bazel_test_flags \
                      $targets

            - if: always()
              name: Collect unit coverage outputs
              run: |
                  set -euo pipefail

                  coverage_targets_path="$RUNNER_TEMP/unit-coverage-targets.txt"
                  coverage_artifact_path="$RUNNER_TEMP/bazel-unit-coverage"
                  rm -rf "$coverage_artifact_path"
                  mkdir -p "$coverage_artifact_path/testlogs"

                  if [ ! -f "$coverage_targets_path" ]; then
                      touch "$coverage_targets_path"
                  fi
                  coverage_artifact_targets_path="$coverage_artifact_path/targets.txt"
                  : > "$coverage_artifact_targets_path"

                  target_path_from_label() {
                      local label="$1"
                      label="${label#//}"
                      printf '%s\n' "${label/://}"
                  }

                  bazel_testlogs_path="$(admin/bin/bazel info bazel-testlogs)"
                  missing_count=0
                  while IFS= read -r target; do
                      if [ -z "$target" ]; then
                          continue
                      fi

                      test_outputs_path="$bazel_testlogs_path/$(target_path_from_label "$target")/test.outputs"
                      artifact_outputs_path="$coverage_artifact_path/testlogs/$(target_path_from_label "$target")/test.outputs"
                      if [ -f "$test_outputs_path/coverage/coverage-final.json" ]; then
                          mkdir -p "$artifact_outputs_path/coverage"
                          cp "$test_outputs_path/coverage/coverage-final.json" "$artifact_outputs_path/coverage/coverage-final.json"
                          printf '%s\n' "$target" >> "$coverage_artifact_targets_path"
                      elif [ -f "$test_outputs_path/outputs.zip" ]; then
                          mkdir -p "$artifact_outputs_path"
                          cp "$test_outputs_path/outputs.zip" "$artifact_outputs_path/outputs.zip"
                          printf '%s\n' "$target" >> "$coverage_artifact_targets_path"
                      else
                          echo "Missing coverage output for $target" >&2
                          missing_count=$((missing_count + 1))
                      fi
                  done < "$coverage_targets_path"

                  if [ "$missing_count" -gt 0 ]; then
                      echo "Coverage outputs missing for $missing_count target(s)." >&2
                  fi

                  landing_outputs_path="$bazel_testlogs_path/admin/analysis/generate_landing_html_test/test.outputs/outputs.zip"
                  if [ -f "$landing_outputs_path" ]; then
                      mkdir -p "$coverage_artifact_path/landing"
                      cp "$landing_outputs_path" "$coverage_artifact_path/landing/outputs.zip"
                  fi

            # Prepare the `bazel-testlogs` folder for uploading. This script removes the logs
            # and outputs for all tests that passed leaving only the logs and outputs for
            # tests that failed.
            - if: failure()
              name: Prepare Bazel test logs
              run: admin/bazel/prepare_bazel_testlogs_failure_artifact.sh

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
              with:
                  name: bazel_unit_${{ matrix.bucket }}_testlogs
                  path: bazel-testlogs
                  retention-days: 7

            - if: always()
              name: Upload Bazel test result metadata
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: bazel_unit_${{ matrix.bucket }}_results
                  path: ${{ runner.temp }}/bazel-unit-results
                  retention-days: 7

            - if: always()
              name: Upload unit coverage outputs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: bazel_unit_${{ matrix.bucket }}_coverage
                  path: ${{ runner.temp }}/bazel-unit-coverage
                  retention-days: 7

    integration-tests:
        name: Integration tests (${{ matrix.bucket }}/${{ matrix.bucketCount }})
        needs: [prepare-ci]
        runs-on: [self-hosted, "${{ matrix.runnerJobLabel }}"]
        strategy:
            fail-fast: false # Allows all jobs to complete
            matrix: ${{ fromJSON(needs.prepare-ci.outputs.integration_test_matrix) }}
        steps:
            - if: needs.prepare-ci.outputs.new_ci == 'true'
              name: Checkout git SHA
              uses: ./.github/actions/checkout_github_sha
              with:
                  github-token: ${{ github.token }}

            - if: needs.prepare-ci.outputs.new_ci != 'true'
              name: Checkout repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Initialize Bazel cache
              uses: ./.github/actions/initialize-bazel-cache

            # Run integration tests with Playwright. These tests are expensive to run and
            # are flaky. We run them after all other tests have passed and break them into
            # deterministic buckets to run in parallel.
            #
            # In the new CI, keep running after failures so the aggregate check
            # can report every target status and all available failure logs.
            - name: Integration tests
              run: |
                  targets=$(admin/bazel/bucket_test_targets.sh ${{ matrix.bucket }} ${{ matrix.bucketCount }} \
                      'attr(tags, "integration_test", tests(//...)) except attr(tags, "macos", tests(//...))')
                  if [ -z "$targets" ]; then
                      echo "Error: no integration test targets in bucket ${{ matrix.bucket }}" >&2
                      exit 1
                  fi
                  target_count=$(echo "$targets" | wc -l | tr -d ' ')
                  echo "Running $target_count integration test targets in bucket ${{ matrix.bucket }}."
                  bazel_test_flags="--nokeep_going --notest_keep_going"
                  if [ "${{ needs.prepare-ci.outputs.new_ci }}" = "true" ]; then
                      bazel_test_flags="--keep_going --test_keep_going"
                  fi
                  results_path="$RUNNER_TEMP/bazel-integration-results"
                  targets_path="$RUNNER_TEMP/integration-test-targets.txt"
                  mkdir -p "$results_path"
                  printf '%s\n' "$targets" > "$targets_path"
                  admin/bazel/run_ci_bazel_test_targets.sh "$results_path" "$targets_path" -- \
                      admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test \
                      --config=github-runner \
                      --nofetch \
                      $bazel_test_flags \
                      $targets

            # Prepare the `bazel-testlogs` folder for uploading. This script removes the logs
            # and outputs for all tests that passed leaving only the logs and outputs for
            # tests that failed.
            - if: failure()
              name: Prepare Bazel test logs
              run: admin/bazel/prepare_bazel_testlogs_failure_artifact.sh

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
              with:
                  name: bazel_integration_${{ matrix.bucket }}_testlogs
                  path: bazel-testlogs
                  retention-days: 7

            - if: always()
              name: Upload Bazel test result metadata
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: bazel_integration_${{ matrix.bucket }}_results
                  path: ${{ runner.temp }}/bazel-integration-results
                  retention-days: 7

    screenshot-tests:
        name: Screenshot tests (${{ matrix.bucket }}/${{ matrix.bucketCount }})
        needs: [prepare-ci]
        runs-on: [self-hosted, "${{ matrix.runnerJobLabel }}"]
        strategy:
            fail-fast: false # Allows all jobs to complete
            matrix: ${{ fromJSON(needs.prepare-ci.outputs.screenshot_test_matrix) }}
        steps:
            - if: needs.prepare-ci.outputs.new_ci == 'true'
              name: Checkout git SHA
              uses: ./.github/actions/checkout_github_sha
              with:
                  github-token: ${{ github.token }}

            - if: needs.prepare-ci.outputs.new_ci != 'true'
              name: Checkout repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Initialize Bazel cache
              uses: ./.github/actions/initialize-bazel-cache

            # Run screenshot tests with Playwright. These tests are expensive to run and
            # are flaky. We run them after all other tests have passed and break them into
            # balanced randomized buckets to run in parallel.
            - name: Screenshot tests
              run: |
                  targets=$(admin/bazel/bucket_test_targets.sh \
                      ${{ matrix.bucket }} \
                      ${{ matrix.bucketCount }} \
                      --balanced-random \
                      'attr(tags, "screenshot_test", tests(//...)) except attr(tags, "macos", tests(//...))')
                  if [ -z "$targets" ]; then
                      echo "Error: no screenshot test targets in bucket ${{ matrix.bucket }}" >&2
                      exit 1
                  fi
                  target_count=$(echo "$targets" | wc -l | tr -d ' ')
                  echo "Running $target_count screenshot test targets in bucket ${{ matrix.bucket }}."
                  bazel_test_flags=""
                  if [ "${{ needs.prepare-ci.outputs.new_ci }}" = "true" ]; then
                      bazel_test_flags="--keep_going --test_keep_going"
                  fi
                  results_path="$RUNNER_TEMP/bazel-screenshot-results"
                  targets_path="$RUNNER_TEMP/screenshot-test-targets.txt"
                  mkdir -p "$results_path"
                  printf '%s\n' "$targets" > "$targets_path"
                  admin/bazel/run_ci_bazel_test_targets.sh "$results_path" "$targets_path" -- \
                      admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test \
                      --config=github-runner \
                      --nofetch \
                      $bazel_test_flags \
                      $targets

            # Prepare the `bazel-testlogs` folder for uploading. This script removes the logs
            # and outputs for all tests that passed leaving only the logs and outputs for
            # tests that failed.
            - if: failure()
              name: Prepare Bazel test logs
              run: admin/bazel/prepare_bazel_testlogs_failure_artifact.sh

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
              with:
                  name: bazel_screenshot_${{ matrix.bucket }}_testlogs
                  path: bazel-testlogs
                  retention-days: 7

            - if: always()
              name: Upload Bazel test result metadata
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: bazel_screenshot_${{ matrix.bucket }}_results
                  path: ${{ runner.temp }}/bazel-screenshot-results
                  retention-days: 7

    # Stable aggregate checks for branch protection. GitHub treats each matrix
    # shard as a separate required check, which means changing the shard count
    # forces everyone to rebase branch protection settings. Successful shards
    # leave these checks as no-ops. Failures aggregate uploaded shard artifacts,
    # print failed test logs, and report uploaded target statuses.
    unit-tests-check:
        name: Unit tests
        if: always()
        needs: [prepare-ci, unit-tests]
        runs-on: ubuntu-latest
        env:
            HONEYCOMB_API_KEY:
                ${{ secrets.HONEYCOMB_API_KEY || secrets.LIFECYCLE_HONEYCOMB_API_KEY ||
                secrets.DEPLOY_HONEYCOMB_API_KEY }}
        steps:
            - if: needs.prepare-ci.result != 'success'
              name: Verify CI preparation passed
              run: |
                  echo "Prepare CI failed: ${{ needs.prepare-ci.result }}" >&2
                  exit 1

            - if: needs.prepare-ci.result == 'success'
              name: Checkout repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - if: needs.prepare-ci.result == 'success' && needs.unit-tests.result != 'success'
              name: Aggregate and verify unit test results
              uses: ./.github/actions/aggregate-test-results
              with:
                  test-type: unit
                  test-result: ${{ needs.unit-tests.result }}

            - if: needs.prepare-ci.result == 'success' && needs.unit-tests.result == 'success'
              name: Download unit coverage artifacts
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
              with:
                  pattern: bazel_unit_*_coverage
                  path: ${{ runner.temp }}/unit-coverage-artifacts

            - if: needs.prepare-ci.result == 'success' && needs.unit-tests.result == 'success'
              name: Install coverage report dependencies
              run: |
                  # Keep this aggregate job light. The unit shards already paid
                  # for Bazel and uploaded the coverage outputs. This is
                  # intentionally not hermetic and breaks Bazel's rules: there is
                  # nothing Bazel-specific about statically merging uploaded JSON
                  # and zip files, and initializing the full Bazel cache here
                  # would add minutes just to run a small Node.js report
                  # collector.
                  npm install \
                      --prefix "$RUNNER_TEMP/analysis-node" \
                      --no-audit \
                      --no-fund \
                      --no-package-lock \
                      --no-save \
                      fflate@0.8.2 \
                      istanbul-lib-coverage@3.2.0 \
                      istanbul-lib-instrument@6.0.0 \
                      istanbul-lib-report@3.0.0 \
                      istanbul-reports@3.1.5 \
                      yargs@17.7.2

            - if: needs.prepare-ci.result == 'success' && needs.unit-tests.result == 'success'
              name: Collect unit coverage reports
              run: |
                  NODE_PATH="$RUNNER_TEMP/analysis-node/node_modules" \
                      node admin/analysis/collect_ci_jest_coverage.cjs \
                      --artifacts "$RUNNER_TEMP/unit-coverage-artifacts" \
                      --coverage-output "$GITHUB_WORKSPACE/admin/coverage/all" \
                      --workspace "$GITHUB_WORKSPACE"

            - if: needs.prepare-ci.result == 'success' && needs.unit-tests.result == 'success'
              name: Extract Landing HTML
              run: |
                  set -euo pipefail

                  mapfile -t landing_archives < <(find "$RUNNER_TEMP/unit-coverage-artifacts" -path '*/landing/outputs.zip' -type f)
                  if [ "${#landing_archives[@]}" -ne 1 ]; then
                      echo "Expected one Landing artifact, found ${#landing_archives[@]}." >&2
                      exit 1
                  fi
                  rm -rf "$RUNNER_TEMP/landing-output"
                  mkdir -p "$RUNNER_TEMP/landing-output"
                  unzip -q "${landing_archives[0]}" -d "$RUNNER_TEMP/landing-output"
                  test -f "$RUNNER_TEMP/landing-output/landing-html/landing/index.html"

            - if: needs.prepare-ci.result == 'success' && needs.unit-tests.result == 'success'
              name: Publish analysis branch deploy
              env:
                  CYBERWORLDS_ANALYSIS_PAT: ${{ secrets.CYBERWORLDS_ANALYSIS_PAT }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  if [ -z "${CYBERWORLDS_ANALYSIS_PAT:-}" ]; then
                      echo "CYBERWORLDS_ANALYSIS_PAT is required to publish analysis." >&2
                      exit 1
                  fi

                  analysis_remote="https://github.com/cyberworlds/cyberworlds-analysis.git"
                  analysis_auth="$(printf 'x-access-token:%s' "$CYBERWORLDS_ANALYSIS_PAT" | base64 | tr -d '\n')"
                  analysis_publish_job_url="$(gh api \
                      "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
                      --paginate \
                      --jq '.jobs[] | select(.name == "Unit tests") | .html_url' \
                      | tail -n 1)"
                  if [ -z "$analysis_publish_job_url" ]; then
                      analysis_publish_job_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  fi
                  echo "::add-mask::$analysis_auth"

                  GIT_CONFIG_COUNT=1 \
                  GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
                  GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $analysis_auth" \
                  NODE_PATH="$RUNNER_TEMP/analysis-node/node_modules" \
                      node admin/analysis/publish_analysis_html.cjs \
                      --workspace "$GITHUB_WORKSPACE" \
                      --landing "$RUNNER_TEMP/landing-output/landing-html" \
                      --message "$analysis_publish_job_url" \
                      --remote "$analysis_remote" \
                      --source-branch "$GITHUB_REF_NAME" \
                      --source-commit "$GITHUB_SHA" \
                      --push

                  GIT_CONFIG_COUNT=1 \
                  GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
                  GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $analysis_auth" \
                  NODE_PATH="$RUNNER_TEMP/analysis-node/node_modules" \
                      node admin/analysis/publish_landing_catalog.cjs \
                      --workspace "$GITHUB_WORKSPACE" \
                      --message "$analysis_publish_job_url" \
                      --remote "$analysis_remote"

    integration-tests-check:
        name: Integration tests
        if: always()
        needs: [prepare-ci, integration-tests]
        runs-on: ubuntu-latest
        steps:
            - if: needs.prepare-ci.result != 'success'
              name: Verify CI preparation passed
              run: |
                  echo "Prepare CI failed: ${{ needs.prepare-ci.result }}" >&2
                  exit 1

            - if:
                  needs.prepare-ci.result == 'success' && needs.integration-tests.result !=
                  'success'
              name: Checkout repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - if:
                  needs.prepare-ci.result == 'success' && needs.integration-tests.result !=
                  'success'
              name: Aggregate and verify integration test results
              uses: ./.github/actions/aggregate-test-results
              with:
                  test-type: integration
                  test-result: ${{ needs.integration-tests.result }}

    screenshot-tests-check:
        name: Screenshot tests
        if: always()
        needs: [prepare-ci, screenshot-tests]
        runs-on: ubuntu-latest
        steps:
            - if: needs.prepare-ci.result != 'success'
              name: Verify CI preparation passed
              run: |
                  echo "Prepare CI failed: ${{ needs.prepare-ci.result }}" >&2
                  exit 1

            - if: needs.prepare-ci.result == 'success' && needs.screenshot-tests.result != 'success'
              name: Checkout repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - if: needs.prepare-ci.result == 'success' && needs.screenshot-tests.result != 'success'
              name: Aggregate and verify screenshot test results
              uses: ./.github/actions/aggregate-test-results
              with:
                  test-type: screenshot
                  test-result: ${{ needs.screenshot-tests.result }}

    schedule-deploy:
        name: Schedule deploy
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.SCHEDULE_DEPLOY_AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.SCHEDULE_DEPLOY_AWS_SECRET_ACCESS_KEY }}
        # If tests pass and we're on the main branch then schedule a deploy by sending
        # a message to our job queue via lambda. This will make sure our commit is eventually
        # deployed.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        needs: [unit-tests-check, integration-tests-check, screenshot-tests-check]
        steps:
            - name: Schedule deploy
              run: |
                  aws lambda invoke \
                      --function-name ${{ secrets.SCHEDULE_DEPLOY_AWS_LAMBDA_FUNCTION_NAME }} \
                      --payload "{ \"commitSha\": \"${{ github.sha }}\" }" \
                      --cli-binary-format raw-in-base64-out \
                      --region us-east-1 \
                      response.json
