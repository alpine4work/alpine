name: Test
on: push

jobs:
    test:
        name: Test
        runs-on: [self-hosted, aws-test]
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - id: date
              name: Get date
              shell: bash
              run: |
                  echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT

            # Use cache save/restore actions separately. So we can only save a cache on the
            # main branch.
            - name: Restore Bazel cache
              uses: actions/cache/restore@v3
              with:
                  path: |
                      ~/.cache/bazel
                      ~/.cache/bazelisk
                  key: |
                      bazel-${{ runner.os }}-${{ runner.arch }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      bazel-${{ runner.os }}-${{ runner.arch }}-

            # Run TypeScript, ESLint, and Prettier first. These tests are fast and easily
            # cacheable. If TypeScript fails it's also very likely unit tests or
            # integration tests will fail since some code is not structured properly.
            #
            # Running these tests first gives the developer fast feedback. It also leads to
            # a lower total cost for CI since we can stop executing tests early on a type
            # system failure.
            - name: Test (tier 1)
              run: |
                  admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //... --test_tag_filters=dev-check,-playwright

            # NOCOMMIT:
            #
            # - name: Test (tier 2)
            #   run: |
            #       admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //server/accounts:accounts_table_test

            # NOCOMMIT:
            #
            # # After our tier 1 tests pass run all other tests except integration tests
            # # written for Playwright. Playwright integration tests are expensive so we only
            # # run them once all other tests have passed.
            # - name: Test (tier 2)
            #   run: |
            #       admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //... --test_tag_filters=-dev-check,-playwright

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@v4
              with:
                  name: bazel_testlogs
                  path: bazel-testlogs
                  retention-days: 7

            # Only save caches on the main branch and save a new cache once per day. The
            # cache covers everything. Including external dependencies and build outputs.
            #
            # It may be worth exploring using Bazel remote caching instead of using the
            # GitHub actions cache to get more granular rule-by-rule caching. Also cache
            # upload/download may be faster. Currently compressing/decompressing the cache
            # takes a good chunk of our CI time.
            - if: github.ref == 'refs/heads/main'
              name: Save Bazel cache
              uses: actions/cache/save@v3
              with:
                  path: |
                      ~/.cache/bazel
                      ~/.cache/bazelisk
                  key: |
                      bazel-${{ runner.os }}-${{ runner.arch }}-${{ steps.date.outputs.date }}

