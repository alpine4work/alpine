name: Test
on: push

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Get date
              id: date
              shell: bash
              run: |
                  echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT

            - name: Cache Bazel output
              id: bazel-cache
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.cache/bazelisk
                      ~/.cache/bazel
                  key: test-${{ runner.os }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      test-${{ runner.os }}-

            - name: Test
              run: |
                  "${GITHUB_WORKSPACE}/admin/bin/bazel" test //... --test_tag_filters=-playwright

    test_playwright:
        name: Test Playwright
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            # Unfortunate that Bazel can't install these since they're global dependencies.
            - name: Install Playwright dependencies
              run:
                  sudo apt-get install libvpx7 libevent-2.1-7 libopus0 libwoff1 libharfbuzz-icu0
                  libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 libhyphen0 libmanette-0.2-0
                  libgles2 gstreamer1.0-libav

            - name: Get date
              id: date
              shell: bash
              run: |
                  echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT

            - name: Cache Bazel output
              id: bazel-cache
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.cache/bazelisk
                      ~/.cache/bazel
                  key: test_playwright-${{ runner.os }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      test_playwright-${{ runner.os }}-

            # Run Playwright tests sequentially instead of in parallel. The current
            # machines running GitHub actions are resource constrained and frequently run
            # into timeouts when executing Playwright tests. Running locally on my laptop,
            # parallel execution of Playwright tests is fine. When we upgrade our GitHub
            # Actions machines we can go back to executing these tests in parallel to
            # speed up CI.
            - name: Test Playwright
              run: |
                  "${GITHUB_WORKSPACE}/admin/bin/bazel" test //... --test_tag_filters=playwright --jobs=1
