name: Test
on: push

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Get date
              id: date
              shell: bash
              run: |
                  echo "date=$(/bin/date -u "+%Y-%m-%d")" >> $GITHUB_OUTPUT

            - name: Cache Bazel output
              id: bazel-cache
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.cache/bazelisk
                      ~/.cache/bazel
                  key: ${{ runner.os }}-${{ steps.date.outputs.date }}
                  restore-keys: |
                      ${{ runner.os }}-

            - name: Test
              run: |
                  "${GITHUB_WORKSPACE}/admin/bin/bazel" test //... --local_ram_resources=HOST_RAM --local_cpu_resources=HOST_CPUS
