name: Test
on: push

jobs:
    test:
        name: Test
        runs-on: [self-hosted, aws-test]
        env:
            # Bazel should `clang` instead of `gcc` when compiling C++ code. This is
            # required for compiling Swift code on Linux. See the [`rules_swift`
            # documentation][1]. Generally [`clang` and `gcc` are interchangeable][2].
            # The big difference is `clang` has an LLVM backend whereas `gcc` has its
            # own backend.
            #
            # [1]: https://github.com/bazelbuild/rules_swift
            # [2]: https://www.reddit.com/r/C_Programming/comments/som4ys/gcc_or_clang/
            CC: clang
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            # We cache Bazel external repositories with [GitHub's cache action][1]. We
            # cache individual build rule results with [Bazel remote caching][2].
            #
            # The following restores the previously saved Bazel repository cache. The Bazel
            # repository's cache key includes a hash of all files that contribute to the
            # external repositories we download. All external repositories are defined in
            # `WORKSPACE` or a file referenced by `WORKSPACE` (e.g. `pnpm-lock.yaml` which
            # is used by the `npm_translate_lock()` call in `WORKSPACE`).
            #
            # We also include the Bazel binary installed by Bazelisk in this cache so we
            # include a hash of `.bazelversion`.
            #
            # [1]: https://github.com/actions/cache
            # [2]: https://bazel.build/remote/caching
            - id: cache
              name: Restore Bazel repositories cache
              uses: actions/cache/restore@v3
              with:
                  path: |
                      ~/.cache/bazelisk
                      ~/.cache/bazel
                  key: |
                      bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'WORKSPACE', 'pnpm-lock.yaml', 'requirements.txt', 'admin/patches/bazel/*.patch') }}
                  restore-keys: |
                      bazel-${{ runner.os }}-${{ runner.arch }}-

            # If we don't have an exact cache entry match then we need to fetch
            # repositories we'll need for our build.
            #
            # From the [`actions/cache` documentation][1]:
            #
            # > Note: `cache-hit` will be set to `true` only when cache hit occurs for the
            # > exact `key` match. For a partial key match via `restore-keys` or a cache
            # > miss, it will be set to `false`.
            #
            # [1]: https://github.com/actions/cache/blob/main/restore/README.md
            - if: steps.cache.outputs.cache-hit != 'true'
              name: Fetch Bazel repositories
              shell: bash
              run: |
                  admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc fetch //... --config=github-runner --build_tests_only

            # Save our repository cache after we finish fetching but before we run our
            # tests! The ordering here is important since we don't want to include test
            # build artifacts in the cache. Only fetched external repositories.
            #
            # We only save new cache entries on the `main` branch. So if you're iterating
            # on a PR we don't save a bunch of cache entries that'll never be used again.
            - if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
              name: Save Bazel repositories cache
              uses: actions/cache/save@v3
              with:
                  path: |
                      ~/.cache/bazelisk
                      ~/.cache/bazel
                  key: ${{ steps.cache.outputs.cache-primary-key }}

            # This starts the Bazel remote cache proxy server. We store [Bazel remote
            # cache][1] files in AWS S3. The AWS S3 API is mostly compatible with what
            # Bazel remote caching expects (`PUT` request to write file, `GET` request to
            # read file) but Bazel can't sign requests for AWS S3.
            #
            # So we have a small Node.js proxy server that signs requests from Bazel with
            # the IAM role of our GitHub runner in AWS and forwards the request to S3.
            # Since the server runs before we can build anything with Bazel it uses the
            # Node.js version provided by the Ubuntu package manager
            # (`apt-get install nodejs`, which is Node.js v12) without any third party
            # dependencies from our `package.json`.
            #
            # ## Debugging cache misses
            #
            # If you're seeing tests re-execute across builds that you wouldn't expect
            # would need to re-execute based on the files that changed follow the guide
            # “[Debugging Remote Cache Hits for Remote Execution][2].”
            #
            # You can simulate a remote cache locally with the [`buchgr/bazel-remote`][3]
            # project to reproduce the cache miss.
            #
            # I (@calebmer) had to debug cache misses for the test
            # `//server/forum/realtime:realtime_tests_typecheck_test`. To do this, I
            # created two `cyberworlds` checkouts on my machine (in `a/cyberworlds` and
            # `b/cyberworlds`) and ran the following commands adapted from the [Bazel
            # remote cache hit debugging guide][2] (replace `$LOCAL` with some directory
            # on your machine to write the logs):
            #
            # ```sh
            # cd a/cyberworlds && \
            #     bazel clean && \
            #     bazel \
            #         --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc \
            #         test //server/forum/realtime:realtime_tests_typecheck_test \
            #         --show_progress_rate_limit=0.2 \
            #         --remote_cache=http://localhost:8080
            #
            # cd a/cyberworlds && \
            #     bazel clean &&
            #     bazel \
            #         --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc \
            #         test //server/forum/realtime:realtime_tests_typecheck_test \
            #         --show_progress_rate_limit=0.2 \
            #         --remote_cache=http://localhost:8080 \
            #         --execution_log_binary_file=$LOCAL/a.log \
            #         --noremote_upload_local_results
            #
            # cd b/cyberworlds && \
            #     bazel clean &&
            #     bazel \
            #         --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc \
            #         test //server/forum/realtime:realtime_tests_typecheck_test \
            #         --show_progress_rate_limit=0.2 \
            #         --remote_cache=http://localhost:8080 \
            #         --execution_log_binary_file=$LOCAL/b.log \
            #         --noremote_upload_local_results
            # ```
            #
            # This uses a similar configuration to CI. Once you have a local reproduction
            # of the miss and have execution log files you can continue following the steps
            # in Bazel's debugging guide.
            #
            # [1]: https://bazel.build/remote/caching
            # [2]: https://bazel.build/remote/cache-remote
            # [3]: https://github.com/buchgr/bazel-remote
            - name: Start Bazel remote cache
              shell: bash
              run: |
                  admin/aws/internal/aws_github_runners_bazel_remote_cache.sh

            # Run TypeScript, ESLint, and Prettier first. These tests are fast and easily
            # cacheable. If TypeScript fails it's also very likely unit tests or
            # integration tests will fail since some code is not structured properly.
            #
            # Running these tests first gives the developer fast feedback. It also leads to
            # a lower total cost for CI since we can stop executing tests early on a type
            # system failure.
            - name: Test (tier 1)
              run: |
                  admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //... --config=github-runner --test_tag_filters=dev-check,-playwright

            # NOCOMMIT:
            #
            # - name: Test (tier 2)
            #   run: |
            #       admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //server/accounts:accounts_table_test --config=github-runner

            # NOCOMMIT:
            #
            # # After our tier 1 tests pass run all other tests except integration tests
            # # written for Playwright. Playwright integration tests are expensive so we only
            # # run them once all other tests have passed.
            # - name: Test (tier 2)
            #   run: |
            #       admin/bin/bazel --bazelrc=admin/bazel/aspect_bazelrc/ci.bazelrc test //... --config=github-runner --test_tag_filters=-dev-check,-playwright

            - if: failure()
              name: Upload Bazel test logs
              uses: actions/upload-artifact@v4
              with:
                  name: bazel_testlogs
                  path: bazel-testlogs
                  retention-days: 7
