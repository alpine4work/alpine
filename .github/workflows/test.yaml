#         # inconsistency variable.
#         #
#         # This does mean Playwright tests don't need to sniff the operating system to
#         # choose between "cmd" and "ctrl" for keyboard shortcuts like "cmd-c" so tests
#         # may end up being a little less resilient by not running on two OSs.
#         runs-on: macos-latest
