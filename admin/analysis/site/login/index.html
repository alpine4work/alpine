<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>analysis login</title>
        <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
        <style>
            body {
                align-items: center;
                display: flex;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                justify-content: center;
                margin: 0;
                min-height: 100vh;
            }

            main {
                align-items: center;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            button {
                background: #111827;
                border: 1px solid #111827;
                border-radius: 8px;
                color: #ffffff;
                cursor: pointer;
                font: inherit;
                min-width: 144px;
                padding: 12px 18px;
            }

            button:hover {
                background: #374151;
                border-color: #374151;
            }

            #status {
                color: #4b5563;
                margin: 0;
                min-height: 24px;
            }
        </style>
    </head>
    <body>
        <main>
            <button id="login-button" type="button">Log in</button>
            <p id="status"></p>
        </main>
        <script>
            const alpineRole = "alpine";
            const fallbackHomePath = "/";
            const identityCallbackTokenNames = [
                "confirmation_token",
                "email_change_token",
                "invite_token",
                "recovery_token",
            ];
            const loginButton = document.getElementById("login-button");
            const statusElement = document.getElementById("status");
            const identityCallbackTokenName = getIdentityCallbackTokenName();
            let accessCheckInProgress = false;

            window.netlifyIdentity.on("init", user => {
                if (user) {
                    checkAccessAndRedirect(user);
                    return;
                }
                if (!identityCallbackTokenName) return;
                statusElement.textContent = "Complete the sign-in request in the dialog.";
                window.netlifyIdentity.open();
            });
            window.netlifyIdentity.on("login", user => {
                window.netlifyIdentity.close();
                if (user) checkAccessAndRedirect(user);
            });
            window.netlifyIdentity.on("close", () => {
                if (!identityCallbackTokenName) return;
                if (window.netlifyIdentity.currentUser()) return;
                statusElement.textContent = "The sign-in request was not completed.";
            });
            window.netlifyIdentity.on("error", error => {
                statusElement.textContent = error.message || "Sign in failed.";
            });
            window.netlifyIdentity.init();

            loginButton.addEventListener("click", () => {
                statusElement.textContent = "";
                window.netlifyIdentity.open("login");
            });

            function getIdentityCallbackTokenName() {
                const urlSearchParams = new URLSearchParams(window.location.hash.slice(1));
                return identityCallbackTokenNames.find(tokenName => urlSearchParams.has(tokenName));
            }

            async function checkAccessAndRedirect(user) {
                if (accessCheckInProgress) return;
                accessCheckInProgress = true;
                statusElement.textContent = "Checking access...";

                try {
                    const jwt = await user.jwt(true);
                    if (!hasAlpineRole(jwt)) {
                        statusElement.textContent =
                            "Signed in, but this account does not have analysis access yet.";
                        accessCheckInProgress = false;
                        return;
                    }

                    window.location.replace(getDestinationPath());
                } catch (error) {
                    statusElement.textContent = error.message || "Unable to verify access.";
                    accessCheckInProgress = false;
                }
            }

            function hasAlpineRole(jwt) {
                const payload = parseJwtPayload(jwt);
                const roles = [
                    ...arrayOrEmpty(payload?.app_metadata?.roles),
                    ...arrayOrEmpty(payload?.roles),
                ];
                return roles.includes(alpineRole);
            }

            function parseJwtPayload(jwt) {
                try {
                    const payload = jwt.split(".")[1];
                    if (!payload) return null;

                    const normalizedPayload = payload.replace(/-/g, "+").replace(/_/g, "/");
                    const paddedPayload = normalizedPayload.padEnd(
                        Math.ceil(normalizedPayload.length / 4) * 4,
                        "=",
                    );
                    return JSON.parse(window.atob(paddedPayload));
                } catch {
                    return null;
                }
            }

            function arrayOrEmpty(value) {
                return Array.isArray(value) ? value : [];
            }

            function getDestinationPath() {
                if (window.location.pathname.startsWith("/login")) return fallbackHomePath;
                return `${window.location.pathname}${window.location.search}` || fallbackHomePath;
            }
        </script>
    </body>
</html>
