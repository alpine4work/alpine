<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex,nofollow" />
        <title>analysis preview</title>
        <style>
            body {
                align-items: center;
                display: flex;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                justify-content: center;
                margin: 0;
                min-height: 100vh;
            }
            main {
                align-items: center;
                display: flex;
                flex-direction: column;
                gap: 12px;
                padding: 24px;
            }
            .primary-links {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                justify-content: center;
            }
            .primary-link {
                align-items: center;
                background: #111827;
                border: 1px solid #111827;
                border-radius: 8px;
                color: #ffffff;
                display: inline-flex;
                justify-content: center;
                min-height: 44px;
                min-width: 144px;
                padding: 0 18px;
                text-decoration: none;
            }
            .primary-link:hover {
                background: #374151;
                border-color: #374151;
            }
            .main-link {
                color: #3b82f6;
                font-size: 13px;
                opacity: 0.68;
                padding: 4px 8px;
                text-decoration: none;
            }
            .main-link:hover {
                opacity: 1;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="primary-links">
                <a class="primary-link" href="/coverage/">Coverage</a>
                <a class="primary-link" href="/landing/">Landing</a>
            </div>
            <a class="main-link" href="https://analysis.cyberworlds.dev/">View main</a>
        </main>
    </body>
</html>
