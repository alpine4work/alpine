            body {

                justify-content: center;
                align-items: center;
                width: 100vw;
                min-height: 100vh;
                margin: 0;
                padding: 8px;
            }

            .icon-grid {
                display: grid;
                grid-template-columns: repeat(9, 64px);
                gap: 8px;
            }

            .icon-container {
                width: 64px;
                height: 64px;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #ffffff;
            }

            .icon-container:nth-child(9n) {
                border-right: none;
            }

            .icon-container img {
                max-width: 60px;
                max-height: 60px;
                object-fit: contain;
                /* filter: brightness(0%) blur(20px); */
            }
        </style>
    </head>
