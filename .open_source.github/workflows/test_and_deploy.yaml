name: CI

on:
    push:
        branches: [main]
    schedule:
        - cron: "17 9 * * *"
    workflow_dispatch:

permissions:
    contents: read

# TODO(#open-source): Enable npm publishing after its credentials are reviewed.
env:
    NPM_REPOSITORY: alpine4work/cli

jobs:
    ci-job:
        name: ci-job
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: ci-job
              uses: ./.open_source.github/actions/test
              env:
                  CLI_TEST_ALPINE_API_KEY: ${{ secrets.CLI_TEST_ALPINE_API_KEY }}

