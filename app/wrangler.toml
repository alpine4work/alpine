name = "app"
main = "./build/server.js"
compatibility_date = "2022-07-12"
workers_dev = false

[route]
pattern = "cyberworlds.dev/*"
zone_name = "cyberworlds.dev"

[site]
bucket = "./public"

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[[durable_objects.bindings]]
name = "DocumentCollaborationDurableObjectNamespace"
class_name = "DocumentCollaborationDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["DocumentCollaborationDurableObject"]
